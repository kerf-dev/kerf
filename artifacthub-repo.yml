# Artifact Hub repository metadata for the Kerf Helm chart (https://artifacthub.io/packages/search?ts_query_web=kerf).
# Docs: https://artifacthub.io/docs/topics/repositories/helm-charts/
#
# The chart is published as an OCI artifact (oci://ghcr.io/kerf-dev/kerf/charts/kerf), so Artifact Hub reads this
# file from the tag `artifacthub.io` of that repository, not from Git. The release workflow pushes it on every
# release (.github/workflows/release.yaml, "Artifact Hub repository metadata"); by hand:
#
#   oras push ghcr.io/kerf-dev/kerf/charts/kerf:artifacthub.io \
#     --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
#     artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
#
# The package metadata (description, links, images, CRDs, changes, signature) lives in deploy/charts/kerf/Chart.yaml.
# Registering the repository on artifacthub.io, and claiming Verified Publisher, is a maintainer's step.

# Shown by Artifact Hub after the repository is added (Control Panel -> Repositories). Uncomment and set it, and the
# next release marks the repository as a Verified Publisher.
# repositoryID: 00000000-0000-0000-0000-000000000000

# The Artifact Hub users who may claim and manage the repository (Owners). Uncomment with the email of the
# Artifact Hub account of each maintainer.
# owners:
#   - name: Kerf maintainers
#     email: maintainers@getkerf.dev
