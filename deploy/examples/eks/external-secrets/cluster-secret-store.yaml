# AWS Secrets Manager for the External Secrets Operator (one per cluster: the hub and every
# workload cluster). No `auth`: ESO uses its own pod's credentials, i.e. the EKS Pod Identity
# association of ServiceAccount external-secrets/external-secrets with the role that has
# iam/eso-policy.json (docs/install/eks.md, step 3).
# Placeholder: eu-west-1 (the region of the secrets).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
