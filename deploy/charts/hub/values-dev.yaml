# Shared k3d dev environment (ro-hub). Endpoints: dev/README.md.
image:
  repository: k3d-ro-registry:5005/kerf/hub
  pullPolicy: Always

service:
  type: NodePort
  nodePort: 30080          # host localhost:18080; spokes use http://hub-api.hub.svc:8080

database:
  url: postgres://kerf:kerf@postgres.postgres.svc:5432/kerf?sslmode=disable

# Development tokens — documented in README.md. Never reuse outside the local environment.
devSeed:
  enabled: true
  clusters: [ro-spoke-1, ro-spoke-2, synth-a, synth-b]
  tokens:
    ro-spoke-1: ro-dev-rospoke1-2b8dbdc041b28d5865e7caf7
    ro-spoke-2: ro-dev-rospoke2-22690fedaab92db2f9f3b91b
    synth-a: ro-dev-syntha-624ec11020f8aadc7458d7a6
    synth-b: ro-dev-synthb-a06443f1dbc00f61be2e0900
    ui: ro-dev-ui-97446cd3a095035d6290abc5
    admin: ro-dev-admin-1b71e51dc42ec5deb56e7f06
    # Pricing service: metrics bindings and the datasource query proxy.
    pricing: ro-dev-pricing-5f0c3b7e9a1d24c86e13a0b2
  # Local users for the admin area. Development only — the passwords are in Git.
  users:
    - {username: viewer, displayName: Viewer, role: viewer, password: ro-dev-viewer-pass}
    - {username: operator, displayName: Operator, role: operator, password: ro-dev-operator-pass}
    - {username: admin, displayName: Admin, role: admin, password: ro-dev-admin-pass}

# Plain HTTP on localhost:18080 / the web's nginx: the cookie cannot be Secure.
auth:
  cookieSecure: false
  # Sign-in with the fleet's Dex (dev/manifests/hub/dex.yaml; users in dev/README.md). Browsers reach the
  # issuer at localhost:15556, the hub at the Dex Service (connectAddress). Development only: the client
  # secret is in Git.
  oidc:
    enabled: true
    name: Dex
    issuer: http://localhost:15556/dex
    connectAddress: dex.dex.svc.cluster.local:5556
    clientID: kerf
    redirectURL: http://localhost:19090/v1/auth/oidc/callback
    scopes: [openid, profile, email, groups, offline_access]
    roleMappings:
      - {group: kerf-admins, role: admin}
      - {group: kerf-operators, role: operator}
      - {group: kerf-viewers, role: viewer}
    refreshInterval: 1m
    clientSecret:
      value: ro-dev-oidc-3f9a6c1e8b2d7054e1a9c6b3

# Notifications: messages link to the web UI on localhost; plain-HTTP receivers are allowed so the e2e
# suite can run a fake one on the host (test/e2e/notifications_test.go, via host.k3d.internal).
notifications:
  baseURL: http://localhost:19090
  allowInsecureHTTP: true

config:
  prometheusURL: http://victoria-metrics.monitoring.svc:8428
  corsOrigins: ["http://localhost:5173"]
  recommender:
    interval: 5m
    # Runs (and POST /v1/admin/recompute, which the e2e suite calls per cluster) use usage up to
    # the last 30 s instead of the last full 5-minute step, so a new workload gets a
    # recommendation a minute after it starts. Production default: the step.
    endAlignment: 30s
    # History before the first regular run, computed from the stored metrics: one run as of each
    # UTC midnight of the 29 days before it (the synthetic data covers 30 days). Missing days are
    # filled at every start, between the regular runs; runs off that grid are replaced.
    backfill:
      runs: 29
      every: 24h
  history:
    fullResolution: 6h
    retention: 720h
  onboarding:
    checkInterval: 10m
    hubURL: http://hub-api.hub.svc:8080
    chart: deploy/charts/kerf
    imageRegistry: k3d-ro-registry:5005
