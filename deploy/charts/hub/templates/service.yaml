{{- if include "hub.c.enabled" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hub.fullname" . }}
  labels: {{- include "hub.labels" . | nindent 4 }}
  {{- if or .Values.service.scrape .Values.service.annotations }}
  annotations:
    {{- if .Values.service.scrape }}
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
    {{- end }}
    {{- with .Values.service.annotations }}{{ toYaml . | nindent 4 }}{{ end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "hub.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
{{ end -}}
