{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hub.fullname" . }}
  labels: {{- include "hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "hub.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress{{ if $np.egress.enabled }}, Egress{{ end }}]
  ingress:
    # API and /metrics share the port: the web UI and pricing of this namespace, plus the listed
    # peers (ingress controller or ALB, agents in other clusters, the metrics scraper).
    - ports:
        - {protocol: TCP, port: http}
      from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [web, pricing]}
        {{- with $np.ingress.from }}{{ toYaml . | nindent 8 }}{{ end }}
        {{- with $np.ingress.metricsFrom }}{{ toYaml . | nindent 8 }}{{ end }}
  {{- if $np.egress.enabled }}
  egress:
    {{- include "hub.c.egressRules" (dict "ctx" . "ports" (prepend ($np.egress.ports | default list) .Values.database.port)) }}
  {{- end }}
{{- end }}
