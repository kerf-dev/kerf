{{- if include "hub.c.enabled" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hub.fullname" . }}-config
  labels: {{- include "hub.labels" . | nindent 4 }}
data:
  hub.yaml: |
    {{- $cfg := deepCopy .Values.config }}
    {{- $_ := set $cfg "migrationsDir" "/migrations" }}
    {{- if .Values.devSeed.enabled }}
    {{- $_ := set $cfg "devSeed" (dict "enabled" true "clusters" .Values.devSeed.clusters "tokensDir" "/etc/hub/dev-tokens" "usersFile" "/etc/hub/dev-users/users.yaml") }}
    {{- end }}
    {{- $auth := omit .Values.auth "bootstrapAdmin" }}
    {{- if include "hub.bootstrapSecret" . }}
    {{- $_ := set $auth "bootstrapAdmin" (dict "username" .Values.auth.bootstrapAdmin.username "passwordFile" "/etc/hub/bootstrap-admin/password" "mustChangePassword" (eq (include "hub.bootstrapGenerated" .) "true")) }}
    {{- end }}
    {{- if include "hub.localTokensSecret" . }}
    {{- $g := .Values.global | default dict }}
    {{- $_ := set $cfg "localTokens" (dict "dir" "/etc/hub/local-tokens" "cluster" (ternary $g.clusterName "" (eq (toString $g.mode) "all"))) }}
    {{- end }}
    {{- $oidc := omit (default (dict) .Values.auth.oidc) "clientSecret" }}
    {{- if $oidc.enabled }}
    {{- if not (include "hub.oidcSecret" .) }}{{ fail "auth.oidc.enabled needs the client secret: auth.oidc.clientSecret.existingSecret, .externalSecret or (development) .value" }}{{ end }}
    {{- $_ := set $oidc "clientSecretFile" "/etc/hub/oidc/client-secret" }}
    {{- end }}
    {{- $_ := set $auth "oidc" $oidc }}
    {{- $samlIn := default (dict) .Values.auth.saml }}
    {{- $saml := omit $samlIn "idpMetadataSecret" "spKeySecret" }}
    {{- if $saml.enabled }}
    {{- $mdSecret := dig "idpMetadataSecret" "existingSecret" "" $samlIn }}
    {{- if and $saml.idpMetadataURL $mdSecret }}{{ fail "auth.saml: idpMetadataURL and idpMetadataSecret.existingSecret are exclusive" }}{{ end }}
    {{- if not (or $saml.idpMetadataURL $mdSecret) }}{{ fail "auth.saml.enabled needs the IdP's metadata: auth.saml.idpMetadataURL or auth.saml.idpMetadataSecret.existingSecret" }}{{ end }}
    {{- if not $saml.acsURL }}{{ fail "auth.saml.enabled needs auth.saml.acsURL: https://<UI host>/v1/auth/saml/acs" }}{{ end }}
    {{- if $mdSecret }}{{ $_ := set $saml "idpMetadataFile" "/etc/hub/saml-idp/metadata.xml" }}{{ end }}
    {{- if dig "spKeySecret" "existingSecret" "" $samlIn }}
    {{- $_ := set $saml "spKeyFile" "/etc/hub/saml-sp/tls.key" }}
    {{- $_ := set $saml "spCertFile" "/etc/hub/saml-sp/tls.crt" }}
    {{- end }}
    {{- end }}
    {{- $_ := set $auth "saml" $saml }}
    {{- $_ := set $cfg "auth" $auth }}
    {{- $onb := deepCopy (default (dict) .Values.config.onboarding) }}
    {{- if include "hub.datasourceKeyEnabled" . }}
    {{- $_ := set $onb "secretsKeyFile" "/etc/hub/datasource-key/key" }}
    {{- end }}
    {{- range $i, $d := .Values.onboarding.datasourceSecrets }}
    {{- if or (gt (len (toString $d.name)) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" (toString $d.name))) }}{{ fail (printf "onboarding.datasourceSecrets[%d].name must be a Kubernetes Secret name (lowercase letters, digits, '-' and '.')" $i) }}{{ end }}
    {{- if not $d.existingSecret }}{{ fail (printf "onboarding.datasourceSecrets[%d].existingSecret is required" $i) }}{{ end }}
    {{- end }}
    {{- if .Values.onboarding.datasourceSecrets }}
    {{- $_ := set $onb "datasourceSecretsDir" "/etc/hub/datasource-secrets" }}
    {{- end }}
    {{- if .Chart.AppVersion }}
    {{- if not (hasKey $onb "hubVersion") }}{{- $_ := set $onb "hubVersion" .Chart.AppVersion }}{{- end }}
    {{- end }}
    {{- $_ := set $cfg "onboarding" $onb }}
    {{- $_ := set $cfg "updateCheck" (dict "enabled" .Values.updateCheck.enabled "interval" .Values.updateCheck.interval "url" .Values.updateCheck.url) }}
    {{- $n := .Values.notifications }}
    {{- $nch := list }}
    {{- range $i, $c := $n.channels }}
    {{- if not (has $c.type (list "slack" "teams" "webhook")) }}{{ fail (printf "notifications.channels[%d].type must be slack, teams or webhook" $i) }}{{ end }}
    {{- if not $c.existingSecret }}{{ fail (printf "notifications.channels[%d].existingSecret is required" $i) }}{{ end }}
    {{- if and $c.secretKey (ne $c.type "webhook") }}{{ fail (printf "notifications.channels[%d].secretKey: only webhook channels are signed" $i) }}{{ end }}
    {{- $ch := dict "name" $c.name "type" $c.type "urlFile" (printf "/etc/hub/notifications/%d/url" $i) }}
    {{- if $c.secretKey }}{{ $_ := set $ch "secretFile" (printf "/etc/hub/notifications/%d/secret" $i) }}{{ end }}
    {{- if hasKey $c "enabled" }}{{ $_ := set $ch "enabled" $c.enabled }}{{ end }}
    {{- $nch = append $nch $ch }}
    {{- end }}
    {{- $_ := set $cfg "notifications" (dict "baseURL" $n.baseURL "rateLimitPerMinute" $n.rateLimitPerMinute "allowInsecureHTTP" $n.allowInsecureHTTP "channels" $nch) }}
    {{- $_ := set $cfg "maintenance" (dict "chartVersion" .Chart.Version "releaseName" .Release.Name "releaseNamespace" .Release.Namespace) }}
    {{- toYaml $cfg | nindent 4 }}
{{ end -}}
