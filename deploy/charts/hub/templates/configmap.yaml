{{- if include "hub.c.enabled" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hub.fullname" . }}-config
  labels: {{- include "hub.labels" . | nindent 4 }}
data:
  hub.yaml: |
    {{- $cfg := deepCopy .Values.config }}
    {{- $_ := set $cfg "migrationsDir" "/migrations" }}
    {{- if .Values.devSeed.enabled }}
    {{- $_ := set $cfg "devSeed" (dict "enabled" true "clusters" .Values.devSeed.clusters "tokensDir" "/etc/hub/dev-tokens" "usersFile" "/etc/hub/dev-users/users.yaml") }}
    {{- end }}
    {{- $auth := omit .Values.auth "bootstrapAdmin" }}
    {{- if include "hub.bootstrapSecret" . }}
    {{- $_ := set $auth "bootstrapAdmin" (dict "username" .Values.auth.bootstrapAdmin.username "passwordFile" "/etc/hub/bootstrap-admin/password") }}
    {{- end }}
    {{- $oidc := omit (default (dict) .Values.auth.oidc) "clientSecret" }}
    {{- if $oidc.enabled }}
    {{- if not (include "hub.oidcSecret" .) }}{{ fail "auth.oidc.enabled needs the client secret: auth.oidc.clientSecret.existingSecret, .externalSecret or (development) .value" }}{{ end }}
    {{- $_ := set $oidc "clientSecretFile" "/etc/hub/oidc/client-secret" }}
    {{- end }}
    {{- $_ := set $auth "oidc" $oidc }}
    {{- $_ := set $cfg "auth" $auth }}
    {{- $onb := deepCopy (default (dict) .Values.config.onboarding) }}
    {{- if include "hub.datasourceKeyEnabled" . }}
    {{- $_ := set $onb "secretsKeyFile" "/etc/hub/datasource-key/key" }}
    {{- end }}
    {{- if .Chart.AppVersion }}
    {{- if not (hasKey $onb "hubVersion") }}{{- $_ := set $onb "hubVersion" .Chart.AppVersion }}{{- end }}
    {{- end }}
    {{- $_ := set $cfg "onboarding" $onb }}
    {{- $_ := set $cfg "updateCheck" (dict "enabled" .Values.updateCheck.enabled "interval" .Values.updateCheck.interval "url" .Values.updateCheck.url) }}
    {{- $_ := set $cfg "maintenance" (dict "chartVersion" .Chart.Version "releaseName" .Release.Name "releaseNamespace" .Release.Namespace) }}
    {{- toYaml $cfg | nindent 4 }}
{{ end -}}
