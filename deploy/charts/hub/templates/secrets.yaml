{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.dbSecret" . }}
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ required "database.url or database.existingSecret is required" .Values.database.url | quote }}
{{- end }}
{{- if .Values.devSeed.enabled }}
---
# Development tokens (deploy/charts/hub/README.md). Never enable devSeed outside development.
apiVersion: v1
kind: Secret
metadata:
  name: hub-dev-tokens
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.devSeed.tokens }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
# Dev users (WO-20). Never enable devSeed outside development.
apiVersion: v1
kind: Secret
metadata:
  name: hub-dev-users
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.yaml: |
    {{- toYaml (default (list) .Values.devSeed.users) | nindent 4 }}
{{- end }}
{{- if and .Values.auth.bootstrapAdmin.password (not .Values.auth.bootstrapAdmin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.fullname" . }}-bootstrap-admin
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.auth.bootstrapAdmin.password | quote }}
{{- end }}
{{- if and .Values.onboarding.secretsKey.create (not .Values.onboarding.secretsKey.existingSecret) }}
---
# Datasource secrets encryption key (D-025). Generated once and kept across upgrades: a new key
# would make every stored datasource secret unreadable. Back it up.
{{- $name := include "hub.datasourceKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data .Values.onboarding.secretsKey.existingSecretKey) }}
  {{ .Values.onboarding.secretsKey.existingSecretKey }}: {{ index $existing.data .Values.onboarding.secretsKey.existingSecretKey }}
  {{- else }}
  {{ .Values.onboarding.secretsKey.existingSecretKey }}: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
