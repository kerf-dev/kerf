{{- if include "hub.c.enabled" . -}}
{{- $dbES := .Values.database.externalSecret | default dict }}
{{- if and (not .Values.database.existingSecret) (not $dbES.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.dbSecret" . }}
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ required "database.url, database.existingSecret or database.externalSecret is required" .Values.database.url | quote }}
{{- end }}
{{- if .Values.devSeed.enabled }}
---
# Development tokens (deploy/charts/hub/README.md). Never enable devSeed outside development.
apiVersion: v1
kind: Secret
metadata:
  name: hub-dev-tokens
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.devSeed.tokens }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
# Dev users. Never enable devSeed outside development.
apiVersion: v1
kind: Secret
metadata:
  name: hub-dev-users
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.yaml: |
    {{- toYaml (default (list) .Values.devSeed.users) | nindent 4 }}
{{- end }}
{{- $baES := .Values.auth.bootstrapAdmin.externalSecret | default dict }}
{{- if and .Values.auth.bootstrapAdmin.password (not .Values.auth.bootstrapAdmin.existingSecret) (not $baES.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.fullname" . }}-bootstrap-admin
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.auth.bootstrapAdmin.password | quote }}
{{- else if include "hub.bootstrapGenerated" . }}
---
# The bootstrap admin's password, generated once and kept across upgrades. The admin must change it at
# first sign-in. Read it with:
#   kubectl -n {{ .Release.Namespace }} get secret {{ include "hub.fullname" . }}-bootstrap-admin -o jsonpath='{.data.password}' | base64 -d
{{- $name := printf "%s-bootstrap-admin" (include "hub.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.auth.bootstrapAdmin.existingSecretKey }}: {{ include "hub.stableSecretValue" (dict "ctx" . "name" $name "key" .Values.auth.bootstrapAdmin.existingSecretKey "length" 24) }}
{{- end }}
{{- with include "hub.localTokensSecret" . }}
---
# Tokens of this release's pricing service and (global.mode all) agent, generated once and kept across
# upgrades. The hub stores their hashes at start-up; revoking one in Admin -> Access is final (delete this
# Secret and upgrade to get new ones).
{{- $g := $.Values.global | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ . }}
  labels: {{- include "hub.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  pricing: {{ include "hub.stableSecretValue" (dict "ctx" $ "name" . "key" "pricing") }}
  {{- if eq (toString $g.mode) "all" }}
  agent: {{ include "hub.stableSecretValue" (dict "ctx" $ "name" . "key" "agent") }}
  {{- end }}
{{- end }}
{{- $cs := .Values.auth.oidc.clientSecret | default dict }}
{{- if and $cs.value (not $cs.existingSecret) (not (dig "externalSecret" "enabled" false $cs)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.fullname" . }}-oidc
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $cs.existingSecretKey }}: {{ $cs.value | quote }}
{{- end }}
{{- $skES := .Values.onboarding.secretsKey.externalSecret | default dict }}
{{- if and .Values.onboarding.secretsKey.create (not .Values.onboarding.secretsKey.existingSecret) (not $skES.enabled) }}
---
# Datasource secrets encryption key. Generated once and kept across upgrades: a new key
# would make every stored datasource secret unreadable. Back it up.
{{- $name := include "hub.datasourceKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data .Values.onboarding.secretsKey.existingSecretKey) }}
  {{ .Values.onboarding.secretsKey.existingSecretKey }}: {{ index $existing.data .Values.onboarding.secretsKey.existingSecretKey }}
  {{- else }}
  {{ .Values.onboarding.secretsKey.existingSecretKey }}: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
{{- $ca := .Values.database.caBundle | default dict }}
{{- if and $ca.pem (not $ca.existingConfigMap) (not $ca.existingSecret) }}
---
# CA bundle for the database connection (sslmode=verify-full).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hub.fullname" . }}-db-ca
  labels: {{- include "hub.labels" . | nindent 4 }}
data:
  {{ $ca.key }}: {{ $ca.pem | quote }}
{{- end }}
{{ end -}}
