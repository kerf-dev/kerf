{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.dbSecret" . }}
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ required "database.url or database.existingSecret is required" .Values.database.url | quote }}
{{- end }}
{{- if .Values.devSeed.enabled }}
---
# Development tokens (deploy/charts/hub/README.md). Never enable devSeed outside development.
apiVersion: v1
kind: Secret
metadata:
  name: hub-dev-tokens
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.devSeed.tokens }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
# Dev users (WO-20). Never enable devSeed outside development.
apiVersion: v1
kind: Secret
metadata:
  name: hub-dev-users
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.yaml: |
    {{- toYaml (default (list) .Values.devSeed.users) | nindent 4 }}
{{- end }}
{{- if and .Values.auth.bootstrapAdmin.password (not .Values.auth.bootstrapAdmin.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.fullname" . }}-bootstrap-admin
  labels: {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.auth.bootstrapAdmin.password | quote }}
{{- end }}
