{{- if include "hub.c.enabled" . -}}
{{- if .Values.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
---
# Grafana dashboard (dashboards/{{ base $path }}, WO-05) for the Grafana sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard-%s" (include "hub.fullname" $) $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Values.dashboards.namespace | default $.Release.Namespace }}
  labels:
    {{- include "hub.labels" $ | nindent 4 }}
    {{- with $.Values.dashboards.labels }}{{ toYaml . | nindent 4 }}{{ end }}
  {{- with $.Values.dashboards.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
{{ end -}}
