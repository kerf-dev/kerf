{{- if include "hub.c.enabled" . -}}
{{- $dsKey := include "hub.datasourceKeyEnabled" . }}
{{- $dbCA := include "hub.dbCAEnabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hub.fullname" . }}
  labels: {{- include "hub.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ include "hub.c.replicas" . }}
  {{- end }}
  # Recreate by default: without leader election two hub pods side by side would both run
  # the recommender.
  strategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels: {{- include "hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hub.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with include "hub.serviceAccountName" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "hub.c.imagePullSecrets" (dict "ctx" . "indent" 6) }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hub
          image: {{ include "hub.c.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/etc/hub/hub.yaml", "--log-level={{ .Values.logLevel }}"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HUB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.dbSecret" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- with .Values.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.preStopSleepSeconds }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.startupProbe.enabled }}
          # Migrations run before the hub listens (cmd/hub).
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/hub/hub.yaml
              subPath: hub.yaml
            {{- if .Values.devSeed.enabled }}
            - name: dev-tokens
              mountPath: /etc/hub/dev-tokens
              readOnly: true
            - name: dev-users
              mountPath: /etc/hub/dev-users
              readOnly: true
            {{- end }}
            {{- if include "hub.bootstrapSecret" . }}
            - name: bootstrap-admin
              mountPath: /etc/hub/bootstrap-admin
              readOnly: true
            {{- end }}
            {{- if $dsKey }}
            - name: datasource-key
              mountPath: /etc/hub/datasource-key
              readOnly: true
            {{- end }}
            {{- if and .Values.auth.oidc.enabled (include "hub.oidcSecret" .) }}
            - name: oidc
              mountPath: /etc/hub/oidc
              readOnly: true
            {{- end }}
            {{- range $i, $c := .Values.notifications.channels }}
            - name: notification-{{ $i }}
              mountPath: /etc/hub/notifications/{{ $i }}
              readOnly: true
            {{- end }}
            {{- if $dbCA }}
            - name: db-ca
              mountPath: /etc/hub/db-ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}{{ toYaml . | nindent 12 }}{{ end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "hub.fullname" . }}-config
        {{- if .Values.devSeed.enabled }}
        - name: dev-tokens
          secret:
            secretName: hub-dev-tokens
        - name: dev-users
          secret:
            secretName: hub-dev-users
        {{- end }}
        {{- if include "hub.bootstrapSecret" . }}
        - name: bootstrap-admin
          secret:
            secretName: {{ include "hub.bootstrapSecret" . }}
            items:
              - key: {{ .Values.auth.bootstrapAdmin.existingSecretKey }}
                path: password
        {{- end }}
        {{- if and .Values.auth.oidc.enabled (include "hub.oidcSecret" .) }}
        - name: oidc
          secret:
            secretName: {{ include "hub.oidcSecret" . }}
            items:
              - key: {{ .Values.auth.oidc.clientSecret.existingSecretKey }}
                path: client-secret
        {{- end }}
        {{- if $dsKey }}
        - name: datasource-key
          secret:
            secretName: {{ include "hub.datasourceKeySecret" . }}
            items:
              - key: {{ .Values.onboarding.secretsKey.existingSecretKey }}
                path: key
        {{- end }}
        {{- range $i, $c := .Values.notifications.channels }}
        - name: notification-{{ $i }}
          secret:
            secretName: {{ $c.existingSecret }}
            items:
              - key: {{ $c.urlKey | default "url" }}
                path: url
              {{- if $c.secretKey }}
              - key: {{ $c.secretKey }}
                path: secret
              {{- end }}
        {{- end }}
        {{- if $dbCA }}
        {{- $ca := .Values.database.caBundle }}
        - name: db-ca
          {{- if $ca.existingSecret }}
          secret:
            secretName: {{ $ca.existingSecret }}
          {{- else }}
          configMap:
            name: {{ $ca.existingConfigMap | default (printf "%s-db-ca" (include "hub.fullname" .)) }}
          {{- end }}
            items:
              - key: {{ $ca.key }}
                path: ca.pem
        {{- end }}
        {{- with .Values.extraVolumes }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- include "hub.c.topologySpread" (dict "ctx" . "indent" 6) }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end -}}
