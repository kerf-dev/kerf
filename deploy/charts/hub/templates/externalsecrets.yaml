{{- if include "hub.c.enabled" . -}}
{{- /* Secrets from AWS Secrets Manager (or any ESO provider) through the External Secrets Operator. */}}
{{- $db := .Values.database }}
{{- $dbES := $db.externalSecret | default dict }}
{{- if $dbES.enabled }}
{{- if $db.existingSecret }}{{ fail "database.externalSecret and database.existingSecret are exclusive" }}{{ end }}
{{- $key := $db.existingSecretKey }}
{{- if eq ($dbES.source | default "rds") "rds" }}
{{- $q := list (printf "sslmode=%s" $db.sslmode) }}
{{- with include "hub.dbSSLRootCert" . }}{{ $q = append $q (printf "sslrootcert=%s" .) }}{{ end }}
{{- range $k, $v := $db.params }}{{ $q = append $q (printf "%s=%v" $k $v) }}{{ end }}
{{- $url := printf "postgres://%s:%s@%s:%v/%s?%s" "{{ .username | urlquery }}" "{{ .password | urlquery }}" (required "database.host is required with database.externalSecret.source rds" $db.host) $db.port $db.name (join "&" $q) }}
---
{{ include "hub.c.externalSecret" (dict "ctx" . "name" (include "hub.dbSecret" .) "es" $dbES
     "data" (list (dict "secretKey" "username" "property" "username") (dict "secretKey" "password" "property" "password"))
     "template" (dict $key $url)) }}
{{- else if eq $dbES.source "url" }}
---
{{ include "hub.c.externalSecret" (dict "ctx" . "name" (include "hub.dbSecret" .) "es" $dbES "data" (list (dict "secretKey" $key))) }}
{{- else }}
{{- fail "database.externalSecret.source must be rds or url" }}
{{- end }}
{{- end }}
{{- $ba := .Values.auth.bootstrapAdmin }}
{{- if dig "externalSecret" "enabled" false $ba }}
{{- if $ba.existingSecret }}{{ fail "auth.bootstrapAdmin.externalSecret and existingSecret are exclusive" }}{{ end }}
---
{{ include "hub.c.externalSecret" (dict "ctx" . "name" (include "hub.bootstrapSecret" .) "es" $ba.externalSecret "data" (list (dict "secretKey" $ba.existingSecretKey))) }}
{{- end }}
{{- $cs := .Values.auth.oidc.clientSecret | default dict }}
{{- if dig "externalSecret" "enabled" false $cs }}
{{- if $cs.existingSecret }}{{ fail "auth.oidc.clientSecret.externalSecret and existingSecret are exclusive" }}{{ end }}
---
{{ include "hub.c.externalSecret" (dict "ctx" . "name" (include "hub.oidcSecret" .) "es" $cs.externalSecret "data" (list (dict "secretKey" $cs.existingSecretKey))) }}
{{- end }}
{{- $sk := .Values.onboarding.secretsKey }}
{{- if dig "externalSecret" "enabled" false $sk }}
{{- if $sk.existingSecret }}{{ fail "onboarding.secretsKey.externalSecret and existingSecret are exclusive" }}{{ end }}
---
# Kept on uninstall like the generated key: losing it makes every stored datasource secret unreadable.
{{ include "hub.c.externalSecret" (dict "ctx" . "name" (include "hub.datasourceKeySecret" .) "es" $sk.externalSecret "data" (list (dict "secretKey" $sk.existingSecretKey)) "keep" true) }}
{{- end }}
{{ end -}}
