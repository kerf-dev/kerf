# Name of the cluster this runs in (the hub). Becomes the `cluster` label of the service's own
# kerf_pricing_* and Go runtime series; cost series carry the priced spoke's cluster instead.
clusterName: ro-hub

# Set by an umbrella chart; read by every kerf chart.
global:
  imageRegistry: ""         # prefixed to image.repository; image.registry wins over it
  imagePullSecrets: []      # names or {name: ...}
  externalSecrets:
    secretStoreRef: {}      # fallback SecretStore for every ExternalSecret

image:
  registry: ""
  repository: ghcr.io/kerf-dev/kerf/pricing
  tag: ""          # defaults to the chart appVersion
  digest: ""       # sha256:..., appended as @digest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# static | aws
provider: static
# Static provider: inline price file (format of dev/prices.yaml). Empty = the file baked into the
# image (/etc/kerf/prices.yaml, a copy of dev/prices.yaml).
prices: ""

aws:
  # AWS Pricing API endpoint region (us-east-1, eu-central-1 or ap-south-1).
  pricingRegion: us-east-1
  # Region for SDK defaults (spot price calls use each node's region).
  region: ""

# Effective rates from the AWS Cost and Usage Report (CUR 2.0 through Data Exports, Parquet in S3),
# with Savings Plans and Reserved Instances amortised (docs/pricing.md). Off by default: nodes are
# priced at list (or static) prices. An instance type without usage in the report keeps its list
# price; an unreadable report falls back to list prices after maxAge. IAM: docs/install/eks.md.
cur:
  # "" (off), athena (recommended), or s3 (reads the export's Parquet files directly; small accounts).
  source: ""
  # Region of the Athena workgroup or the export bucket; empty = aws.region or the SDK default.
  region: ""
  # How often the report is read.
  interval: 24h
  # The usage window rates are computed over.
  window: 720h
  # How long the last rates are kept while the report cannot be read; then list prices again.
  maxAge: 72h
  athena:
    # Glue database of the CUR 2.0 table (for example kerf_cur).
    database: ""
    table: ""                # e.g. data
    workgroup: primary
    catalog: ""              # empty = AwsDataCatalog
    outputLocation: ""       # s3://<bucket>/<prefix>/ for query results; empty = the workgroup's
  s3:
    bucket: ""
    prefix: ""               # the export's data path: <S3 path prefix>/<export name>/data/
    # Scratch space for one Parquet file at a time (emptyDir at /tmp); raise resources.limits.memory
    # for large files too.
    tmpSizeLimit: 1Gi

# Prometheus-compatible query URL holding the spokes' kube-state-metrics node series. Empty (the
# umbrella chart's default) with hub.url: the hub's own metrics datasource (hub.config.prometheusURL),
# read through the hub with the pricing token. When a query fails, the log names the URL and the
# value that set it.
vmURL: http://victoria-metrics.monitoring.svc:8428
# Node discovery / pricing interval, and how long a fetched price is reused.
interval: 5m
priceTTL: 24h
# A node is priced until this long after its last kube_node_labels sample.
nodeLookback: 10m
# Weight of 1 vCPU in GiB of memory for the cost split; "0" derives it per instance family (fallback 9).
cpuMemoryWeight: "0"
# PromQL regex of cluster label values to price; empty = every cluster with node metrics.
clusters: ""
# Region for nodes without topology.kubernetes.io/region or zone labels.
defaultRegion: ""
logLevel: info

# Clusters bound to other datasources are discovered through the hub's query proxy with a
# token of role pricing; empty url = only vmURL (clusters without a binding).
hub:
  url: ""
  # The token of role pricing. Without it pricing logs "hub token missing: Secret <namespace>/<name>
  # key <key>" on every refresh and is not Ready. Umbrella chart (global.mode hub and all): with name,
  # create and externalSecret all unset, the token the hub chart generates (Secret
  # <hub name>-local-tokens, key pricing); name set: your own Secret.
  tokenSecret:
    name: ""                # umbrella default: <pricing name>-hub-token for create / externalSecret
    key: token
    # create: true makes the chart create the Secret from `token` (local development only).
    create: false
    token: ""
    # External Secrets Operator: builds Secret `name` (key `key`) from Secrets Manager.
    externalSecret:
      enabled: false
      remoteRef:
        key: ""             # e.g. kerf/pricing/hub-token
        property: ""        # e.g. token (JSON secret); empty = the whole secret string
        version: ""
      refreshInterval: ""
      secretStoreRef: {}
  # CA that signed the hub's HTTPS certificate, when it is not publicly trusted (a private CA; an
  # ACM public certificate needs nothing). Added to the system roots (SSL_CERT_DIR), mounted at
  # /etc/kerf/hub-ca. One of existingConfigMap, existingSecret or pem (inline,
  # rendered into ConfigMap <release>-hub-ca).
  caBundle:
    existingConfigMap: ""
    existingSecret: ""
    key: ca.crt
    pem: ""

# External Secrets Operator settings shared by every externalSecret of this chart.
externalSecrets:
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef: {}        # e.g. {kind: ClusterSecretStore, name: aws-secrets-manager}

# AWS access for provider aws: one IAM policy with pricing:GetProducts and
# ec2:DescribeSpotPriceHistory; with cur.source also Athena/Glue/S3 read access (docs/install/eks.md).
# - EKS Pod Identity (preferred): no annotation. Create the association for this ServiceAccount:
#     aws eks create-pod-identity-association --cluster-name <cluster> --namespace <namespace> \
#       --service-account <serviceAccount name, default the release name> --role-arn <role>
#   (needs the eks-pod-identity-agent add-on).
# - IRSA (fallback): annotations: {eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>}
serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  port: 9090
  # Default annotations; replace the map to change them.
  # Scraped by the hub vmagent's annotated-services job (honor_labels: true keeps `cluster`).
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics

# Singleton by design: every replica would publish every cost series again (duplicate
# kerf_*_hourly_cost_usd series), and there is no leader election. An outage only leaves cost
# figures stale for a few minutes (alert KerfPricingStale in the hub chart);
# recommendations and patching are unaffected. Hence no PDB, HPA or spread either. Values above
# 1 are rejected.
replicaCount: 1
# Deprecated alias of replicaCount (wins when set).
replicas: null
priorityClassName: ""

podLabels: {}
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# NetworkPolicy. Ingress to the metrics port from `ingress.metricsFrom` ([] = any source).
# Egress: DNS, TCP `egress.ports` to any destination (the hub 8080, VictoriaMetrics 8428, AWS
# APIs and an HTTPS hub on 443) and the raw rules in `egress.to`.
networkPolicy:
  enabled: false
  ingress:
    metricsFrom: []
  egress:
    enabled: true
    ports: [443, 8080, 8428]
    to: []

# Prometheus Operator ServiceMonitor or VictoriaMetrics VMServiceScrape. Keep honorLabels: cost
# series carry the priced spoke's `cluster` (docs/contracts/metrics.md).
serviceMonitor:
  enabled: false
  kind: ServiceMonitor        # or VMServiceScrape
  namespace: ""
  interval: 30s
  scrapeTimeout: ""
  honorLabels: true
  labels: {}
  relabelings: []
  metricRelabelings: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
