# Every production feature on, EKS-like (rendered by `make charts-lint`).
global:
  imageRegistry: 123456789012.dkr.ecr.eu-west-1.amazonaws.com
  imagePullSecrets: [ecr-pull]
  externalSecrets:
    secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}

clusterName: ro-hub
image:
  repository: kerf/pricing
  tag: 0.2.0
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

provider: aws
aws:
  pricingRegion: us-east-1
  region: eu-west-1

hub:
  url: https://hub.ro.example.internal
  tokenSecret:
    name: pricing-hub-token
    externalSecret:
      enabled: true
      remoteRef: {key: kerf/pricing/hub-token, property: token}
  caBundle:
    pem: |
      -----BEGIN CERTIFICATE-----
      MIIBexample
      -----END CERTIFICATE-----

serviceAccount:
  # IRSA fallback; with EKS Pod Identity leave annotations empty and create the association.
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/kerf-pricing

priorityClassName: kerf
podLabels: {team: platform}
nodeSelector: {kubernetes.io/os: linux}

networkPolicy:
  enabled: true
  ingress:
    metricsFrom:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: monitoring}

serviceMonitor:
  enabled: true
  labels: {release: kube-prometheus-stack}
