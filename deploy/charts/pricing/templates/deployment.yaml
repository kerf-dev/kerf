{{- if include "pricing.c.enabled" . -}}
{{- if not (has .Values.provider (list "static" "aws")) }}
{{- fail "provider must be static or aws" }}
{{- end }}
{{- $cur := .Values.cur | default dict }}
{{- if not (has ($cur.source | default "") (list "" "athena" "s3")) }}
{{- fail "cur.source must be empty, athena or s3" }}
{{- end }}
{{- if and (eq $cur.source "athena") (not (and $cur.athena.database $cur.athena.table)) }}
{{- fail "cur.source athena needs cur.athena.database and cur.athena.table" }}
{{- end }}
{{- if and (eq $cur.source "s3") (not $cur.s3.bucket) }}
{{- fail "cur.source s3 needs cur.s3.bucket" }}
{{- end }}
{{- $curTmp := eq ($cur.source | default "") "s3" }}
{{- if gt (include "pricing.c.replicas" . | int) 1 }}
{{- fail "pricing is a singleton (replicaCount 1): more replicas would publish every cost series twice" }}
{{- end }}
{{- $ca := include "pricing.caEnabled" . }}
{{- $mode := dig "mode" "" (.Values.global | default dict) }}
{{- $tok := include "pricing.c.tokenSource" (dict "ctx" . "mode" $mode "component" "pricing" "ts" .Values.hub.tokenSecret) | fromJson }}
{{- if and (not .Values.vmURL) (not .Values.hub.url) }}{{ fail "vmURL is required: the Prometheus-compatible URL with the kube_node_labels series (or set hub.url to read them through the hub)" }}{{ end }}
{{- $vols := or .Values.prices .Values.hub.url $ca $curTmp .Values.extraVolumes }}
{{- $mounts := or .Values.prices .Values.hub.url $ca $curTmp .Values.extraVolumeMounts }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pricing.fullname" . }}
  labels: {{- include "pricing.labels" . | nindent 4 }}
spec:
  replicas: {{ include "pricing.c.replicas" . }}
  selector:
    matchLabels: {{- include "pricing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pricing.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/prices: {{ .Values.prices | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pricing.serviceAccountName" . }}
      automountServiceAccountToken: {{ or (eq .Values.provider "aws") (ne ($cur.source | default "") "") }}
      {{- include "pricing.c.imagePullSecrets" (dict "ctx" . "indent" 6) }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pricing
          image: {{ include "pricing.c.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --provider={{ .Values.provider }}
            {{- if .Values.vmURL }}
            - --vm-url={{ .Values.vmURL }}
            - --vm-url-setting={{ ternary "pricing.vmURL" "vmURL" (ne $mode "") }}
            {{- else }}
            # vmURL empty: the node series come from the hub's own metrics datasource (hub.config.prometheusURL),
            # through the hub's query proxy.
            - --vm-url=
            {{- end }}
            - --listen=:{{ .Values.service.port }}
            - --interval={{ .Values.interval }}
            - --price-ttl={{ .Values.priceTTL }}
            - --node-lookback={{ .Values.nodeLookback }}
            - --cpu-memory-weight={{ .Values.cpuMemoryWeight }}
            - --cluster-name={{ .Values.clusterName }}
            - --log-level={{ .Values.logLevel }}
            {{- with .Values.clusters }}
            - --clusters={{ . }}
            {{- end }}
            {{- with .Values.defaultRegion }}
            - --default-region={{ . }}
            {{- end }}
            {{- if eq .Values.provider "aws" }}
            - --aws-pricing-region={{ .Values.aws.pricingRegion }}
            {{- end }}
            {{- if .Values.hub.url }}
            - --hub-url={{ .Values.hub.url }}
            - --hub-token-file=/etc/kerf/hub-token/token
            - --hub-token-source=Secret {{ .Release.Namespace }}/{{ $tok.name }} key {{ $tok.key }}
            {{- end }}
            {{- with $cur.source }}
            - --cur-source={{ . }}
            - --cur-interval={{ $cur.interval }}
            - --cur-window={{ $cur.window }}
            - --cur-max-age={{ $cur.maxAge }}
            {{- with ($cur.region | default $.Values.aws.region) }}
            - --cur-region={{ . }}
            {{- end }}
            {{- if eq . "athena" }}
            - --cur-athena-database={{ $cur.athena.database }}
            - --cur-athena-table={{ $cur.athena.table }}
            - --cur-athena-workgroup={{ $cur.athena.workgroup }}
            {{- with $cur.athena.catalog }}
            - --cur-athena-catalog={{ . }}
            {{- end }}
            {{- with $cur.athena.outputLocation }}
            - --cur-athena-output={{ . }}
            {{- end }}
            {{- else }}
            - --cur-s3-bucket={{ $cur.s3.bucket }}
            - --cur-s3-prefix={{ $cur.s3.prefix }}
            {{- end }}
            {{- end }}
          {{- $awsRegion := and (eq .Values.provider "aws") .Values.aws.region }}
          {{- if or $awsRegion $ca .Values.extraEnv }}
          env:
            {{- if $awsRegion }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            {{- end }}
            {{- if $ca }}
            # Go reads the system roots plus every file of these directories (hub.caBundle).
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/kerf/hub-ca
            {{- end }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http-metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /healthz, port: http-metrics}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http-metrics}
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if $mounts }}
          volumeMounts:
            {{- if .Values.prices }}
            - name: prices
              mountPath: /etc/kerf/prices.yaml
              subPath: prices.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.hub.url }}
            - name: hub-token
              mountPath: /etc/kerf/hub-token
              readOnly: true
            {{- end }}
            {{- if $ca }}
            - name: hub-ca
              mountPath: /etc/kerf/hub-ca
              readOnly: true
            {{- end }}
            {{- if $curTmp }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- with .Values.extraVolumeMounts }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- end }}
      {{- if $vols }}
      volumes:
        {{- if .Values.prices }}
        - name: prices
          configMap:
            name: {{ include "pricing.fullname" . }}-prices
        {{- end }}
        {{- if .Values.hub.url }}
        # Optional, so that pricing starts without it: it then logs "hub token missing: Secret <namespace>/<name>
        # key <key>" on every refresh and is not Ready (instead of waiting in ContainerCreating).
        - name: hub-token
          secret:
            secretName: {{ required "hub.tokenSecret.name is required with hub.url" $tok.name }}
            optional: true
            items:
              - key: {{ $tok.key }}
                path: token
        {{- end }}
        {{- if $ca }}
        {{- $c := .Values.hub.caBundle }}
        - name: hub-ca
          {{- if $c.existingSecret }}
          secret:
            secretName: {{ $c.existingSecret }}
          {{- else }}
          configMap:
            name: {{ $c.existingConfigMap | default (printf "%s-hub-ca" (include "pricing.fullname" .)) }}
          {{- end }}
            items:
              - key: {{ $c.key }}
                path: ca.crt
        {{- end }}
        {{- if $curTmp }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ $cur.s3.tmpSizeLimit | default "1Gi" }}
        {{- end }}
        {{- with .Values.extraVolumes }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{ end -}}
