{{- if not (has .Values.provider (list "static" "aws")) }}
{{- fail "provider must be static or aws" }}
{{- end }}
{{- if gt (include "pricing.c.replicas" . | int) 1 }}
{{- fail "pricing is a singleton (replicaCount 1): more replicas would publish every cost series twice" }}
{{- end }}
{{- $ca := include "pricing.caEnabled" . }}
{{- $vols := or .Values.prices .Values.hub.url $ca .Values.extraVolumes }}
{{- $mounts := or .Values.prices .Values.hub.url $ca .Values.extraVolumeMounts }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pricing.fullname" . }}
  labels: {{- include "pricing.labels" . | nindent 4 }}
spec:
  replicas: {{ include "pricing.c.replicas" . }}
  selector:
    matchLabels: {{- include "pricing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pricing.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/prices: {{ .Values.prices | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pricing.serviceAccountName" . }}
      automountServiceAccountToken: {{ eq .Values.provider "aws" }}
      {{- include "pricing.c.imagePullSecrets" (dict "ctx" . "indent" 6) }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pricing
          image: {{ include "pricing.c.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --provider={{ .Values.provider }}
            - --vm-url={{ .Values.vmURL }}
            - --listen=:{{ .Values.service.port }}
            - --interval={{ .Values.interval }}
            - --price-ttl={{ .Values.priceTTL }}
            - --node-lookback={{ .Values.nodeLookback }}
            - --cpu-memory-weight={{ .Values.cpuMemoryWeight }}
            - --cluster-name={{ .Values.clusterName }}
            - --log-level={{ .Values.logLevel }}
            {{- with .Values.clusters }}
            - --clusters={{ . }}
            {{- end }}
            {{- with .Values.defaultRegion }}
            - --default-region={{ . }}
            {{- end }}
            {{- if eq .Values.provider "aws" }}
            - --aws-pricing-region={{ .Values.aws.pricingRegion }}
            {{- end }}
            {{- if .Values.hub.url }}
            - --hub-url={{ .Values.hub.url }}
            - --hub-token-file=/etc/resource-optimizer/hub-token/token
            {{- end }}
          {{- $awsRegion := and (eq .Values.provider "aws") .Values.aws.region }}
          {{- if or $awsRegion $ca .Values.extraEnv }}
          env:
            {{- if $awsRegion }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            {{- end }}
            {{- if $ca }}
            # Go reads the system roots plus every file of these directories (hub.caBundle).
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/resource-optimizer/hub-ca
            {{- end }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http-metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /healthz, port: http-metrics}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http-metrics}
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if $mounts }}
          volumeMounts:
            {{- if .Values.prices }}
            - name: prices
              mountPath: /etc/resource-optimizer/prices.yaml
              subPath: prices.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.hub.url }}
            - name: hub-token
              mountPath: /etc/resource-optimizer/hub-token
              readOnly: true
            {{- end }}
            {{- if $ca }}
            - name: hub-ca
              mountPath: /etc/resource-optimizer/hub-ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- end }}
      {{- if $vols }}
      volumes:
        {{- if .Values.prices }}
        - name: prices
          configMap:
            name: {{ include "pricing.fullname" . }}-prices
        {{- end }}
        {{- if .Values.hub.url }}
        - name: hub-token
          secret:
            secretName: {{ required "hub.tokenSecret.name is required with hub.url" .Values.hub.tokenSecret.name }}
            items:
              - key: {{ .Values.hub.tokenSecret.key }}
                path: token
        {{- end }}
        {{- if $ca }}
        {{- $c := .Values.hub.caBundle }}
        - name: hub-ca
          {{- if $c.existingSecret }}
          secret:
            secretName: {{ $c.existingSecret }}
          {{- else }}
          configMap:
            name: {{ $c.existingConfigMap | default (printf "%s-hub-ca" (include "pricing.fullname" .)) }}
          {{- end }}
            items:
              - key: {{ $c.key }}
                path: ca.crt
        {{- end }}
        {{- with .Values.extraVolumes }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
