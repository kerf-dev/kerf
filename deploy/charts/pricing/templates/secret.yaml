{{- if include "pricing.c.enabled" . -}}
{{- $es := dig "externalSecret" "enabled" false .Values.hub.tokenSecret }}
{{- if and .Values.hub.url .Values.hub.tokenSecret.create $es }}{{ fail "hub.tokenSecret.create and hub.tokenSecret.externalSecret are exclusive" }}{{ end }}
{{- if and .Values.hub.url .Values.hub.tokenSecret.create }}
# Hub token of role pricing. create: true is for local development only; otherwise create
# the Secret yourself with a token from POST /v1/admin/tokens (role pricing).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hub.tokenSecret.name }}
  labels: {{- include "pricing.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.hub.tokenSecret.key }}: {{ required "hub.tokenSecret.token is required with create: true" .Values.hub.tokenSecret.token | quote }}
{{- end }}
{{- if $es }}
---
# Hub token of role pricing from Secrets Manager.
{{ include "pricing.c.externalSecret" (dict "ctx" . "name" (required "hub.tokenSecret.name is required with hub.tokenSecret.externalSecret" .Values.hub.tokenSecret.name) "es" .Values.hub.tokenSecret.externalSecret "data" (list (dict "secretKey" .Values.hub.tokenSecret.key))) }}
{{- end }}
{{- $ca := .Values.hub.caBundle | default dict }}
{{- if and $ca.pem (not $ca.existingConfigMap) (not $ca.existingSecret) }}
---
# CA of the hub's HTTPS certificate (hub.caBundle).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pricing.fullname" . }}-hub-ca
  labels: {{- include "pricing.labels" . | nindent 4 }}
data:
  {{ $ca.key }}: {{ $ca.pem | quote }}
{{- end }}
{{ end -}}
