{{- if and .Values.hub.url .Values.hub.tokenSecret.create }}
# Hub token of role pricing (D-026). create: true is for local development only; otherwise create
# the Secret yourself with a token from POST /v1/admin/tokens (role pricing).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hub.tokenSecret.name }}
  labels: {{- include "pricing.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.hub.tokenSecret.key }}: {{ required "hub.tokenSecret.token is required with create: true" .Values.hub.tokenSecret.token | quote }}
{{- end }}
