{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pricing.fullname" . }}
  labels: {{- include "pricing.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "pricing.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress{{ if $np.egress.enabled }}, Egress{{ end }}]
  ingress:
    - ports:
        - {protocol: TCP, port: http-metrics}
      {{- with $np.ingress.metricsFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $np.egress.enabled }}
  egress:
    {{- include "pricing.c.egressRules" (dict "ctx" . "ports" $np.egress.ports) }}
  {{- end }}
{{- end }}
