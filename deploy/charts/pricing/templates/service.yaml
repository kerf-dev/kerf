apiVersion: v1
kind: Service
metadata:
  name: {{ include "pricing.fullname" . }}
  labels: {{- include "pricing.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector: {{- include "pricing.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-metrics
      port: {{ .Values.service.port }}
      targetPort: http-metrics
      protocol: TCP
