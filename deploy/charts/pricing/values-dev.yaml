# Local k3d (ro-hub). Tilt / make deploy-pricing set image.repository, image.tag and clusterName.
image:
  repository: k3d-ro-registry:5005/resource-optimizer/pricing
  tag: latest
interval: 1m
# synth-a/synth-b node series are a backfill (WO-02) that ends when the backfill runs; keep pricing
# them for a day afterwards so the hub has rates for the synthetic fleet.
nodeLookback: 24h
defaultRegion: eu-west-1
logLevel: debug
