# Local k3d (ro-hub). Tilt / make deploy-pricing set image.repository, image.tag and clusterName.
image:
  repository: k3d-ro-registry:5005/kerf/pricing
  tag: latest
interval: 1m
# synth-a/synth-b node series are a backfill that ends when the backfill runs; keep pricing
# them for a day afterwards so the hub has rates for the synthetic fleet.
nodeLookback: 24h
defaultRegion: eu-west-1
logLevel: debug
hub:
  url: http://hub.kerf.svc:8080
  tokenSecret:
    name: pricing-hub-token
    create: true
    token: ro-dev-pricing-5f0c3b7e9a1d24c86e13a0b2
