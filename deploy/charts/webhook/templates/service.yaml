# API server -> webhook (HTTPS). Not annotated for scraping: the vmagent endpoints role makes one
# target per Service port, so scrape annotations live on the metrics-only Service below.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "webhook.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "webhook.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webhook.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "webhook.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector: {{- include "webhook.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
