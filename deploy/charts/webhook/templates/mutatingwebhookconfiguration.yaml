{{- if include "webhook.c.enabled" . -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "webhook.clusterName" . }}
  labels: {{- include "webhook.labels" . | nindent 4 }}
  {{- if not .Values.tls.selfSigned.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "webhook.certificate" . }}
  {{- end }}
webhooks:
  - name: pods.webhook.kerf.getkerf.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    clientConfig:
      {{- if .Values.tls.selfSigned.enabled }}
      caBundle: {{ (include "webhook.selfSigned" . | fromJson).ca }}
      {{- end }}
      service:
        name: {{ include "webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-v1-pod
        port: 443
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - {{ .Release.Namespace }}
            {{- range .Values.webhook.excludeNamespaces }}
            - {{ . }}
            {{- end }}
        - key: kerf.getkerf.dev/skip-webhook
          operator: NotIn
          values: ["true"]
    objectSelector:
      matchExpressions:
        - key: kerf.getkerf.dev/skip-webhook
          operator: NotIn
          values: ["true"]
    # Only pods with a controller can belong to a workload: don't call the webhook for the rest.
    matchConditions:
      - name: has-controller
        expression: "has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(r, has(r.controller) && r.controller)"
{{ end -}}
