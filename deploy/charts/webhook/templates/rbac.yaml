apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "webhook.labels" . | nindent 4 }}
---
# Read-only: recommendations (informer cache) and the owners between a pod and its workload
# (ReplicaSet -> Deployment, Job -> CronJob; read as metadata only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "webhook.clusterName" . }}
  labels: {{- include "webhook.labels" . | nindent 4 }}
rules:
  - apiGroups: ["resource-optimizer.oz.io"]
    resources: ["rightsizingrecommendations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "webhook.clusterName" . }}
  labels: {{- include "webhook.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "webhook.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
