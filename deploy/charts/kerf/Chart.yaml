apiVersion: v2
name: kerf
# One chart for every cluster: global.mode hub installs the hub, web UI and pricing
# service; spoke installs the agent, admission webhook and CRDs on a workload cluster; all installs
# everything in one cluster.
description: >-
  Kerf: self-hosted Kubernetes rightsizing. Recommends CPU and memory requests and limits from
  Prometheus or VictoriaMetrics history, prices the savings per node type, and applies changes with
  in-place resize or rollout, guardrails, maintenance windows and automatic rollback. One chart:
  global.mode hub (central cluster), spoke (each workload cluster) or all (one cluster).
type: application
# make release VERSION=x.y.z writes version and appVersion here and in every subchart.
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - kubernetes
  - rightsizing
  - finops
  - cost-optimization
  - resource-requests
  - resource-limits
  - vertical-pod-autoscaler
  - in-place-pod-resize
  - autoscaling
  - prometheus
  - victoriametrics
  - eks
icon: https://raw.githubusercontent.com/kerf-dev/kerf/main/docs/branding/kerf-mark-on-light.svg
home: https://getkerf.dev
sources: [https://github.com/kerf-dev/kerf]
# Artifact Hub (https://artifacthub.io/docs/topics/annotations/helm/). make release (release-chart-package) sets
# the artifacthub.io/images tags to the release version and artifacthub.io/prerelease from it.
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Website
      url: https://getkerf.dev
    - name: Source
      url: https://github.com/kerf-dev/kerf
    - name: Install on Amazon EKS
      url: https://github.com/kerf-dev/kerf/blob/main/docs/install/eks.md
    - name: Documentation
      url: https://github.com/kerf-dev/kerf/blob/main/docs/README.md
    - name: Changelog
      url: https://github.com/kerf-dev/kerf/blob/main/CHANGELOG.md
    - name: Security policy
      url: https://github.com/kerf-dev/kerf/blob/main/SECURITY.md
  artifacthub.io/images: |
    - name: hub
      image: ghcr.io/kerf-dev/kerf/hub:0.1.0
    - name: web
      image: ghcr.io/kerf-dev/kerf/web:0.1.0
    - name: pricing
      image: ghcr.io/kerf-dev/kerf/pricing:0.1.0
    - name: agent
      image: ghcr.io/kerf-dev/kerf/agent:0.1.0
    - name: webhook
      image: ghcr.io/kerf-dev/kerf/webhook:0.1.0
  artifacthub.io/crds: |
    - kind: RightsizingPolicy
      version: v1alpha1
      name: rightsizingpolicies.kerf.getkerf.dev
      displayName: Rightsizing policy
      description: >-
        Which workloads Kerf may change and how: CPU and memory modes (off, audit, auto-patch), the apply
        strategy, maintenance and freeze windows, guardrails and rollback thresholds. Cluster-scoped.
    - kind: RightsizingRecommendation
      version: v1alpha1
      name: rightsizingrecommendations.kerf.getkerf.dev
      displayName: Rightsizing recommendation
      description: >-
        The change Kerf wants for one workload, in its namespace, written by the agent, with the phase of the
        change (Pending, Applying, Applied, Blocked, RolledBack, Released, Deferred).
  artifacthub.io/crdsExamples: |
    - apiVersion: kerf.getkerf.dev/v1alpha1
      kind: RightsizingPolicy
      metadata:
        name: shop-cpu-auto
      spec:
        selector:
          namespaces: [shop]
        profile: production
        cpu:
          mode: auto-patch
        memory:
          mode: audit
        apply:
          strategy: in-place
  # Every chart version is signed with cosign (keyless, the release workflow's GitHub identity), which Artifact Hub
  # shows as "Signed". There is no key to publish, so the annotation points to how to verify the signature.
  artifacthub.io/signKey: |
    url: https://github.com/kerf-dev/kerf/blob/main/docs/release.md#verify-the-signatures
  artifacthub.io/changes: |
    - kind: added
      description: First public version.
    - kind: added
      description: Recommendations and savings from Prometheus or VictoriaMetrics, priced per node type.
    - kind: added
      description: Automation per policy with in-place resize or rollout, guardrails, maintenance windows and automatic rollback.
    - kind: added
      description: HPA coordination, JVM heap-aware memory, zero-downtime single-replica changes.
    - kind: added
      description: Web UI with admin area, add-cluster wizard and readiness checks.
# The component charts, linked into charts/ (symlinks to deploy/charts/<name>, so an in-tree render
# always uses the current charts; `helm package` stores real copies). Do not run `helm dependency
# update` here: it would replace the links with archives. There are no `condition:`s: Helm cannot
# derive them from global.mode, so each component gates its own templates ("<name>.c.enabled" in
# its templates/_common.tpl).
dependencies:
  - name: hub
    alias: hub
    version: ">=0.0.0-0"
    repository: file://../hub
  - name: web
    alias: web
    version: ">=0.0.0-0"
    repository: file://../web
  - name: pricing
    alias: pricing
    version: ">=0.0.0-0"
    repository: file://../pricing
  - name: agent
    alias: agent
    version: ">=0.0.0-0"
    repository: file://../agent
  - name: webhook
    alias: webhook
    version: ">=0.0.0-0"
    repository: file://../webhook
