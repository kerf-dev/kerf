# Kerf: one chart for the hub cluster and every workload cluster.
# Install guide: docs/install/eks.md. Examples: deploy/examples/eks/values-{hub,spoke}.yaml.
#
# Each component's settings live under its name (hub, web, pricing, agent, webhook) and are the
# component chart's values (deploy/charts/<name>/values.yaml, shared names in deploy/charts/README.md).
# Only what this chart changes from the component defaults is listed here.
# values.schema.json rejects inline secrets unless dev: true.

global:
  # Required. What this release installs:
  #   hub   = hub + web + pricing                  (the central cluster)
  #   spoke = agent + webhook + the CRDs          (each workload cluster)
  #   all   = everything in one cluster           (small setups, evaluation)
  # <component>.enabled: true|false overrides one component either way.
  # It sits under global because Helm passes only global.* to the components.
  # mode: hub

  # Required in mode spoke and all: this cluster's name as registered in the hub (a DNS label).
  # Feeds agent.clusterName, webhook.clusterName and pricing.clusterName (each wins when set).
  clusterName: ""

  # Required unless dev: true. Registry host prefixed to every image.repository, e.g. the ECR
  # host of `make release REGISTRY=<host>/kerf` (docs/release.md):
  #   123456789012.dkr.ecr.eu-west-1.amazonaws.com
  imageRegistry: ""
  # Pull secrets for every pod (names or {name: ...}); EKS nodes pull from ECR with their role.
  imagePullSecrets: []
  # Default SecretStore of every ExternalSecret (External Secrets Operator), e.g.
  #   secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  externalSecrets:
    secretStoreRef: {}

# Development only: allows inline secrets (hub.database.url, web.token.value, *.tokenSecret.create,
# hub.auth.bootstrapAdmin.password, hub.devSeed), hub.auth.cookieSecure: false, an empty
# global.imageRegistry, quickstart.enabled and webhook.tls.selfSigned.
dev: false

# The laptop quickstart (docs/quickstart.md, values-quickstart.yaml, hack/quickstart.sh): a single PostgreSQL pod,
# VictoriaMetrics with kube-state-metrics, demo workloads and their generated usage history, all in the release
# namespace. Development only: the values schema refuses `enabled: true` (and webhook.tls.selfSigned) unless
# dev: true.
quickstart:
  enabled: false
  # kind and k3d nodes carry no cloud labels: kube_node_labels is relabelled with this node type, which the static
  # price table prices, so the demo shows dollar amounts. Not a statement about your hardware.
  node:
    instanceType: m6i.xlarge
    region: eu-west-1
    zone: eu-west-1a
  postgres:
    image: postgres:18.6-alpine3.23
    storage: 2Gi
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
  metrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    ksmImage: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
    retention: 35d
    storage: 5Gi
    scrapeInterval: 30s
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 1Gi}
    ksmResources:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {memory: 192Mi}
  # Demo workloads: each requests far more than it uses. `usage` is the generated history (tools/synth: pattern,
  # base, diurnal, peakHour, weekend, spikesPerDay, noise, ...); the pods themselves only run a pause container.
  demo:
    enabled: true
    namespace: kerf-demo
    image: registry.k8s.io/pause:3.10
    # At least the 28 days of the production profiles' window, so the readiness check for the history passes; at most 35.
    historyDays: 30
    workloads:
      - name: web-frontend
        replicas: 2
        requests: {cpu: 300m, memory: 384Mi}
        limits: {memory: 384Mi}
        usage:
          cpu: {pattern: diurnal, base: 60m, diurnal: 0.6, peakHour: 14}
          memory: {pattern: flat, base: 140Mi}
      - name: api-gateway
        replicas: 2
        requests: {cpu: 200m, memory: 256Mi}
        limits: {memory: 256Mi}
        usage:
          cpu: {pattern: diurnal, base: 35m, diurnal: 0.5, peakHour: 13}
          memory: {pattern: flat, base: 90Mi}
      - name: orders-service
        replicas: 1
        requests: {cpu: 500m, memory: 768Mi}
        limits: {cpu: "1", memory: 768Mi}
        usage:
          cpu: {pattern: spiky, base: 70m, spikesPerDay: 6, spikeMult: 4, spikeMinutes: 10}
          memory: {pattern: flat, base: 260Mi}
      - name: report-worker
        replicas: 1
        requests: {cpu: 500m, memory: 768Mi}
        limits: {memory: 768Mi}
        usage:
          cpu: {pattern: weekly, base: 40m, diurnal: 0.5, weekend: 0.3}
          memory: {pattern: flat, base: 200Mi}
      - name: search-indexer
        replicas: 1
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 256Mi}
        usage:
          cpu: {pattern: flat, base: 80m}
          memory: {pattern: flat, base: 215Mi, noise: 0.05}
      - name: cache
        replicas: 1
        requests: {cpu: 100m, memory: 128Mi}
        limits: {memory: 128Mi}
        usage:
          cpu: {pattern: flat, base: 30m}
          memory: {pattern: flat, base: 90Mi}

# ---------------------------------------------------------------------------------------------------
# hub: API, recommender, readiness (mode hub, all)
# Object names: see templates/_names.tpl (release kerf -> hub, web, pricing, webhook,
# kerf-agent; another release R -> R-hub, R-web, ...).
hub:
  # enabled: true            # override global.mode for this component
  image:
    repository: kerf/hub
    tag: ""                  # default: the chart appVersion (= the release VERSION)
    digest: ""               # optional sha256:... from bin/release/images.txt
  # 2 replicas, RollingUpdate, PDB minAvailable 1 and node/zone spread are the chart defaults
  # (leader election on Postgres).

  # The database. Production: RDS through the External Secrets Operator (verify-full):
  #   database:
  #     host: ro-hub.xxxxxxxx.eu-west-1.rds.amazonaws.com
  #     caBundle: {existingConfigMap: rds-ca-bundle, key: global-bundle.pem}
  #     externalSecret:
  #       enabled: true
  #       source: rds          # the RDS-managed secret (JSON username/password)
  #       remoteRef: {key: "kerf/hub/db"}
  # or your own Secret: database.existingSecret (key DATABASE_URL). A direct connection or a
  # session-mode pooler only: the leader lock needs a session (no RDS Proxy, no transaction pooling).
  database:
    url: ""                  # inline URL: dev: true only

  # Initial admin (user admin), created on an empty database. By default the chart generates its
  # password once (Secret <hub name>-bootstrap-admin, kept; the NOTES show how to read it) and the
  # admin must change it at first sign-in. Your own password instead, which is not forced:
  #   auth.bootstrapAdmin.existingSecret: my-admin-secret          # key password
  #   auth.bootstrapAdmin.externalSecret: {enabled: true, remoteRef: {key: kerf/hub/bootstrap-admin, property: password}}
  auth:
    cookieSecure: true       # false: dev: true only (plain-HTTP development)

  # Datasource secrets key. The chart generates it once (Helm lookup) unless it comes from
  # Secrets Manager. With Argo CD (no lookup) use the ExternalSecret, or every sync makes a new key:
  #   onboarding.secretsKey.externalSecret: {enabled: true, remoteRef: {key: kerf/hub/datasource-key}}

  # Tokens of this release's pricing service and, in mode all, its agent: generated once (Secret
  # <hub name>-local-tokens, Helm lookup, kept) and accepted by the hub at start-up, so a fresh
  # install needs no token. With Argo CD or `helm template` (no lookup) every render makes new ones:
  # give pricing and the agent their own Secrets there (pricing.hub.tokenSecret, agent.hub.tokenSecret).
  #   localTokens: {enabled: false}

  # Ingress for the hub API (agents of other clusters, pricing over HTTPS). AWS Load Balancer
  # Controller, internal ALB:
  #   ingress:
  #     enabled: true
  #     className: alb
  #     annotations:
  #       alb.ingress.kubernetes.io/scheme: internal
  #       alb.ingress.kubernetes.io/target-type: ip
  #       alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  #       alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account>:certificate/<id>
  #       alb.ingress.kubernetes.io/healthcheck-path: /readyz
  #     hosts: [{host: hub.ro.example.internal, paths: [{path: /, pathType: Prefix}]}]
  #     tls: [{hosts: [hub.ro.example.internal]}]
  # Opt-in production features, each needs its add-on (examples: deploy/examples/eks/values-hub.yaml):
  #   networkPolicy:  {enabled: true, ingress: {from: [{ipBlock: {cidr: <VPC CIDR>}}]}}
  #   serviceMonitor: {enabled: true, kind: ServiceMonitor}       # or VMServiceScrape
  #   prometheusRule: {enabled: true, kind: PrometheusRule}       # or VMRule
  #   dashboards:     {enabled: true, namespace: monitoring}      # Grafana sidecar ConfigMaps

  # Daily check for a newer stable Kerf release (Admin -> Maintenance): a plain GET of the public
  # GitHub releases API, nothing about this installation is sent. Air-gapped sites: enabled: false.
  # updateCheck: {enabled: true, interval: 24h}

  # Notifications to Slack, Microsoft Teams and signed webhooks (Admin -> Notifications; docs/notifications.md).
  # Rules and the weekly digest are set in the UI. Channels can come from a Secret you create:
  # notifications:
  #   baseURL: https://kerf.example.com       # the web UI's address, for the links in the messages
  #   channels:
  #     - {name: platform-alerts, type: slack, existingSecret: kerf-slack-platform}    # key `url`
  #     - {name: pagerduty, type: webhook, existingSecret: kerf-pagerduty, secretKey: signing-secret}

# ---------------------------------------------------------------------------------------------------
# web: the UI (nginx, non-root on 8080) (mode hub, all)
web:
  image:
    repository: kerf/web
    tag: ""
    digest: ""
  hub:
    # Empty: this release's hub Service (<hub name>.<namespace>.svc.cluster.local:8080).
    upstream: ""
  # Signing in is always required (docs/auth.md). Behind an ALB, list its subnets so sign-ins are
  # rate-limited per real client:
  #   trustedProxies: [10.0.0.0/16]
  # Ingress for browsers (ALB, scheme of your choice):
  #   ingress:
  #     enabled: true
  #     className: alb
  #     annotations:
  #       alb.ingress.kubernetes.io/scheme: internal          # or internet-facing
  #       alb.ingress.kubernetes.io/target-type: ip
  #       alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  #       alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account>:certificate/<id>
  #       alb.ingress.kubernetes.io/healthcheck-path: /healthz
  #     hosts: [{host: ro.example.com, paths: [{path: /, pathType: Prefix}]}]
  #     tls: [{hosts: [ro.example.com]}]
  #   networkPolicy: {enabled: true}

# ---------------------------------------------------------------------------------------------------
# pricing: node prices and cost series (mode hub, all)
pricing:
  image:
    repository: kerf/pricing
    tag: ""
    digest: ""
  clusterName: ""            # empty: global.clusterName
  # static (the price file in the image) or aws (Pricing API + spot prices; IAM through EKS Pod
  # Identity for ServiceAccount <pricing name>: docs/install/eks.md).
  provider: static
  # Effective rates from the AWS Cost and Usage Report (Savings Plans and Reserved Instances
  # amortised; docs/pricing.md), on top of provider aws. Off by default. For example:
  #   cur:
  #     source: athena          # or s3 for small accounts
  #     region: eu-west-1
  #     athena: {database: kerf_cur, table: data, workgroup: kerf}
  cur:
    source: ""
  # Where the node series (kube_node_labels) are read. Empty: the hub's own metrics datasource
  # (hub.config.prometheusURL), through the hub. Set it to read them from elsewhere, e.g.
  #   vmURL: http://vmsingle.monitoring.svc:8428
  vmURL: ""
  hub:
    # Empty: this release's hub Service. The token (role pricing): by default the one the chart
    # generates (hub.localTokens). Your own Secret instead, with a token of role pricing
    # (Admin -> Access, or POST /v1/admin/tokens):
    #   tokenSecret: {name: kerf-pricing-token}                  # key token
    #   tokenSecret.externalSecret: {enabled: true, remoteRef: {key: kerf/hub/pricing-token, property: token}}
    url: ""
    tokenSecret:
      name: ""
      create: false          # true + token: dev: true only
      token: ""
  #   networkPolicy:  {enabled: true}
  #   serviceMonitor: {enabled: true}

# ---------------------------------------------------------------------------------------------------
# agent: one per workload cluster (mode spoke, all)
agent:
  image:
    repository: kerf/agent
    tag: ""
    digest: ""
  clusterName: ""            # empty: global.clusterName
  hub:
    # Required in mode spoke: the hub API as this cluster reaches it, e.g.
    # https://hub.ro.example.internal (the hub's internal ALB). Empty in mode all: this release's
    # hub Service.
    url: ""
    # The cluster's agent token (role agent). Mode all: by default the one the chart generates
    # (hub.localTokens). Mode spoke: the token the hub's cluster wizard shows once, in Secret
    # kerf-agent-token (key token), which you create:
    #   kubectl -n <namespace> create secret generic kerf-agent-token --from-literal=token=<agent token>
    # or from your secret store:
    #   tokenSecret.externalSecret: {enabled: true, remoteRef: {key: kerf/clusters/<cluster>/agent-token, property: token}}
    # Without a token the agent logs "hub token missing: Secret <namespace>/<name> key <key>" and is not Ready.
    # Mode all, your own Secret instead: tokenSecret.name with another name than kerf-agent-token.
    tokenSecret:
      create: false          # true + token: dev: true only
      token: ""
    # caBundle: {existingConfigMap: corp-root-ca, key: ca.crt}   # hub certificate from a private CA
  # Production default here: two replicas with leader election (one works, one waits).
  replicaCount: 2
  leaderElection: true
  health:
    # Prometheus-compatible endpoint with this cluster's container_cpu_cfs_* series, for the
    # throttling rollback. Empty: no throttling-based rollback.
    metricsURL: ""
  #   networkPolicy:  {enabled: true}
  #   serviceMonitor: {enabled: true}

# ---------------------------------------------------------------------------------------------------
# webhook: mutating admission webhook (mode spoke, all). Needs cert-manager. The control plane must
# reach the nodes on containerPort (9443): docs/install/eks.md, security groups.
webhook:
  image:
    repository: kerf/webhook
    tag: ""
    digest: ""
  clusterName: ""            # empty: global.clusterName
  # The serving certificate: cert-manager (default). tls.selfSigned.enabled: true makes it in the chart instead,
  # for the laptop quickstart: dev: true only.
  #   tls: {selfSigned: {enabled: true}}
  #   networkPolicy:  {enabled: true, ingress: {apiServerFrom: [{ipBlock: {cidr: <VPC CIDR>}}]}}
  #   serviceMonitor: {enabled: true}
