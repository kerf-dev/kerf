# The laptop quickstart: one release (global.mode: all) with a bundled PostgreSQL, VictoriaMetrics, kube-state-metrics,
# demo workloads and their generated history, on kind or k3d. Development only: `dev: true` is what lets this file
# past values.schema.json. hack/quickstart.sh installs it; docs/quickstart.md explains it and how to move on to a
# real install (docs/install/eks.md).
#
# The hub's database password, the bootstrap admin's password and the agent and pricing tokens are generated by the
# chart (the tokens as on any mode all install: hub.localTokens). The script adds the images
# (--set global.imageRegistry=... / hub.image.tag=... for --local builds); the tokens it may still pass
# (hub.devSeed.tokens, *.hub.tokenSecret.token) are not used for the connection.
dev: true

global:
  mode: all
  clusterName: quickstart
  # The published images (the chart of a release already defaults to them).
  imageRegistry: ghcr.io/kerf-dev

quickstart:
  enabled: true

hub:
  # One replica, so no leader election to wait for.
  replicaCount: 1
  podDisruptionBudget: {enabled: false}
  database:
    existingSecret: kerf-quickstart-db
    existingSecretKey: DATABASE_URL
  auth:
    # Plain HTTP on localhost.
    cookieSecure: false
    bootstrapAdmin:
      username: admin
      existingSecret: kerf-quickstart-admin
      existingSecretKey: password
  devSeed:
    enabled: true
    clusters: [quickstart]
    tokens: {}                # set by hack/quickstart.sh
  config:
    prometheusURL: http://kerf-vm:8428
    recommender:
      # The demo history is generated a minute or two after the install: look again soon, and use data up to now.
      interval: 2m
      endAlignment: 30s
      # One run as of each UTC midnight of the 29 days before the first one: history and the savings trend.
      backfill:
        runs: 29
        every: 24h
    history:
      fullResolution: 6h
      retention: 720h
    onboarding:
      # The readiness checks run once at the start, before the first scrapes: look again soon.
      checkInterval: 2m

web:
  replicaCount: 1
  # kind and k3d map this node port to localhost (hack/quickstart.sh).
  service:
    type: NodePort
    nodePort: 30090

pricing:
  provider: static
  # vmURL is left empty: pricing reads the node series through the hub (hub.config.prometheusURL).
  interval: 1m
  # The generated nodes of the demo history stay priced for a day after it was written.
  nodeLookback: 24h
  defaultRegion: eu-west-1

agent:
  replicaCount: 1
  leaderElection: false
  pullInterval: 30s
  health:
    metricsURL: http://kerf-vm:8428

webhook:
  replicaCount: 1
  # No cert-manager on a fresh kind or k3d cluster: the chart makes the certificate.
  tls:
    selfSigned:
      enabled: true
