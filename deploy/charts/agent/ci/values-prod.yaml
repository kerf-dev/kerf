# Every production feature on, EKS-like (rendered by `make charts-lint`).
global:
  imageRegistry: 123456789012.dkr.ecr.eu-west-1.amazonaws.com
  imagePullSecrets: [ecr-pull]
  externalSecrets:
    secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}

clusterName: prod-eu-1
image:
  repository: kerf/agent
  tag: 0.2.0
  digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

hub:
  url: https://hub.ro.example.internal
  tokenSecret:
    externalSecret:
      enabled: true
      remoteRef: {key: kerf/agents/prod-eu-1, property: token}
  caBundle:
    existingConfigMap: corp-root-ca
    key: ca.crt

replicaCount: 2
leaderElection: true
podDisruptionBudget: {enabled: true, minAvailable: 1}
priorityClassName: system-cluster-critical
serviceAccount:
  annotations: {example.com/owner: platform}
podLabels: {team: platform}
nodeSelector: {kubernetes.io/os: linux}

health:
  metricsURL: https://vm.ro.example.internal

serviceMonitor:
  enabled: true
  kind: VMServiceScrape

networkPolicy:
  enabled: true
  ingress:
    metricsFrom:
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: monitoring}

selfCheck:
  argocd:
    force: true
