# resource-optimizer agent. One release per cluster, namespace resource-optimizer.

# Cluster name as known to the hub (required). Tilt / dev scripts set it per cluster.
clusterName: ""

# Set by an umbrella chart; read by every resource-optimizer chart.
global:
  imageRegistry: ""         # prefixed to image.repository; image.registry wins over it
  imagePullSecrets: []      # names or {name: ...}
  externalSecrets:
    secretStoreRef: {}      # fallback SecretStore for every ExternalSecret

image:
  registry: ""
  repository: localhost:5005/resource-optimizer/agent
  tag: dev
  digest: ""                # sha256:..., appended as @digest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The resource-optimizer CRDs (copies of api/crds, `make charts-sync`), rendered as templates with
# helm.sh/resource-policy: keep: `helm upgrade` upgrades them and `helm uninstall` leaves them
# (and every RightsizingPolicy and RightsizingRecommendation) in place. Exactly one release per
# cluster renders them: this chart by default (the webhook chart has crds.install: false).
crds:
  install: true
# Deprecated alias of crds.install (wins when set).
installCRDs: null

hub:
  # Hub base URL. Spokes reach the hub through a selector-less Service (WO-01).
  url: http://hub-api.hub.svc:8080
  # Bearer token for the agent role of this cluster (D-012), read from a Secret key and
  # re-read on every request (rotation needs no restart). The Secret is optional: without it
  # the hub answers 401 and the agent behaves as offline (nothing new is applied).
  tokenSecret:
    name: resource-optimizer-agent-token
    key: token
    # create: true makes the chart create the Secret from `token` (local development only).
    create: false
    token: ""
    # External Secrets Operator: builds Secret `name` (key `key`) from Secrets Manager, e.g. one
    # secret per cluster: resource-optimizer/agents/<cluster>.
    externalSecret:
      enabled: false
      remoteRef:
        key: ""
        property: ""        # e.g. token (JSON secret); empty = the whole secret string
        version: ""
      refreshInterval: ""
      secretStoreRef: {}
  # CA that signed the hub's HTTPS certificate, when it is not publicly trusted (a private CA; an
  # ACM public certificate needs nothing). Added to the system roots (SSL_CERT_DIR), mounted at
  # /etc/resource-optimizer/hub-ca. One of existingConfigMap, existingSecret or pem (inline,
  # rendered into ConfigMap <fullname>-hub-ca).
  caBundle:
    existingConfigMap: ""
    existingSecret: ""
    key: ca.crt
    pem: ""

# External Secrets Operator settings shared by every externalSecret of this chart.
externalSecrets:
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef: {}        # e.g. {kind: ClusterSecretStore, name: aws-secrets-manager}

# Cluster default policy (D-005): a RightsizingPolicy spec without selector/priority. Unset
# fields inherit the global defaults (mode audit, strategy in-place, profile production, ...).
clusterDefaults: {}
#  cpu:
#    mode: audit
#  memory:
#    mode: audit
#  apply:
#    strategy: in-place
#    fallbackAfter: 10m
#  guardrails:
#    learningPeriod: 168h
#    minConfidence: "0.7"
#    maxChangePercent: 50
#    cooldown: 24h

# Cluster-wide freeze (WO-10), in addition to every policy's apply.freezeWindows and not
# overridable by a policy. Nothing is changed or released while frozen; health-watch rollbacks
# still happen. `now: true` freezes until turned off; windows use the RightsizingPolicy TimeWindow
# format (schedule + duration [+ timeZone], or start + end).
freeze:
  now: false
  windows: []
#   - schedule: "0 18 * * 5"      # Fridays 18:00 ...
#     duration: 62h               # ... until Monday 08:00
#     timeZone: Asia/Jerusalem
#   - start: "2026-12-24T00:00:00Z"
#     end: "2027-01-02T00:00:00Z"

# readOnly caps every mode at audit and drops every write verb on workloads and pods from the
# ClusterRole. Use it for clusters where every policy is audit.
readOnly: false

# Hub-managed configuration (D-022, WO-21): on every pull the agent fetches the cluster config,
# makes the RightsizingPolicy CRs labelled resource-optimizer.oz.io/managed-by=hub equal to the
# hub's policies (never touching other CRs), applies the hub's pause flag like a cluster-wide
# freeze and applies approve-once grants. The last config is kept in the ConfigMap
# <fullname>-config-state, so a restart without the hub keeps the pause flag and approvals.
# With readOnly the CRs are not written; the inventory is still reported.
# Before downgrading the agent below WO-21, delete the hub CRs:
#   kubectl delete rsp -l resource-optimizer.oz.io/managed-by=hub
configSync:
  enabled: true

pullInterval: 1m
hubStaleAfter: 5m
reportInterval: 10s
eventBuffer: 10000
tolerance: "0.05"
logLevel: info

# Label selectors of nodes where in-place resize must not be used (static CPU/Memory Manager
# policy, which the API does not expose). Nodes with swap are detected automatically.
# Example: ["resource-optimizer.oz.io/no-in-place=true", "node.kubernetes.io/cpu-manager-static"]
unsupportedNodeSelectors: []

# Health watch and rollback after every automatic change (WO-08). Thresholds and the watch
# duration come from guardrails.rollback of the effective policy.
health:
  enabled: true
  checkInterval: 15s
  # Prometheus-compatible endpoint for the CPU throttling ratio (the hub's VictoriaMetrics).
  # Empty disables throttling-based rollback unless cadvisorFallback is on.
  metricsURL: http://victoria-metrics.hub.svc:8428
  minThrottlingWindow: 2m
  # The cluster's metrics binding at metricsURL (D-025): label clusterLabel = clusterLabelValue
  # (default: clusterName; clusterLabel "" = no cluster matcher) plus extra PromQL matchers such as
  # 'env="prod"'. The hub's install snippet fills these from the cluster's binding.
  clusterLabel: cluster
  clusterLabelValue: ""
  extraMatchers: []
  # Read throttling from the kubelets' cAdvisor endpoints when metricsURL fails (offline hub).
  # Adds `get nodes/proxy` to the ClusterRole: that permission reaches every kubelet API, so it is
  # off by default.
  cadvisorFallback: false

# StatefulSets with updateStrategy OnDelete (WO-13): after the rollout strategy patched the pod
# template, the agent evicts the outdated pods (eviction API, so PodDisruptionBudgets apply),
# highest ordinal first, at most maxPodDeletesPerRun at a time, and only once every pod has been
# Ready for `settle` (or the StatefulSet's minReadySeconds) and the health watch reports no breach.
onDelete:
  maxPodDeletesPerRun: 1
  settle: 30s

# Readiness self-checks (D-025): RBAC per capability, CRDs, in-place resize, webhook, Argo CD,
# nodes, clock skew. They run at start, every interval and when the hub asks for a re-check, and
# are reported with the workload status.
selfCheck:
  enabled: true
  interval: 10m
  # Create a pod with dryRun=All to see the webhook mutate it. Adds `create pods` to the
  # ClusterRole (no pod is ever persisted, but the permission is broad), so it is off by default.
  webhookDryRun: false
  # MutatingWebhookConfiguration of the webhook chart; empty = found by its webhook name.
  webhookConfigName: ""
  docsBaseURL: ""
  argocd:
    # Read argocd-cm (only that ConfigMap, a Role in the Argo CD namespace) to check that Argo CD
    # ignores the agent's fields (D-006). The Role is created only when the namespace exists at
    # install time (Helm lookup); set force: true when rendering without cluster access (e.g. Argo
    # CD renders the chart) and the namespace exists.
    enabled: true
    namespace: argocd
    force: false

# More than 1 needs leaderElection: true (only the leader works; the others wait). Production
# example (also in ci/values-prod.yaml):
#   replicaCount: 2
#   leaderElection: true
#   podDisruptionBudget: {enabled: true, minAvailable: 1}     # rendered when replicaCount > 1
#   topologySpread: {enabled: true}                           # node and zone spread
#   priorityClassName: system-cluster-critical                # or your own class
replicaCount: 1
# Deprecated alias of replicaCount (wins when set).
replicas: null
leaderElection: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null
# Default node and zone spread (ScheduleAnyway) when replicaCount > 1; topologySpreadConstraints
# replaces it.
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway
topologySpreadConstraints: []
priorityClassName: ""

serviceAccount:
  # false: use an existing ServiceAccount `name` (the ClusterRole is still bound to it).
  create: true
  name: ""                  # default: the chart's full name (resource-optimizer-agent)
  annotations: {}

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  port: 8080
  # Adds prometheus.io/* scrape annotations to the metrics Service (WO-01 vmagent convention).
  scrape: true

# Prometheus Operator ServiceMonitor or VictoriaMetrics VMServiceScrape for the metrics Service.
serviceMonitor:
  enabled: false
  kind: ServiceMonitor        # or VMServiceScrape
  namespace: ""
  interval: 30s
  scrapeTimeout: ""
  honorLabels: false
  labels: {}
  relabelings: []
  metricRelabelings: []

# NetworkPolicy. Ingress to the metrics port from `ingress.metricsFrom` ([] = any source).
# Egress: DNS, TCP `egress.ports` to any destination (the API server 443/6443, the hub 8080 or
# 443, health.metricsURL 8428) and the raw rules in `egress.to` (e.g. to narrow them to CIDRs,
# set ports: [] and list them here).
networkPolicy:
  enabled: false
  ingress:
    metricsFrom: []
  egress:
    enabled: true
    ports: [443, 6443, 8080, 8428]
    to: []

# In-process stub of the hub's agent endpoints, for local development before the real hub
# exists. When enabled the agent talks to it instead of hub.url.
stubHub:
  enabled: false
  # cluster name -> list of WorkloadRecommendation (api/openapi/hub.yaml). id, generatedAt,
  # dataCoverage and riskFlags are filled in when missing.
  recommendations: {}
