{{- if include "agent.c.enabled" . -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# Minimal cluster-wide permissions. Write verbs on workloads and pods exist only when the agent
# may apply changes (readOnly: false). The agent always writes its own RightsizingRecommendations.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent.fullname" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  # Workloads: watched for policy resolution; patched (server-side apply under field manager
  # kerf, and the managedFields release) by the rollout strategy.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"{{ if not .Values.readOnly }}, "patch"{{ end }}]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"{{ if not .Values.readOnly }}, "patch"{{ end }}]
  # Owner chain to find a workload's pods (uncached reads).
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  # Pods: read for in-place status; patch only for the previous-resources annotation, resize
  # through the pods/resize subresource (D-007).
  # Pods are also watched by the health watch (restarts, OOM kills).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"{{ if not .Values.readOnly }}, "patch"{{ end }}]
  {{- if not .Values.readOnly }}
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  # OnDelete StatefulSets: outdated pods are evicted (never deleted), so PDBs apply (WO-13).
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  {{- end }}
  # PodDisruptionBudgets: single-replica protection (WO-13).
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # Nodes: swap / unsupported-node detection for in-place.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  {{- if and .Values.health.enabled .Values.health.cadvisorFallback }}
  # Health watch: CPU throttling from the kubelets' cAdvisor when the hub's metrics are unreachable.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  {{- end }}
  # HPA detection (D-011); patched (server-side apply of the utilization target) for HPA
  # coordination (WO-11).
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"{{ if not .Values.readOnly }}, "patch"{{ end }}]
  # Our CRDs. RightsizingPolicies are written only when they are materialised from the hub
  # config (labelled managed-by=hub, D-022); others are never touched.
  - apiGroups: ["kerf.getkerf.dev"]
    resources: ["rightsizingpolicies"]
    verbs: ["get", "list", "watch"{{ if and .Values.configSync.enabled (not .Values.readOnly) }}, "create", "update", "patch", "delete"{{ end }}]
  - apiGroups: ["kerf.getkerf.dev"]
    resources: ["rightsizingrecommendations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kerf.getkerf.dev"]
    resources: ["rightsizingrecommendations/status"]
    verbs: ["get", "update", "patch"]
  # Self-checks (D-025, D-026): CRD schema currency, the webhook configuration.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list"]
  {{- if .Values.selfCheck.webhookDryRun }}
  # Webhook dry-run self-check: pods are created with dryRun=All only.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
  {{- end }}
  # Kubernetes Events on RightsizingRecommendations (docs/contracts/events.md).
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent.fullname" . }}
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.configSync.enabled }}
---
# The last hub config (pause flag, approvals) persisted across restarts (WO-21).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.fullname" . }}-config-state
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-config-state" (include "agent.fullname" .) | quote }}]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.fullname" . }}-config-state
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent.fullname" . }}-config-state
subjects:
  - kind: ServiceAccount
    name: {{ include "agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.leaderElection }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# Self-check: the webhook Service's EndpointSlices (the webhook runs in the release namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.fullname" . }}-selfcheck
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.fullname" . }}-selfcheck
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent.fullname" . }}-selfcheck
subjects:
  - kind: ServiceAccount
    name: {{ include "agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- $argo := .Values.selfCheck.argocd }}
{{- if and .Values.selfCheck.enabled $argo.enabled (or $argo.force (lookup "v1" "Namespace" "" $argo.namespace)) }}
---
# Self-check integration.argocd: read argocd-cm only (D-026).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.fullname" . }}-argocd-cm
  namespace: {{ $argo.namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["argocd-cm"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.fullname" . }}-argocd-cm
  namespace: {{ $argo.namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent.fullname" . }}-argocd-cm
subjects:
  - kind: ServiceAccount
    name: {{ include "agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{ end -}}
