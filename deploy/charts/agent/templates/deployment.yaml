{{- if include "agent.c.enabled" . -}}
{{- if not .Values.clusterName }}{{ fail "clusterName is required" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
data:
  cluster-defaults.yaml: |
{{- if .Values.clusterDefaults }}
{{ toYaml .Values.clusterDefaults | indent 4 }}
{{- else }}
    {}
{{- end }}
  freeze.yaml: |
{{ toYaml (.Values.freeze | default dict) | indent 4 }}
{{- $tokenES := dig "externalSecret" "enabled" false .Values.hub.tokenSecret }}
{{- if and .Values.hub.tokenSecret.create $tokenES }}{{ fail "hub.tokenSecret.create and hub.tokenSecret.externalSecret are exclusive" }}{{ end }}
{{- $ca := include "agent.caEnabled" . }}
{{- if $tokenES }}
---
# Hub token of this cluster's agent (D-012), re-read on every request: a rotation needs no restart.
{{ include "agent.c.externalSecret" (dict "ctx" . "name" .Values.hub.tokenSecret.name "es" .Values.hub.tokenSecret.externalSecret "data" (list (dict "secretKey" .Values.hub.tokenSecret.key))) }}
{{- end }}
{{- with .Values.hub.caBundle }}
{{- if and .pem (not .existingConfigMap) (not .existingSecret) }}
---
# CA of the hub's HTTPS certificate (hub.caBundle).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent.fullname" $ }}-hub-ca
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "agent.labels" $ | nindent 4 }}
data:
  {{ .key }}: {{ .pem | quote }}
{{- end }}
{{- end }}
{{- if .Values.hub.tokenSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hub.tokenSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.hub.tokenSecret.key }}: {{ required "hub.tokenSecret.token is required with create: true" .Values.hub.tokenSecret.token | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  replicas: {{ include "agent.c.replicas" . }}
  {{- if and (gt (include "agent.c.replicas" . | int) 1) (not .Values.leaderElection) }}
  {{ fail "replicas > 1 needs leaderElection: true" }}
  {{- end }}
  selector:
    matchLabels: {{- include "agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
        # The agent must never be mutated by the webhook (WO-07).
        resource-optimizer.oz.io/skip-webhook: "true"
      annotations:
        checksum/config: {{ printf "%s%s" (toYaml .Values.clusterDefaults) (toYaml .Values.freeze) | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "agent.serviceAccountName" . }}
      {{- include "agent.c.imagePullSecrets" (dict "ctx" . "indent" 6) }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "agent.c.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --cluster-name={{ .Values.clusterName }}
            - --hub-url={{ include "agent.hubURL" . }}
            - --hub-token-file=/var/run/secrets/resource-optimizer/hub/{{ .Values.hub.tokenSecret.key }}
            - --cluster-defaults=/etc/resource-optimizer/cluster-defaults.yaml
            - --freeze-file=/etc/resource-optimizer/freeze.yaml
            - --pull-interval={{ .Values.pullInterval }}
            - --hub-stale-after={{ .Values.hubStaleAfter }}
            - --report-interval={{ .Values.reportInterval }}
            - --event-buffer={{ .Values.eventBuffer }}
            - --tolerance={{ .Values.tolerance }}
            - --read-only={{ .Values.readOnly }}
            - --leader-elect={{ .Values.leaderElection }}
            - --log-level={{ .Values.logLevel }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:8081
            - --health-watch={{ .Values.health.enabled }}
            - --health-check-interval={{ .Values.health.checkInterval }}
            - --metrics-url={{ .Values.health.metricsURL }}
            - --metrics-cluster-label={{ .Values.health.clusterLabel }}
            {{- with .Values.health.clusterLabelValue }}
            - --metrics-cluster-label-value={{ . }}
            {{- end }}
            {{- range .Values.health.extraMatchers }}
            - --metrics-extra-matcher={{ . }}
            {{- end }}
            - --self-check={{ .Values.selfCheck.enabled }}
            - --self-check-interval={{ .Values.selfCheck.interval }}
            - --self-check-webhook-dry-run={{ .Values.selfCheck.webhookDryRun }}
            {{- with .Values.selfCheck.webhookConfigName }}
            - --webhook-config-name={{ . }}
            {{- end }}
            - --argocd-namespace={{ .Values.selfCheck.argocd.namespace }}
            {{- with .Values.selfCheck.docsBaseURL }}
            - --docs-base-url={{ . }}
            {{- end }}
            - --health-min-throttling-window={{ .Values.health.minThrottlingWindow }}
            - --health-cadvisor-fallback={{ .Values.health.cadvisorFallback }}
            - --max-pod-deletes-per-run={{ .Values.onDelete.maxPodDeletesPerRun }}
            - --ondelete-settle={{ .Values.onDelete.settle }}
            - --config-sync={{ .Values.configSync.enabled }}
            - --config-state-configmap={{ include "agent.fullname" . }}-config-state
            {{- range .Values.unsupportedNodeSelectors }}
            - --unsupported-node-selector={{ . }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $ca }}
            # Go reads the system roots plus every file of these directories (hub.caBundle).
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/resource-optimizer/hub-ca
            {{- end }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- with .Values.extraEnvFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/resource-optimizer
              readOnly: true
            - name: hub-token
              mountPath: /var/run/secrets/resource-optimizer/hub
              readOnly: true
            {{- if $ca }}
            - name: hub-ca
              mountPath: /etc/resource-optimizer/hub-ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}{{ toYaml . | nindent 12 }}{{ end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "agent.fullname" . }}-config
        - name: hub-token
          secret:
            secretName: {{ .Values.hub.tokenSecret.name }}
            optional: true
        {{- if $ca }}
        {{- $c := .Values.hub.caBundle }}
        - name: hub-ca
          {{- if $c.existingSecret }}
          secret:
            secretName: {{ $c.existingSecret }}
          {{- else }}
          configMap:
            name: {{ $c.existingConfigMap | default (printf "%s-hub-ca" (include "agent.fullname" .)) }}
          {{- end }}
            items:
              - key: {{ $c.key }}
                path: ca.crt
        {{- end }}
        {{- with .Values.extraVolumes }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- include "agent.c.topologySpread" (dict "ctx" . "indent" 6) }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "agent.labels" . | nindent 4 }}
  {{- if .Values.metrics.scrape }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.metrics.port }}"
    prometheus.io/path: /metrics
  {{- end }}
spec:
  selector: {{- include "agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{ end -}}
