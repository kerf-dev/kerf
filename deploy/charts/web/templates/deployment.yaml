apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web.fullname" . }}
  labels: {{- include "web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "web.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart when the token changes (nginx reads it once at start).
        checksum/token: {{ (printf "%s/%s/%s" .Values.token.existingSecret .Values.token.existingSecretKey .Values.token.value) | sha256sum | trunc 16 }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HUB_UPSTREAM
              value: {{ .Values.hub.upstream | quote }}
            - name: HUB_TOKEN_FILE
              value: /etc/resource-optimizer/hub-token/token
            - name: ANONYMOUS_READ
              value: {{ .Values.auth.anonymousRead | quote }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: hub-token
              mountPath: /etc/resource-optimizer/hub-token
              readOnly: true
      volumes:
        - name: hub-token
          secret:
            secretName: {{ include "web.tokenSecret" . }}
            optional: true
            items:
              - key: {{ include "web.tokenKey" . }}
                path: token
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
