{{- if include "web.c.enabled" . -}}
{{- if dig "externalSecret" "enabled" false .Values.token }}
{{- if .Values.token.existingSecret }}{{ fail "token.externalSecret and token.existingSecret are exclusive" }}{{ end }}
# The `ui` token (D-012). nginx reads it at start: restart the pods after a rotation.
{{ include "web.c.externalSecret" (dict "ctx" . "name" (include "web.tokenSecret" .) "es" .Values.token.externalSecret "data" (list (dict "secretKey" "token"))) }}
{{- end }}
{{ end -}}
