{{- if and (not .Values.token.existingSecret) .Values.token.value (not (dig "externalSecret" "enabled" false .Values.token)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web.tokenSecret" . }}
  labels: {{- include "web.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.token.value | quote }}
{{- end }}
