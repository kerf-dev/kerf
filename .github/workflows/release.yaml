name: release

# Push a tag vX.Y.Z (or vX.Y.Z-rc.N) on main to publish that version (docs/release.md, "Releasing on GitHub"):
#   1. the ci workflow runs on the tagged commit;
#   2. Trivy scans the five images and fails the release on a CRITICAL or HIGH finding that has a fix;
#      then `make release` builds the five multi-arch images (SBOM + provenance) and the Helm charts and pushes
#      them to GitHub Container Registry: ghcr.io/<owner>/kerf/<image>:X.Y.Z and
#      oci://ghcr.io/<owner>/kerf/charts/<chart>, the charts defaulting to these images;
#   3. cosign signs every image and chart by digest (keyless, this workflow's GitHub OIDC identity);
#   4. the kerf command-line tool is built for linux and darwin (amd64, arm64) and cosign signs each binary
#      (`cosign sign-blob`, keyless, a .sigstore.json bundle next to it);
#   5. the Artifact Hub repository metadata (artifacthub-repo.yml) is pushed as the `artifacthub.io` tag of the
#      umbrella chart's repository, so the listing on artifacthub.io stays current;
#   6. a GitHub Release vX.Y.Z is created: CHANGELOG.md's section as the highlights, the Conventional Commits
#      since the previous release grouped by type (git-cliff, cliff.toml), install steps and the digests; the chart
#      packages, digest lists, the command-line binaries with their signature bundles and checksums are attached.
#      A -suffix makes it a pre-release.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_VERSION: v4.3.1
  COSIGN_VERSION: v3.1.4
  TRIVY_VERSION: v0.76.2
  # git-cliff builds the commit list of the release notes. The archive is checked against this SHA-256 (of the
  # x86_64 Linux musl build of GIT_CLIFF_VERSION, computed from the official release) before it is unpacked.
  ORAS_VERSION: 1.3.6
  GIT_CLIFF_VERSION: 2.14.2
  GIT_CLIFF_SHA256: fa21e2fc70046fcfd0e43e5e4613873ab799aff3d9dc8559c00d31b270e417d0

jobs:
  changelog:
    name: changelog has this version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/release/notes.sh --check "${GITHUB_REF_NAME#v}"

  ci:
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: [changelog, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # the GitHub Release
      packages: write   # GHCR
      id-token: write   # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all commits and tags, for the release notes' commit list and compare link
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install git-cliff (pinned, checksum verified)
        run: |
          archive=git-cliff-$GIT_CLIFF_VERSION-x86_64-unknown-linux-musl.tar.gz
          dir=$(mktemp -d)
          curl -fsSL --retry 3 -o "$dir/$archive" \
            "https://github.com/orhun/git-cliff/releases/download/v$GIT_CLIFF_VERSION/$archive"
          echo "$GIT_CLIFF_SHA256  $dir/$archive" | sha256sum --check --strict -
          tar -xzf "$dir/$archive" -C "$dir"
          install -m 0755 "$dir/git-cliff-$GIT_CLIFF_VERSION/git-cliff" "$RUNNER_TEMP/git-cliff"
          echo "GIT_CLIFF=$RUNNER_TEMP/git-cliff" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/git-cliff" --version

      - name: Version and registry
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "REGISTRY=ghcr.io/$owner/kerf" >> "$GITHUB_ENV"

      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }

      - name: Log in to GHCR (docker and helm)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # The release gate for what is inside the images: OS packages and the Go modules in the binaries. A CRITICAL or
      # HIGH finding with a fixed version stops the release before anything is pushed; findings without a fix do not
      # (nothing to upgrade to), and base image updates arrive through Dependabot's docker updates. The images are
      # built the same way as in `make release`, for the runner's platform (the packages are the same on arm64).
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Scan the images with Trivy (CRITICAL and HIGH with a fix fail the release)
        run: |
          failed=0
          for img in hub pricing agent webhook web; do
            case $img in web) df=web/Dockerfile ctx=web ;; *) df=cmd/$img/Dockerfile ctx=. ;; esac
            docker build --quiet --build-arg VERSION="$VERSION" -t "kerf-scan/$img:$VERSION" -f "$df" "$ctx"
            trivy image --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "kerf-scan/$img:$VERSION" || failed=1
          done
          if [ "$failed" != 0 ]; then
            echo "::error::Trivy found CRITICAL or HIGH vulnerabilities that have a fix; nothing was pushed"; exit 1
          fi

      - name: Build and push images and charts
        run: |
          make release REGISTRY="$REGISTRY" VERSION="$VERSION" \
            RELEASE_SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            RELEASE_CHART_DEFAULT_REGISTRY=1 RELEASE_INSECURE_REGISTRIES=

      - name: Sign images and charts (cosign, keyless)
        run: |
          while read -r ref _ digest; do
            ref=${ref#oci://}
            echo "signing $ref@$digest"
            cosign sign --yes "$ref@$digest"
          done < <(cat bin/release/images.txt bin/release/charts.txt)

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and sign the command-line tool (cosign, keyless)
        run: |
          make release-cli VERSION="$VERSION"
          for f in bin/release/cli/kerf_"$VERSION"_*; do
            echo "signing $f"
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ env.ORAS_VERSION }}

      # Artifact Hub reads the repository metadata of an OCI chart from the tag `artifacthub.io`
      # (https://artifacthub.io/docs/topics/repositories/helm-charts/#oci-support). docker login above covers oras.
      - name: Artifact Hub repository metadata
        run: |
          oras push "$REGISTRY/charts/kerf:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # git-cliff: the author and pull request of every commit
        run: |
          tools/release/notes.sh "$VERSION" "$REGISTRY" > bin/release/notes.md
          cat bin/release/notes.md >> "$GITHUB_STEP_SUMMARY"
          (cd bin/release/charts && sha256sum -- *.tgz) > bin/release/SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease --latest=false" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" --verify-tag $pre \
            --title "Kerf $VERSION" \
            --notes-file bin/release/notes.md \
            bin/release/charts/*.tgz bin/release/images.txt bin/release/charts.txt bin/release/SHA256SUMS \
            bin/release/cli/kerf_*
