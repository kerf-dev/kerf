name: e2e

# Create the k3d environment, deploy hub, pricing and agents, run the end-to-end suite,
# upload logs on failure. Tiers: the full suite (`make e2e`, <= 8 min on the dev fleet)
# nightly and on demand; the smoke tier (`make e2e-smoke`, <= 4 min) on pull requests that change
# Go code, charts or the suite. Pull requests run it only once a runner can host the fleet: set the
# repository variable E2E_ON_PULL_REQUESTS=true (and E2E_RUNNER to its label, default
# ubuntu-latest). Setup (clusters, images, deploys) adds ~5 min.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "full or smoke"
        default: full
        type: choice
        options: [full, smoke]
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "deploy/**"
      - "test/e2e/**"
      - "make/e2e.mk"
      - ".github/workflows/e2e.yaml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request' || vars.E2E_ON_PULL_REQUESTS == 'true'
    # ubuntu-latest: 4 vCPU / 16 GiB on public repositories; three k3d clusters + Argo CD +
    # VictoriaMetrics need ~10 GiB, and the suite's workloads ~3 cores on ro-spoke-1.
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      E2E_TIER: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.tier || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install k3d, kubectl, helm
        # Versions match dev/README.md and the quickstart workflow. Each tool is downloaded to a file first
        # (curl -f fails the step on a 404) and checked against a SHA-256 before it is installed.
        env:
          K3D_VERSION: v5.9.0
          K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
          KUBECTL_VERSION: v1.35.4
          HELM_VERSION: v4.3.1
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/tools"
          mkdir -p "$dl"

          curl -fsSL --retry 3 -o "$dl/k3d" "https://github.com/k3d-io/k3d/releases/download/$K3D_VERSION/k3d-linux-amd64"
          echo "$K3D_SHA256  $dl/k3d" | sha256sum --check --strict -
          sudo install -m 0755 "$dl/k3d" /usr/local/bin/k3d

          curl -fsSL --retry 3 -o "$dl/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl -fsSL --retry 3 -o "$dl/kubectl.sha256" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
          echo "$(cat "$dl/kubectl.sha256")  $dl/kubectl" | sha256sum --check --strict -
          sudo install -m 0755 "$dl/kubectl" /usr/local/bin/kubectl

          helm_tgz="helm-$HELM_VERSION-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "$dl/$helm_tgz" "https://get.helm.sh/$helm_tgz"
          curl -fsSL --retry 3 -o "$dl/$helm_tgz.sha256sum" "https://get.helm.sh/$helm_tgz.sha256sum"
          (cd "$dl" && sha256sum --check --strict "$helm_tgz.sha256sum")
          tar -xzf "$dl/$helm_tgz" -C "$dl"
          sudo install -m 0755 "$dl/linux-amd64/helm" /usr/local/bin/helm

          k3d version
          kubectl version --client
          helm version
      - name: Create clusters
        run: make dev-up
      - name: Deploy hub, pricing, agents
        run: |
          make deploy-hub deploy-pricing
          kubectl --context k3d-ro-hub -n kerf rollout status deploy/hub --timeout=5m
          make deploy-agent
          # Agent tokens: key <cluster> of Secret hub-dev-tokens on ro-hub.
          for c in ro-spoke-1 ro-spoke-2; do
            kubectl --context k3d-ro-hub -n kerf get secret hub-dev-tokens -o jsonpath="{.data.$c}" | base64 -d \
              | kubectl --context k3d-$c -n kerf create secret generic kerf-agent-token \
                  --from-file=token=/dev/stdin --dry-run=client -o yaml | kubectl --context k3d-$c apply -f -
          done
      - name: Run e2e (${{ env.E2E_TIER }})
        run: |
          if [ "$E2E_TIER" = smoke ]; then make e2e-smoke; else make e2e; fi
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p e2e-logs
          cp bin/e2e*.log bin/e2e*.json e2e-logs/ || true
          for c in ro-hub ro-spoke-1 ro-spoke-2; do
            kubectl --context k3d-$c cluster-info dump --all-namespaces --output-directory=e2e-logs/$c >/dev/null || true
            kubectl --context k3d-$c get rightsizingrecommendations,rightsizingpolicies -A -o yaml > e2e-logs/$c/rightsizing.yaml 2>/dev/null || true
          done
          kubectl --context k3d-ro-spoke-1 -n argocd get applications -o yaml > e2e-logs/argocd-applications.yaml || true
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs
          retention-days: 7
