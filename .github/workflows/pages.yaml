name: pages

# Publishes getkerf.dev (site/) to GitHub Pages: on a push to main that touches the site or this workflow, or by
# hand. Pages must use "GitHub Actions" as its source, with the custom domain getkerf.dev and HTTPS enforced.
# The site is static: no build, only checks. Actions are pinned by commit SHA (Dependabot updates them).

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HTML_VALIDATE_VERSION: 11.18.0

jobs:
  build:
    name: build (check and package site/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Links (local files, fragments, repository paths)
        run: node site/tools/check-links.mjs
      - name: HTML validation
        run: npx --yes "html-validate@${HTML_VALIDATE_VERSION}" site/index.html site/404.html
      - name: Assemble the published files (without tools/ and dotfiles)
        run: rsync -a --exclude tools/ --exclude '.*' --exclude README.md site/ _site/ && find _site -type f | sort
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
