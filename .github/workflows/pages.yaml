name: pages

# Publishes getkerf.dev to GitHub Pages: the site (site/) at / and the documentation (docs/, MkDocs Material,
# tools/docs) at /docs/. Pages must use "GitHub Actions" as its source, with the custom domain getkerf.dev and
# HTTPS enforced.
#
# Runs on a push to main that touches the site, the docs or this workflow; after a release has been published (the
# docs get a version for the new minor); by hand; and on pull requests, where it only builds and checks.
# Only main deploys: a pull request or a branch run stops after the build.
#
# The docs are built for `dev` (main) and for the newest tag of each of the last three minor releases, with a
# version switch (tools/docs/build_site.py). Until there is a final release, that is main and the newest release
# candidate. Actions are pinned by commit SHA (Dependabot updates them).

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - docs-site/**
      - mkdocs.yml
      - tools/docs/**
      - .github/workflows/pages.yaml
  pull_request:
    paths:
      - site/**
      - docs/**
      - docs-site/**
      - mkdocs.yml
      - tools/docs/**
      - .github/workflows/pages.yaml
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deployment in progress. Builds of pull
# requests and branches have their own group and are superseded by a newer push.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HTML_VALIDATE_VERSION: 11.18.0

jobs:
  build:
    name: build (check and package the site and the docs)
    # After a release, only when the release workflow succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # every tag: the docs of each release are built from its tag
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt
      - name: Links of site/ (local files, fragments, repository paths)
        run: node site/tools/check-links.mjs
      - name: HTML validation
        run: npx --yes "html-validate@${HTML_VALIDATE_VERSION}" site/index.html site/404.html
      - name: Docs tooling (tests, reference pages up to date)
        run: make docs-test docs-check-generated DOCS_PYTHON=python
      - name: Assemble the published files (without tools/ and dotfiles)
        run: rsync -a --exclude tools/ --exclude '.*' --exclude README.md site/ _site/
      - name: Build the documentation, every version, into _site/docs
        run: make docs-site DOCS_PYTHON=python DOCS_OUT="$PWD/_site/docs"
      - name: Links of the assembled site and docs
        run: node tools/docs/check-links.mjs _site
      - name: Published files
        run: find _site -type f -not -path '_site/docs/*/*' | sort
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    # Only main deploys. A pull request or a branch run ends after the build.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
