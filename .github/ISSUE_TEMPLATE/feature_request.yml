name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Describe the problem first: the best design often differs from the first proposal.
        Open questions and early ideas fit better in [Discussions](https://github.com/kerf-dev/kerf/discussions).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: We run 30 namespaces per cluster and want auto-patch on for all of them except the batch jobs, without a policy per namespace.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work, from your point of view. Changes to the CRDs, the hub API or the metrics need a short design note.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you tried, or how other tools handle it.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I'd like to open a pull request"
        - Maybe, with some guidance
        - "No"
