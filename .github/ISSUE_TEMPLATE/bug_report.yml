name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through **Security → Report a vulnerability**, not an issue. Remove tokens, hostnames and other private data from logs before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, the relevant chart values (without secrets) and resources.
  - type: input
    id: version
    attributes:
      label: resource-optimizer version
      placeholder: chart and image version, e.g. 0.1.0
    validations: {required: true}
  - type: input
    id: platform
    attributes:
      label: Kubernetes
      placeholder: e.g. EKS 1.35, metrics from Prometheus 3.x
  - type: textarea
    id: logs
    attributes:
      label: Logs and readiness
      description: Hub, agent or webhook logs; the cluster's readiness checks from the UI.
      render: text
