# Static prices for the pricing service's `static` provider. Used locally and in tests, and baked into the
# pricing image as the default price file.
#
# Values are USD per hour for Linux, shared tenancy. They approximate AWS list prices and are dev data, not a
# source of truth: production uses `--provider aws`. A node whose instance type or region is missing here is
# reported as `skipped: no-price` (the pricing log names the instance type), so add the type or switch provider.
# On-demand prices are per region; spot prices may be set per zone (spotByZone), with `spot` used for
# any other zone. An instance type needs an entry under instanceTypes (vCPU and GiB as sold).
#
# Regions: eu-west-1 (Ireland) holds the x86 families, the older Graviton families and the newer Graviton
# families below; us-east-1 (N. Virginia) holds the Graviton families only.
#
# Graviton families (c7g, c8g, m7g, m8g, r7g, r8g, t4g), sizes up to 4xlarge (t4g up to 2xlarge, its largest):
#   on-demand: public AWS price list for EC2, Linux, shared tenancy, published 2026-11-07
#              (https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/<region>/index.json,
#              the same data as the EC2 on-demand pricing page).
#   spot:      on-demand price x (1 - savings), with the savings of the EC2 Spot Instance Advisor data
#              (https://spot-bid-advisor.s3.amazonaws.com/spot-advisor-data.json, published 2026-03-20).
#              Spot prices move constantly: treat these as a typical level, not a quote.
# The other rows are older estimates (late 2026, eu-west-1).
#
# The real spokes use m6i.xlarge on-demand (ro-spoke-1, eu-west-1a) and c6a.2xlarge spot
# (ro-spoke-2, eu-west-1b); synth-a/synth-b also use these types. The c/m/r siblings of each family
# let the service derive the vCPU:GiB price weight (see internal/pricing/split.go).

instanceTypes:
  # general purpose
  m5.large:     {vcpu: 2, memoryGiB: 8}
  m5.xlarge:    {vcpu: 4, memoryGiB: 16}
