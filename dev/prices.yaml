  # Graviton (arm64) burstable
  t4g.nano:     {vcpu: 2, memoryGiB: 0.5}
  t4g.micro:    {vcpu: 2, memoryGiB: 1}
  t4g.small:    {vcpu: 2, memoryGiB: 2}
