# Static prices for the pricing service's `static` provider (WO-03). Used locally and in tests.
#
# Values are USD per hour for Linux, shared tenancy, eu-west-1 (Ireland), approximating AWS list
# prices in late 2026. They are dev data, not a source of truth: production uses `--provider aws`.
# On-demand prices are per region; spot prices may be set per zone (spotByZone), with `spot` used for
# any other zone. An instance type needs an entry under instanceTypes (vCPU and GiB as sold).
#
# The real spokes use m6i.xlarge on-demand (ro-spoke-1, eu-west-1a) and c6a.2xlarge spot
# (ro-spoke-2, eu-west-1b); synth-a/synth-b also use these types. The c/m/r siblings of each family
# let the service derive the vCPU:GiB price weight (see internal/pricing/split.go).

instanceTypes:
  # general purpose
  m5.large:     {vcpu: 2, memoryGiB: 8}
  m5.xlarge:    {vcpu: 4, memoryGiB: 16}
  m5.2xlarge:   {vcpu: 8, memoryGiB: 32}
  m6i.large:    {vcpu: 2, memoryGiB: 8}
  m6i.xlarge:   {vcpu: 4, memoryGiB: 16}
  m6i.2xlarge:  {vcpu: 8, memoryGiB: 32}
  m6i.4xlarge:  {vcpu: 16, memoryGiB: 64}
  m6a.large:    {vcpu: 2, memoryGiB: 8}
  m6a.xlarge:   {vcpu: 4, memoryGiB: 16}
  m6a.2xlarge:  {vcpu: 8, memoryGiB: 32}
  m6a.4xlarge:  {vcpu: 16, memoryGiB: 64}
  m6g.large:    {vcpu: 2, memoryGiB: 8}
  m6g.xlarge:   {vcpu: 4, memoryGiB: 16}
  m6g.2xlarge:  {vcpu: 8, memoryGiB: 32}
  m7i.large:    {vcpu: 2, memoryGiB: 8}
  m7i.xlarge:   {vcpu: 4, memoryGiB: 16}
  m7i.2xlarge:  {vcpu: 8, memoryGiB: 32}
  # compute optimized
  c5.large:     {vcpu: 2, memoryGiB: 4}
  c5.xlarge:    {vcpu: 4, memoryGiB: 8}
  c5.2xlarge:   {vcpu: 8, memoryGiB: 16}
  c6i.large:    {vcpu: 2, memoryGiB: 4}
  c6i.xlarge:   {vcpu: 4, memoryGiB: 8}
  c6i.2xlarge:  {vcpu: 8, memoryGiB: 16}
  c6i.4xlarge:  {vcpu: 16, memoryGiB: 32}
  c6a.large:    {vcpu: 2, memoryGiB: 4}
  c6a.xlarge:   {vcpu: 4, memoryGiB: 8}
  c6a.2xlarge:  {vcpu: 8, memoryGiB: 16}
  c6a.4xlarge:  {vcpu: 16, memoryGiB: 32}
  c6g.large:    {vcpu: 2, memoryGiB: 4}
  c6g.xlarge:   {vcpu: 4, memoryGiB: 8}
  c6g.2xlarge:  {vcpu: 8, memoryGiB: 16}
  c7i.large:    {vcpu: 2, memoryGiB: 4}
  c7i.xlarge:   {vcpu: 4, memoryGiB: 8}
  c7i.2xlarge:  {vcpu: 8, memoryGiB: 16}
  # memory optimized
  r5.large:     {vcpu: 2, memoryGiB: 16}
  r5.xlarge:    {vcpu: 4, memoryGiB: 32}
  r5.2xlarge:   {vcpu: 8, memoryGiB: 64}
  r6i.large:    {vcpu: 2, memoryGiB: 16}
  r6i.xlarge:   {vcpu: 4, memoryGiB: 32}
  r6i.2xlarge:  {vcpu: 8, memoryGiB: 64}
  r6i.4xlarge:  {vcpu: 16, memoryGiB: 128}
  r6a.large:    {vcpu: 2, memoryGiB: 16}
  r6a.xlarge:   {vcpu: 4, memoryGiB: 32}
  r6a.2xlarge:  {vcpu: 8, memoryGiB: 64}
  r6a.4xlarge:  {vcpu: 16, memoryGiB: 128}
  r6g.large:    {vcpu: 2, memoryGiB: 16}
  r6g.xlarge:   {vcpu: 4, memoryGiB: 32}
  r6g.2xlarge:  {vcpu: 8, memoryGiB: 64}
  r7i.large:    {vcpu: 2, memoryGiB: 16}
  r7i.xlarge:   {vcpu: 4, memoryGiB: 32}
  r7i.2xlarge:  {vcpu: 8, memoryGiB: 64}

