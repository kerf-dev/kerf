  t4g.large:    {vcpu: 2, memoryGiB: 8}
  t4g.xlarge:   {vcpu: 4, memoryGiB: 16}
  t4g.2xlarge:  {vcpu: 8, memoryGiB: 32}
  # accelerated computing (gpus: NVIDIA GPUs of the instance type)
  g4dn.xlarge:   {vcpu: 4, memoryGiB: 16, gpus: 1}
