# Argo CD Application on ro-spoke-1 syncing the sample workloads from the in-cluster git server.
# D-006: fields owned by field manager `kerf` are ignored for diffing (here and globally in
# argocd-cm) and RespectIgnoreDifferences=true keeps a sync from overwriting them. Releasing the
# ownership (agent switches back from auto-patch) lets the next sync restore the Git values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://git-server.git-server.svc.cluster.local/workloads.git
    targetRevision: main
    path: .
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: apps
      kind: Deployment
      managedFieldsManagers: [kerf]
    - group: apps
      kind: StatefulSet
      managedFieldsManagers: [kerf]
    - group: apps
      kind: DaemonSet
      managedFieldsManagers: [kerf]
    - group: batch
      kind: CronJob
      managedFieldsManagers: [kerf]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
