# vm/victoria-metrics-agent on every spoke, namespace monitoring.
# Scrapes kubelet, cAdvisor and kube-state-metrics and remote-writes to the hub's VictoriaMetrics
# through the selector-less Service hub/victoria-metrics (dev/manifests/spoke/hub-link.yaml).
# dev/scripts/up.sh sets config.global.external_labels.cluster=<cluster name> per spoke.
fullnameOverride: vmagent

remoteWrite:
  - url: http://victoria-metrics.hub.svc:8428/api/v1/write

extraArgs:
  envflag.enable: true
  envflag.prefix: VM_
  loggerFormat: json
  promscrape.dropOriginalLabels: true
  remoteWrite.queues: 2 # default is 2x CPUs (16 here): needless buffers for a dev cluster
  remoteWrite.maxDiskUsagePerURL: 256MB

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

config:
  global:
    scrape_interval: 30s
    external_labels:
      cluster: CHANGE-ME # overridden per spoke
  scrape_configs:
    - job_name: vmagent
      static_configs:
        - targets: ["localhost:8429"]

    - job_name: kubelet
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node
      metric_relabel_configs:
        # keep kubelet's own series small: drop the per-request histograms
        - source_labels: [__name__]
          regex: "(apiserver|rest_client|workqueue|storage_operation|kubelet_runtime_operations_duration_seconds)_.*_bucket"
          action: drop

    - job_name: cadvisor
      scheme: https
      metrics_path: /metrics/cadvisor
      honor_timestamps: false
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - source_labels: [__meta_kubernetes_node_name]
          target_label: node

    - job_name: kube-state-metrics
      honor_labels: true
      static_configs:
        - targets: ["kube-state-metrics.monitoring.svc:8080"]

    # Spoke components (agent, webhook): annotate the Service with
    # prometheus.io/scrape: "true" and prometheus.io/port (and optionally prometheus.io/path, /scheme).
    - job_name: annotated-services
      honor_labels: true
      kubernetes_sd_configs:
        - role: endpoints
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
          action: replace
          target_label: __scheme__
          regex: (https?)
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
          action: replace
          target_label: __address__
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
        - source_labels: [__meta_kubernetes_namespace]
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_service_name]
          target_label: kubernetes_service
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: kubernetes_pod
