# jetstack/cert-manager on every spoke, namespace cert-manager (used by the webhook chart, WO-07).
crds:
  enabled: true
  keep: false
prometheus:
  enabled: false
startupapicheck:
  enabled: false
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 96Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 160Mi
