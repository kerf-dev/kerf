# CronJob: every 5 minutes, ~60s at ~half a core.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-batch
  labels:
    app: cronjob-batch
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: cronjob-batch
        spec:
          restartPolicy: Never
          containers:
            - name: app
              image: colinianking/stress-ng:77b17fb95ec2f00e1c2ac2a8a20fe799150d8bd5
              args: ["--cpu", "1", "--cpu-load", "50", "--timeout", "60s"]
              resources:
                requests:
                  cpu: 250m
                  memory: 64Mi
                limits:
                  memory: 128Mi
