# Single-replica Deployment with a PDB that blocks voluntary eviction (zero-downtime case).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: single-replica
  labels:
    app: single-replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: single-replica
  template:
    metadata:
      labels:
        app: single-replica
    spec:
      containers:
        - name: app
          image: colinianking/stress-ng:77b17fb95ec2f00e1c2ac2a8a20fe799150d8bd5
          args: ["--cpu", "1", "--cpu-load", "3", "--vm", "1", "--vm-bytes", "16M", "--vm-hang", "0", "--timeout", "0"]
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: single-replica
  labels:
    app: single-replica
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: single-replica
