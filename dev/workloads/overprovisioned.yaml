# Overprovisioned: requests 500m / 256Mi, uses ~50m CPU (10%) and ~24Mi of memory (~10%).
# Target of WO-06's in-place verification (kubectl annotate deploy/overprovisioned ...).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovisioned
  labels:
    app: overprovisioned
spec:
  replicas: 2
  selector:
    matchLabels:
      app: overprovisioned
  template:
    metadata:
      labels:
        app: overprovisioned
    spec:
      containers:
        - name: app
          image: colinianking/stress-ng:77b17fb95ec2f00e1c2ac2a8a20fe799150d8bd5
          args: ["--cpu", "1", "--cpu-load", "5", "--vm", "1", "--vm-bytes", "24M", "--vm-hang", "0", "--timeout", "0"]
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
