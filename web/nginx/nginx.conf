# Main nginx config for the web UI image (WO-14, unprivileged since WO-18c).
#
# The container runs as uid/gid 101 (nginx) with a read-only root filesystem. The only writable path
# is /tmp (an emptyDir in Kubernetes, `--tmpfs /tmp` with `docker run --read-only`):
#   /tmp/conf.d/default.conf   rendered from /etc/nginx/templates/conf.d/default.conf.template at start
#   /tmp/nginx.pid             pid file
#   /tmp/*_temp                request-body and proxy buffers that spill to disk
# Logs go to stdout/stderr (/var/log/nginx/*.log are symlinks to /dev/std*), /var/cache/nginx is unused.
# No `user` directive: the master process is already unprivileged.

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    include /tmp/conf.d/*.conf;
}
