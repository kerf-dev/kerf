        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReason'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DatasourceNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/admin/datasources/{datasourceId}/test:
    parameters:
      - $ref: '#/components/parameters/DatasourceID'
    post:
      tags: [admin]
      operationId: testDatasource
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Run the metrics checks against a datasource now
      description: |
        Runs `datasource.reachable` and, with `binding`, every hub metrics check for that binding
        (before any agent exists; the onboarding wizard's "Test"). Nothing is stored or audited.
        Returns `200` also when checks fail; `ok` is true when no blocking check failed.
