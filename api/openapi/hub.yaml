          description: Datasource.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datasource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
