        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceTestRequest'
      responses:
        '200':
          description: Check results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DatasourceNotFound'
  /v1/internal/metrics-bindings:
    get:
      tags: [internal]
      operationId: listMetricsBindings
      security:
        - bearerAuth: [pricing]
      summary: Metrics binding of every registered cluster (pricing service)
      description: |
        The binding of every registered, not deleted cluster (D-025, D-026). `bound` is false for a
        cluster without a stored binding: its metrics are in datasource `local` with label `cluster`
        = its name. Never contains datasource secrets. An `admin` token may call it too.
      responses:
        '200':
          description: Bindings by cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsBindingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/internal/datasources/{datasourceId}/api/v1/query:
    parameters:
      - $ref: '#/components/parameters/DatasourceID'
    get:
      tags: [internal]
      operationId: proxyInstantQuery
      security:
        - bearerAuth: [pricing]
      summary: Instant PromQL query against a datasource (pricing service)
      description: |
        Runs the query against the datasource with the datasource's auth and headers, which never
        leave the hub (D-026), and returns the datasource's response unchanged (the Prometheus
        HTTP API `/api/v1/query` format, including its errors and status code). Only `query`,
        `time` and `timeout` are forwarded. POST with a form body is accepted too.
      parameters:
        - $ref: '#/components/parameters/PromQuery'
        - name: time
          in: query
          schema:
            type: string
        - name: timeout
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/PromQueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DatasourceNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
    post:
      tags: [internal]
      operationId: proxyInstantQueryPost
      security:
        - bearerAuth: [pricing]
      summary: Instant PromQL query against a datasource (form body)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PromQueryForm'
      responses:
        '200':
          $ref: '#/components/responses/PromQueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DatasourceNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/internal/datasources/{datasourceId}/api/v1/query_range:
    parameters:
      - $ref: '#/components/parameters/DatasourceID'
    get:
      tags: [internal]
      operationId: proxyRangeQuery
      security:
        - bearerAuth: [pricing]
      summary: Range PromQL query against a datasource (pricing service)
      description: |
        As the instant query, for `/api/v1/query_range`: `query`, `start`, `end`, `step` and
        `timeout` are forwarded.
      parameters:
        - $ref: '#/components/parameters/PromQuery'
        - name: start
          in: query
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: string
        - name: step
          in: query
          schema:
            type: string
        - name: timeout
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/PromQueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DatasourceNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
    post:
      tags: [internal]
      operationId: proxyRangeQueryPost
      security:
        - bearerAuth: [pricing]
      summary: Range PromQL query against a datasource (form body)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PromQueryForm'
      responses:
        '200':
          $ref: '#/components/responses/PromQueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DatasourceNotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/clusters/{cluster}/readiness:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    get:
      tags: [ui]
      operationId: getClusterReadiness
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Readiness state and check results of a cluster (D-025)
      description: |
        The latest result of every check (hub metrics checks and agent self-checks), the state they
        imply and what blocks the next state. Checks never run yet have status `unknown`.
      responses:
        '200':
          description: Readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterReadiness'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/clusters/{cluster}/readiness/recheck:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    post:
      tags: [ui]
      operationId: recheckClusterReadiness
      security:
        - sessionAuth: [operator]
        - bearerAuth: [admin]
      summary: Re-run the readiness checks now
      description: |
        Queues the hub metrics checks and sets the recheck flag in the cluster's config, so the
        agent re-runs its self-checks on its next pull. Results appear in
        `GET /v1/clusters/{cluster}/readiness` as they arrive. Not audited.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '202':
          description: Re-check queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecheckAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/clusters/{cluster}/readiness/history:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    get:
      tags: [ui]
      operationId: getClusterReadinessHistory
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: State transitions and check status changes
      description: Only changes are stored (a check's status or the state), newest first.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: History.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/clusters/{cluster}/install:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    get:
      tags: [admin]
      operationId: getClusterInstall
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Agent install instructions for a cluster
      description: |
        Rendered for this cluster and hub URL. The token value is never included: the snippet
        references the Secret `kerf-agent-token` (key `token`); the value is shown
        once when the token is created. Also returns the Argo CD `ignoreDifferences` snippet for
        `argocd-cm` (D-006).
      parameters:
        - name: format
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/InstallFormat'
        - name: webhook
          in: query
          description: Include the webhook install.
          schema:
            type: boolean
            default: false
        - name: certManager
          in: query
          description: Webhook certificates from cert-manager (otherwise self-signed).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Install instructions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallSnippet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/maintenance:
    get:
      tags: [admin]
      operationId: getMaintenance
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Component versions and the update check
      description: |
        The versions of every Kerf component the hub knows of (WO-33): each hub replica (seen in the
        last 10 minutes), the pricing service (reported with its requests to the hub, seen in the last
        hour), and per registered cluster the agent (status batch) and webhook pods (agent self-check).
        `compat` compares each with the hub version of the replica that answered. `update` is the
        stored result of the check for a newer stable Kerf release (`hub.updateCheck` chart values).
        The web UI knows its own version (build-time constant) and compares it client-side.
      responses:
        '200':
          description: Versions and update status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Maintenance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/maintenance/update-check:
    post:
      tags: [admin]
      operationId: checkForUpdate
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Check for a newer Kerf release now
      description: |
        Reads the public GitHub releases of kerf-dev/kerf now (plain unauthenticated GET; nothing about
        the installation is sent), stores the result and returns it. Returns the stored result without
        a request when the last check is less than 30 seconds old. `200` also when the check failed
        (`state: failed`, `error`). `409 update_check_disabled` when the chart value
        `hub.updateCheck.enabled` is false.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: The update status after the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque token with role `agent` (per cluster), `ui`, `admin` (D-012) or `pricing` (D-026).
    sessionAuth:
      type: apiKey
      in: cookie
      name: kerf_session
      description: |
        Session of a local user (D-023), set by `POST /v1/auth/login`. The requirement lists the
        lowest user role accepted (`viewer` < `operator` < `admin`). Writes also need `X-CSRF-Token`.
  headers:
    ETag:
      description: '`"<version>"` of the returned object; send it back in `If-Match`.'
      schema:
        type: string
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when the request is authenticated with the session cookie.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (`"<version>"`) of the object being changed (`428` if missing, `412` if stale).
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: ETag (`"<version>"`) of the object being changed; checked when given (`412` if stale).
      schema:
        type: string
    PromQuery:
      name: query
      in: query
      required: true
      description: PromQL expression.
      schema:
        type: string
    DatasourceID:
      name: datasourceId
      in: path
      required: true
      description: '`local` or a UUID.'
      schema:
        type: string
    PolicyID:
      name: policyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Username:
      name: username
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Username'
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Cluster:
      name: cluster
      in: path
      required: true
      description: Cluster name.
      schema:
        $ref: '#/components/schemas/ClusterName'
    Limit:
      name: limit
      in: query
      description: Maximum number of items in this page.
      schema:
        type: integer
        minimum: 1
        maximum: 5000
    WorkloadID:
      name: id
      in: path
      required: true
      description: Workload id `<cluster>/<namespace>/<kind>/<name>`, URL-encoded as one segment.
      schema:
        $ref: '#/components/schemas/WorkloadID'
    From:
      name: from
      in: query
      description: Inclusive start. Default `to` minus 7 days.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Exclusive end. Default now.
      schema:
        type: string
        format: date-time
    Step:
      name: step
      in: query
      description: Resolution (Go duration). Default chosen so the result has at most 1000 points.
      schema:
        type: string
        examples: [5m, 1h, 24h]
    Continue:
      name: continue
      in: query
      description: Token from a previous page's `continue` field.
      schema:
        type: string
  responses:
    BadGateway:
      description: The datasource could not be reached.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PromQueryResult:
      description: The datasource's Prometheus HTTP API response, unchanged (also for its own errors).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PromQueryResponse'
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token is not allowed to access this cluster.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkloadNotFound:
      description: Unknown workload id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Unknown cluster.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooLarge:
      description: Batch too large (more than 1000 items or 8 MiB).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The change conflicts with the current state (`code` says how).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: '`If-Match` does not match the current version (code `version_conflict`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: '`If-Match` is required (code `precondition_required`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many failed attempts (code `rate_limited` or `account_locked`).
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PolicyNotFound:
      description: Unknown policy id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DatasourceNotFound:
      description: Unknown datasource id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UserNotFound:
      description: Unknown username.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ClusterName:
      type: string
      pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
      examples: [ro-spoke-1]
    WorkloadKind:
      type: string
      enum: [Deployment, StatefulSet, DaemonSet, CronJob]
    Mode:
      type: string
      enum: ['off', audit, auto-patch]
    ModeSource:
      type: string
      enum: [global-default, cluster-default, policy, annotation]
    Strategy:
      type: string
      enum: [in-place, rollout, deferred]
    Profile:
      type: string
      enum: [dev, production, high-availability]
    Phase:
      type: string
      enum: [Pending, Applying, Applied, Blocked, RolledBack, Released, Deferred]
    RiskFlag:
      type: string
      description: |
        `throttled`, `oom-killed`: the workload is under-provisioned; the recommendation is never
        a decrease for that resource. `hpa-coupled`: CPU/memory-utilization HPA, audit-only
        (D-011). `low-confidence`: confidence below the hub threshold. `jvm-fixed-heap`: a JVM
        container with a fixed maximum heap (`-Xmx` / `-XX:MaxHeapSize`); its memory is audit-only,
        the agent never changes it (WO-12).
      enum: [throttled, oom-killed, restarting, hpa-coupled, sidecar, short-lived, low-confidence, jvm-fixed-heap]
    EventType:
      type: string
      enum: [applied, skipped, blocked, fallback, rolled_back, released, failed]
    ResourceName:
      type: string
      enum: [cpu, memory]
    Quantity:
      type: string
      description: Kubernetes resource quantity.
      pattern: '^[0-9]+(\.[0-9]+)?(m|k|M|G|T|Ki|Mi|Gi|Ti)?$'
      examples: [250m, 512Mi]
    Decimal:
      type: number
      minimum: 0
      maximum: 1
    ResourceValues:
      type: object
      description: Values per resource. A missing key means "not set".
      additionalProperties: false
      properties:
        cpu:
          $ref: '#/components/schemas/Quantity'
        memory:
          $ref: '#/components/schemas/Quantity'
    Resources:
      type: object
      properties:
        requests:
          $ref: '#/components/schemas/ResourceValues'
        limits:
          $ref: '#/components/schemas/ResourceValues'
    ContainerResources:
      type: object
      required: [name]
      properties:
        name:
          type: string
        requests:
          $ref: '#/components/schemas/ResourceValues'
        limits:
          $ref: '#/components/schemas/ResourceValues'
    WorkloadRef:
      type: object
      required: [namespace, kind, name]
      properties:
        namespace:
          type: string
        kind:
          $ref: '#/components/schemas/WorkloadKind'
        name:
          type: string
    ValueSettings:
      type: object
      description: |
        The policy settings that change recommended values. Reported by the agent from its
        effective policy; echoed by the hub in each recommendation as the settings it used. If they
        differ from the agent's current effective policy, the agent treats the recommendation as
        stale (reason `RecommendationStale`) and waits for the next run.
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        cpuLimits:
          type: string
          enum: [keep, remove, ratio]
        cpuLimitRatio:
          type: string
          description: Decimal multiple of the request, only with `cpuLimits = ratio`.
          examples: ['2']
        memoryLimitEqualsRequest:
          type: boolean
    ContainerRecommendation:
      type: object
      required: [name, current, recommended]
      properties:
        name:
          type: string
        init:
          type: boolean
          description: True for init and native sidecar containers.
        current:
          $ref: '#/components/schemas/Resources'
        recommended:
          $ref: '#/components/schemas/Resources'
        removeLimits:
          type: array
          description: Resources whose limit should be removed.
          items:
            $ref: '#/components/schemas/ResourceName'
        riskFlags:
          type: array
          items:
            $ref: '#/components/schemas/RiskFlag'
        monthlySavingsUSD:
          $ref: '#/components/schemas/Savings'
        explanation:
          $ref: '#/components/schemas/ContainerExplanation'
    Savings:
      type: object
      description: |
        Estimated monthly savings in USD: (current - recommended request) x hourly rate x average
        replicas x 730 h. Negative for increases.
      required: [cpu, memory, total]
      properties:
        cpu:
          type: number
        memory:
          type: number
        total:
          type: number
    DataCoverage:
      type: object
      required: [ratio, window]
      properties:
        ratio:
          description: Fraction of the window for which usage samples exist.
          allOf:
            - $ref: '#/components/schemas/Decimal'
        window:
          type: string
          description: Recommendation window (Go duration).
          examples: [336h0m0s]
        covered:
          type: string
          description: Time span with data (Go duration). The agent compares it with `learningPeriod`.
          examples: [200h0m0s]
        firstSample:
          type: string
          format: date-time
        lastSample:
          type: string
          format: date-time
        samples:
          type: integer
          minimum: 0
    WorkloadRecommendation:
      type: object
      required: [id, workload, generatedAt, containers, confidence, riskFlags, monthlySavingsUSD, dataCoverage, settings]
      properties:
        id:
          type: string
          format: uuid
          description: Unique per recommendation; a new run produces a new id.
        workload:
          $ref: '#/components/schemas/WorkloadRef'
        generatedAt:
          type: string
          format: date-time
        strategyName:
          type: string
          description: Recommender strategy, e.g. `percentile`.
        settings:
          $ref: '#/components/schemas/ValueSettings'
        averageReplicas:
          type: number
          minimum: 0
        containers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContainerRecommendation'
        confidence:
          $ref: '#/components/schemas/Decimal'
        riskFlags:
          type: array
          description: Union of the containers' flags plus workload-level flags.
          items:
            $ref: '#/components/schemas/RiskFlag'
        monthlySavingsUSD:
          $ref: '#/components/schemas/Savings'
        dataCoverage:
          $ref: '#/components/schemas/DataCoverage'
        pricing:
          $ref: '#/components/schemas/RecommendationPricing'
        hpa:
          $ref: '#/components/schemas/HPACoordination'
    HPACoordination:
      type: object
      description: |
        HPA coordination (WO-11, lifts D-011). Present when the workload has a CPU- or
        memory-utilization HPA (risk flag `hpa-coupled`). The HPA's utilization is the pod's usage
        over the sum of its containers' requests of `metric`, so changing those requests changes
        when it scales. With `recommendedTarget`, the recommended requests of `metric` and that
        target keep `usage / (sum of requests x target)` unchanged: the agent may apply both in
        one change (rollout) and the HPA scales as before. The target stays within 40-90 %
        (or the current target if it is already outside); the requests were adjusted to keep it
        there. Without `recommendedTarget` (`skipReason` set) the requests of `metric` must not
        be changed by the agent.
      required: [name, metric, currentTarget]
      properties:
        name:
          type: string
          description: HPA name (same namespace as the workload).
        metric:
          $ref: '#/components/schemas/ResourceName'
        currentTarget:
          type: integer
          minimum: 1
          description: Current `averageUtilization` target, percent.
        recommendedTarget:
          type: integer
          minimum: 1
          description: '`averageUtilization` target to set together with the recommended requests, percent.'
        minReplicas:
          type: integer
          minimum: 0
        maxReplicas:
          type: integer
          minimum: 1
        skipReason:
          type: string
          enum: [max-replicas-reached, unsupported-metrics, missing-request, target-out-of-bounds]
          description: |
            Why the hub does not coordinate: the HPA was at `maxReplicas` in the window; it scales
            on more than one utilization metric or on any other metric (pods, object, external);
            a container has no request of `metric`; or keeping the target within bounds would
            lower a request that must not decrease (throttled / oom-killed).
    RecommendationPricing:
      type: object
      description: |
        Rates used for `monthlySavingsUSD` (D-016). `source` is `metrics` when they come from the
        pricing series (`kerf_*_hourly_cost_usd`, average over the cluster's nodes) and `default` when
        the cluster had no pricing series and the hub's configured fallback rate was used.
        Absent on recommendations computed before the field existed.
      required: [source, cpuCoreHourUSD, memoryGiBHourUSD]
      properties:
        source:
          type: string
          enum: [metrics, default]
        cpuCoreHourUSD:
          type: number
          minimum: 0
        memoryGiBHourUSD:
          type: number
          minimum: 0
    RecommendationList:
      type: object
      required: [cluster, items]
      properties:
        cluster:
          $ref: '#/components/schemas/ClusterName'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadRecommendation'
        continue:
          type: string
          description: Present when more pages exist.
    EffectiveModes:
      type: object
      required: [cpu, memory]
      properties:
        cpu:
          $ref: '#/components/schemas/Mode'
        memory:
          $ref: '#/components/schemas/Mode'
        cpuSource:
          $ref: '#/components/schemas/ModeSource'
        memorySource:
          $ref: '#/components/schemas/ModeSource'
    WorkloadStatus:
      type: object
      required: [workload, modes, phase]
      properties:
        workload:
          $ref: '#/components/schemas/WorkloadRef'
        policy:
          type: string
          description: Winning RightsizingPolicy name; empty when none matched.
        override:
          type: string
          description: |
            Name of the hub workload-override policy layered on top of `policy` (D-022), if any.
            Modes it sets are reported with source `policy`.
        modes:
          $ref: '#/components/schemas/EffectiveModes'
        strategy:
          $ref: '#/components/schemas/Strategy'
        settings:
          $ref: '#/components/schemas/ValueSettings'
        phase:
          $ref: '#/components/schemas/Phase'
        reason:
          type: string
          description: Reason for the phase (e.g. the Blocked reason), see `docs/contracts/events.md`.
        message:
          type: string
        recommendationID:
          type: string
          format: uuid
          description: Hub recommendation the phase refers to.
        live:
          type: array
          description: Resources currently set on the workload's containers.
          items:
            $ref: '#/components/schemas/ContainerResources'
        appliedAt:
          type: string
          format: date-time
        nextWindow:
          type: string
          format: date-time
          description: When the next maintenance window opens; set while the phase is `Deferred` (WO-10).
        observedAt:
          type: string
          format: date-time
        jvm:
          type: array
          description: |
            JVM containers detected by the agent with their heap settings (WO-12). Absent when JVM
            detection is off (`RightsizingPolicy.spec.jvm.detect: false`) or no container is a JVM.
          items:
            $ref: '#/components/schemas/JVMContainer'
    JVMContainer:
      type: object
      description: |
        Heap settings of one JVM container, parsed from `JAVA_TOOL_OPTIONS`, `JDK_JAVA_OPTIONS`,
        `JAVA_OPTS`, the container command/args and `_JAVA_OPTIONS` (later sources win, as in the
        JVM). A missing value means "not set" (JVM default).
      required: [name, detectedBy]
      properties:
        name:
          type: string
        detectedBy:
          type: array
          description: What identified the container as a JVM.
          items:
            type: string
            enum: [image, command, env]
        maxHeap:
          description: '`-Xmx` / `-XX:MaxHeapSize`.'
          allOf:
            - $ref: '#/components/schemas/Quantity'
        initialHeap:
          description: '`-Xms` / `-XX:InitialHeapSize`.'
          allOf:
            - $ref: '#/components/schemas/Quantity'
        maxRAMPercentage:
          type: number
          exclusiveMinimum: 0
          maximum: 100
          description: '`-XX:MaxRAMPercentage` (or 100 / `-XX:MaxRAMFraction`).'
        maxRAM:
          description: '`-XX:MaxRAM`.'
          allOf:
            - $ref: '#/components/schemas/Quantity'
        unresolved:
          type: array
          description: Option variables set from a ConfigMap/Secret reference, which the agent does not read.
          items:
            type: string
    WorkloadStatusBatch:
      type: object
      required: [items]
      properties:
        agentVersion:
          type: string
        configVersion:
          type: string
          description: |
            `configVersion` of the last cluster config the agent materialised (D-022). Absent for
            agents without config pull.
        policyInventory:
          type: array
          description: |
            Every RightsizingPolicy CR on the cluster (hub-managed and Git) and every hub policy the
            agent could not materialise. Sent with full batches; absent means "unchanged since the
            last report", an empty array means "none".
          items:
            $ref: '#/components/schemas/PolicyInventoryItem'
        capabilities:
          type: array
          description: |
            Agent self-check of its RBAC per capability (D-025). Absent = unchanged; present = all
            capabilities.
          items:
            $ref: '#/components/schemas/AgentCapability'
        checks:
          type: array
          description: |
            Agent self-check results (source `agent`, docs/contracts/readiness.md). Absent =
            unchanged; present = every agent check. Sent at start, every 10 minutes and after a
            recheck.
          items:
            $ref: '#/components/schemas/ReadinessCheck'
        components:
          type: array
          description: |
            Kerf components the agent found in its cluster (WO-33, today the webhook pods). Sent with
            the self-checks; absent = unchanged, an empty array = none running.
          items:
            $ref: '#/components/schemas/AgentComponent'
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/WorkloadStatus'
    ContainerChange:
      type: object
      required: [name]
      properties:
        name:
          type: string
        from:
          $ref: '#/components/schemas/Resources'
        to:
          $ref: '#/components/schemas/Resources'
    Event:
      type: object
      description: See `docs/contracts/events.md` for when each type is emitted.
      required: [id, type, time, workload, reason]
      properties:
        id:
          type: string
          format: uuid
          description: Generated by the agent; idempotency key.
        type:
          $ref: '#/components/schemas/EventType'
        time:
          type: string
          format: date-time
        workload:
          $ref: '#/components/schemas/WorkloadRef'
        recommendationID:
          type: string
          format: uuid
        strategy:
          $ref: '#/components/schemas/Strategy'
        resources:
          type: array
          description: Resources the event is about.
          items:
            $ref: '#/components/schemas/ResourceName'
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerChange'
        reason:
          type: string
          pattern: '^[A-Z][A-Za-z0-9]*$'
          description: CamelCase reason, see `docs/contracts/events.md`.
        message:
          type: string
          maxLength: 1024
        details:
          type: object
          description: Free-form string attributes (e.g. `oomKills`, `throttlingRatio`).
          additionalProperties:
            type: string
    EventBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Event'
    BatchResult:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
          description: Events already stored (same id); not an error.
    AuditEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          required: [cluster, receivedAt]
          properties:
            cluster:
              $ref: '#/components/schemas/ClusterName'
            receivedAt:
              type: string
              format: date-time
            workloadId:
              $ref: '#/components/schemas/WorkloadID'
    AuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        continue:
          type: string
          description: Present when more pages exist.
    WorkloadID:
      type: string
      description: '`<cluster>/<namespace>/<kind>/<name>`'
      pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?/[^/]+/(Deployment|StatefulSet|DaemonSet|CronJob)/[^/]+$'
      examples: [ro-spoke-1/payments/Deployment/checkout]
    UsageStats:
      type: object
      description: Statistics of per-pod usage over the window.
      properties:
        p50:
          $ref: '#/components/schemas/Quantity'
        p95:
          $ref: '#/components/schemas/Quantity'
        p99:
          $ref: '#/components/schemas/Quantity'
        max:
          $ref: '#/components/schemas/Quantity'
    ResourceExplanation:
      type: object
      required: [statistic, observed]
      properties:
        statistic:
          type: string
          description: Statistic the request is based on, e.g. `p95` (CPU) or `max(p99,peak)` (memory).
        observed:
          $ref: '#/components/schemas/UsageStats'
        base:
          $ref: '#/components/schemas/Quantity'
        margin:
          type: number
          minimum: 0
          description: Added fraction; CPU headroom or memory buffer (0.15 = +15 %).
        roundedTo:
          $ref: '#/components/schemas/Quantity'
        limitRule:
          type: string
          description: How the limit was derived, e.g. `keep`, `remove`, `ratio 2`, `equals request`.
        notes:
          type: array
          description: 'Adjustments, e.g. "raised: throttled" or "kept current: oom-killed".'
          items:
            type: string
        jvm:
          $ref: '#/components/schemas/JVMExplanation'
    JVMExplanation:
      type: object
      description: |
        How the JVM heap shaped the memory recommendation (WO-12), only on `memory` of JVM
        containers. `heapSizing`: `fixed` (`-Xmx`; memory audit-only, flag `jvm-fixed-heap`),
        `percentage` (`-XX:MaxRAMPercentage`, max heap follows the memory limit), `default` (no heap
        flags: the JVM default of 25 % of the limit). `heapNeed` is the observed peak working set
        capped at the current maximum heap; `floor` is the smallest memory that keeps the maximum
        heap at or above `heapNeed` (percentage, default) or fits heap plus `nonHeap` (fixed).
      required: [heapSizing, detectedBy]
      properties:
        heapSizing:
          type: string
          enum: [fixed, percentage, default]
        detectedBy:
          type: array
          items:
            type: string
            enum: [image, command, env]
        source:
          type: string
          enum: [agent, image]
          description: '`agent`: heap settings reported by the agent; `image`: only the image name was known (no agent report), JVM defaults assumed.'
        maxRAMPercentage:
          type: number
        maxHeapBefore:
          $ref: '#/components/schemas/Quantity'
        maxHeapAfter:
          $ref: '#/components/schemas/Quantity'
        heapNeed:
          $ref: '#/components/schemas/Quantity'
        nonHeap:
          $ref: '#/components/schemas/Quantity'
        floor:
          $ref: '#/components/schemas/Quantity'
    ContainerExplanation:
      type: object
      description: Why the values were recommended. Only returned by `GET /v1/workloads/{id}`.
      required: [profile, strategyName, window]
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        strategyName:
          type: string
        window:
          type: string
          description: Go duration.
        cpu:
          $ref: '#/components/schemas/ResourceExplanation'
        memory:
          $ref: '#/components/schemas/ResourceExplanation'
        confidenceFactors:
          $ref: '#/components/schemas/ConfidenceFactors'
    ConfidenceFactor:
      type: object
      required: [score, weight]
      properties:
        score:
          description: Factor score, 0 (worst) to 1 (best).
          allOf:
            - $ref: '#/components/schemas/Decimal'
        weight:
          description: Weight of the factor; the weights sum to 1.
          allOf:
            - $ref: '#/components/schemas/Decimal'
    ConfidenceFactors:
      type: object
      description: |
        How this container's confidence was computed (D-016): `confidence` = sum of score x weight.
        The workload's `confidence` is the minimum over its containers.
        `coverage`: fraction of the window's steps with usage data. `samples`: number of samples
        relative to the hub's full-confidence sample count. `variance`: stability of CPU usage,
        1 / (1 + coefficient of variation); 1 means no variance.
        Absent on recommendations computed before the field existed.
      required: [coverage, samples, variance, confidence]
      properties:
        coverage:
          $ref: '#/components/schemas/ConfidenceFactor'
        samples:
          $ref: '#/components/schemas/ConfidenceFactor'
        variance:
          $ref: '#/components/schemas/ConfidenceFactor'
        confidence:
          $ref: '#/components/schemas/Decimal'
    ModeCounts:
      type: object
      required: ['off', audit, auto-patch]
      properties:
        'off':
          type: integer
          minimum: 0
        audit:
          type: integer
          minimum: 0
        auto-patch:
          type: integer
          minimum: 0
    ResourceTotals:
      type: object
      description: |
        Sums over workloads (per-pod value x average replicas). `used` is the average usage over
        the last 24 h. Cores for CPU, bytes for memory.
      required: [requested, used, recommended]
      properties:
        requested:
          type: number
        used:
          type: number
        recommended:
          type: number
    Summary:
      type: object
      required: [workloads, workloadsByMode, workloadsByRiskFlag, cpu, memory, monthlySavingsUSD]
      properties:
        workloads:
          type: integer
          minimum: 0
        workloadsByMode:
          type: object
          required: [cpu, memory]
          properties:
            cpu:
              $ref: '#/components/schemas/ModeCounts'
            memory:
              $ref: '#/components/schemas/ModeCounts'
        workloadsByRiskFlag:
          type: object
          description: Number of workloads per risk flag; flags with zero workloads may be omitted.
          propertyNames:
            $ref: '#/components/schemas/RiskFlag'
          additionalProperties:
            type: integer
            minimum: 0
        workloadsByPhase:
          type: object
          propertyNames:
            $ref: '#/components/schemas/Phase'
          additionalProperties:
            type: integer
            minimum: 0
        cpu:
          $ref: '#/components/schemas/ResourceTotals'
        memory:
          $ref: '#/components/schemas/ResourceTotals'
        monthlySavingsUSD:
          $ref: '#/components/schemas/Savings'
        lastRecommenderRunAt:
          type: string
          format: date-time
          description: End of the last recommender run that covered these workloads.
    ClusterSummary:
      allOf:
        - $ref: '#/components/schemas/Summary'
        - type: object
          required: [cluster]
          properties:
            cluster:
              $ref: '#/components/schemas/ClusterName'
    FleetSummary:
      type: object
      required: [generatedAt, fleet, clusters]
      properties:
        generatedAt:
          type: string
          format: date-time
        fleet:
          $ref: '#/components/schemas/Summary'
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterSummary'
    ClusterInfo:
      type: object
      required: [name, agentStatus, counts]
      properties:
        name:
          $ref: '#/components/schemas/ClusterName'
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time
          description: Last authenticated agent request.
        agentVersion:
          type: string
        agentStatus:
          type: string
          description: '`stale` when the last heartbeat is older than the hub''s configured threshold.'
          enum: [connected, stale, never]
        environment:
          $ref: '#/components/schemas/Environment'
        owner:
          type: string
        policySource:
          $ref: '#/components/schemas/ClusterPolicySource'
        paused:
          type: boolean
          description: Automation paused (cluster or fleet, D-022).
        automation:
          description: The cluster's own pause state.
          allOf:
            - $ref: '#/components/schemas/Automation'
        configSync:
          $ref: '#/components/schemas/AgentConfigSync'
        readiness:
          $ref: '#/components/schemas/ReadinessSummary'
        counts:
          type: object
          required: [workloads, withRecommendation, autoPatch, blocked]
          properties:
            workloads:
              type: integer
              minimum: 0
            withRecommendation:
              type: integer
              minimum: 0
            autoPatch:
              type: integer
              minimum: 0
              description: Workloads with CPU or memory in `auto-patch`.
            blocked:
              type: integer
              minimum: 0
    ClusterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClusterInfo'
    WorkloadRow:
      type: object
      description: Recommendation fields are absent when the workload has no recommendation yet.
      required: [id, cluster, namespace, kind, name, modes, phase]
      properties:
        id:
          $ref: '#/components/schemas/WorkloadID'
        cluster:
          $ref: '#/components/schemas/ClusterName'
        namespace:
          type: string
        kind:
          $ref: '#/components/schemas/WorkloadKind'
        name:
          type: string
        modes:
          $ref: '#/components/schemas/EffectiveModes'
        phase:
          $ref: '#/components/schemas/Phase'
        recommendationID:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerRecommendation'
        confidence:
          $ref: '#/components/schemas/Decimal'
        riskFlags:
          type: array
          items:
            $ref: '#/components/schemas/RiskFlag'
        monthlySavingsUSD:
          $ref: '#/components/schemas/Savings'
    WorkloadList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadRow'
        total:
          type: integer
          minimum: 0
          description: Number of workloads matching the filters (all pages).
        continue:
          type: string
          description: Present when more pages exist.
    FacetCount:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
          minimum: 1
    WorkloadFacets:
      type: object
      required: [total, clusters, namespaces, kinds, modes, riskFlags]
      properties:
        total:
          type: integer
          minimum: 0
          description: Workloads matching all filters (equals `WorkloadList.total`).
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/FacetCount'
        namespaces:
          type: array
          description: Namespace names across clusters (the `namespace` filter matches names in any cluster).
          items:
            $ref: '#/components/schemas/FacetCount'
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/FacetCount'
        modes:
          type: array
          items:
            $ref: '#/components/schemas/FacetCount'
        riskFlags:
          type: array
          items:
            $ref: '#/components/schemas/FacetCount'
    WorkloadDetail:
      type: object
      required: [id, cluster, namespace, kind, name, modes, phase]
      properties:
        id:
          $ref: '#/components/schemas/WorkloadID'
        cluster:
          $ref: '#/components/schemas/ClusterName'
        namespace:
          type: string
        kind:
          $ref: '#/components/schemas/WorkloadKind'
        name:
          type: string
        modes:
          $ref: '#/components/schemas/EffectiveModes'
        phase:
          $ref: '#/components/schemas/Phase'
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        recommendation:
          description: Latest recommendation; containers include `explanation`. Absent if none yet.
          allOf:
            - $ref: '#/components/schemas/WorkloadRecommendation'
        status:
          description: Latest status reported by the agent. Absent if never reported.
          allOf:
            - $ref: '#/components/schemas/WorkloadStatus'
        approval:
          description: The latest approve-once grant (D-024), if any.
          allOf:
            - $ref: '#/components/schemas/Approval'
        override:
          description: The workload's hub override policy (D-022), if any.
          allOf:
            - $ref: '#/components/schemas/AdminPolicy'
    Point:
      type: array
      description: '[unix seconds, value]'
      prefixItems:
        - type: number
        - type: number
      minItems: 2
      maxItems: 2
    ContainerSeries:
      type: object
      required: [name, usage, request, limit, recommendation]
      properties:
        name:
          type: string
        usage:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        usageAvg:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        request:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        limit:
          type: array
          description: Empty when no limit is set.
          items:
            $ref: '#/components/schemas/Point'
        recommendation:
          type: array
          description: Recommended request.
          items:
            $ref: '#/components/schemas/Point'
    UsageSeries:
      type: object
      required: [workloadId, resource, unit, from, to, step, containers]
      properties:
        workloadId:
          $ref: '#/components/schemas/WorkloadID'
        resource:
          $ref: '#/components/schemas/ResourceName'
        unit:
          type: string
          enum: [cores, bytes]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        step:
          type: string
        containers:
          type: array
          items:
            $ref: '#/components/schemas/ContainerSeries'
    WorkloadHistory:
      type: object
      required: [workloadId, recommendations, events]
      properties:
        workloadId:
          $ref: '#/components/schemas/WorkloadID'
        recommendations:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/WorkloadRecommendation'
        events:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/AuditEvent'
        configChanges:
          type: array
          description: Configuration changes targeting this workload (override, approval), newest first.
          items:
            $ref: '#/components/schemas/ConfigChange'
    SavingsPoint:
      type: object
      required: [time, cpu, memory, total]
      properties:
        time:
          type: string
          format: date-time
        cpu:
          type: number
        memory:
          type: number
        total:
          type: number
    SavingsTrend:
      type: object
      required: [from, to, step, series]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        step:
          type: string
        series:
          type: array
          items:
            type: object
            required: [points]
            properties:
              cluster:
                description: Absent for the fleet series (`groupBy=none`).
                allOf:
                  - $ref: '#/components/schemas/ClusterName'
              points:
                type: array
                items:
                  $ref: '#/components/schemas/SavingsPoint'
    RecomputeAccepted:
      type: object
      required: [runId, requestedAt, coalesced]
      properties:
        runId:
          type: string
          format: uuid
          description: Id of the queued run (UUIDv7).
        cluster:
          $ref: '#/components/schemas/ClusterName'
          description: The requested cluster; absent for a run over all clusters.
        requestedAt:
          type: string
          format: date-time
          description: When the run was first requested (for a coalesced request, the earlier one).
        coalesced:
          type: boolean
          description: True when an already queued run for the same scope was returned.
    UserRole:
      type: string
      description: |
        Role of a local user (D-023). `viewer`: everything the read-only UI shows. `operator`:
        additionally workload actions (override, exclude, approve-once) and pausing automation.
        `admin`: additionally defaults, policies, settings, clusters, tokens and users. Each role
        includes the ones before it.
      enum: [viewer, operator, admin]
    TokenRole:
      type: string
      description: |
        Role of an API (machine) token (D-012). `pricing` (D-026) is the pricing service: only
        `/v1/internal/*` (metrics bindings and the datasource query proxy); no cluster.
      enum: [agent, ui, admin, pricing]
    Username:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{1,62}$'
      examples: [alice]
    Password:
      type: string
      description: At least 8 characters; at most 72 bytes (bcrypt).
      minLength: 8
      maxLength: 72
    ReasonText:
      type: string
      description: Why the change is made; stored in the audit log.
      minLength: 1
      maxLength: 1024
    Duration:
      type: string
      description: Go duration.
      pattern: '^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$'
      examples: [10m, 168h]
    Actor:
      type: object
      description: |
        Who made a change. `user`: a local user (`name` = username). `token`: an API token
        (`name` = `token:<id>`). `system`: the hub itself (e.g. an auto-resume at `resumeAt`).
      required: [type, name]
      properties:
        type:
          type: string
          enum: [user, token, system]
        name:
          type: string
        role:
          type: string
          description: The user role or token role at the time of the change.
    ChangeReason:
      type: object
      required: [reason]
      properties:
        reason:
          $ref: '#/components/schemas/ReasonText'
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 63
        password:
          type: string
          maxLength: 72
    Me:
      type: object
      required: [authMethod, role]
      properties:
        authMethod:
          type: string
          enum: [session, token]
        role:
          $ref: '#/components/schemas/UserRole'
        user:
          description: The logged-in user; only with `authMethod = session`.
          allOf:
            - $ref: '#/components/schemas/User'
        tokenId:
          type: string
          description: Only with `authMethod = token`.
        csrfToken:
          type: string
          description: Send as `X-CSRF-Token` on writes; only with `authMethod = session`.
        sessionExpiresAt:
          type: string
          format: date-time
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 72
        newPassword:
          $ref: '#/components/schemas/Password'
    User:
      type: object
      required: [username, displayName, role, disabled, mustChangePassword, createdAt, version]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          type: string
          maxLength: 128
        role:
          $ref: '#/components/schemas/UserRole'
        disabled:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Actor name; absent for the bootstrap admin.
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        lockedUntil:
          type: string
          format: date-time
          description: Present while login is locked after failed attempts.
        deletedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
    UserCreate:
      type: object
      required: [username, role, password, reason]
      properties:
        username:
          $ref: '#/components/schemas/Username'
        displayName:
          type: string
          maxLength: 128
        role:
          $ref: '#/components/schemas/UserRole'
        password:
          $ref: '#/components/schemas/Password'
        mustChangePassword:
          type: boolean
          default: true
        reason:
          $ref: '#/components/schemas/ReasonText'
    UserUpdate:
      type: object
      required: [reason]
      properties:
        displayName:
          type: string
          maxLength: 128
        role:
          $ref: '#/components/schemas/UserRole'
        disabled:
          type: boolean
        reason:
          $ref: '#/components/schemas/ReasonText'
    PasswordReset:
      type: object
      required: [reason]
      properties:
        password:
          $ref: '#/components/schemas/Password'
        reason:
          $ref: '#/components/schemas/ReasonText'
    PasswordResetResult:
      type: object
      required: [mustChangePassword]
      properties:
        temporaryPassword:
          type: string
          description: The generated password, shown once; absent when `password` was given.
        mustChangePassword:
          type: boolean
    TokenInfo:
      type: object
      required: [id, role, description, createdAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
        role:
          $ref: '#/components/schemas/TokenRole'
        cluster:
          $ref: '#/components/schemas/ClusterName'
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Actor name; absent for tokens seeded from configuration.
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Updated at most once a minute.
        revokedAt:
          type: string
          format: date-time
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TokenInfo'
    TokenCreate:
      type: object
      required: [role, description, reason]
      properties:
        role:
          $ref: '#/components/schemas/TokenRole'
        cluster:
          $ref: '#/components/schemas/ClusterName'
        description:
          type: string
          maxLength: 256
        expiresAt:
          type: string
          format: date-time
          description: Absent means the token does not expire.
        reason:
          $ref: '#/components/schemas/ReasonText'
    TokenCreated:
      type: object
      required: [token, value]
      properties:
        token:
          $ref: '#/components/schemas/TokenInfo'
        value:
          type: string
          description: The token value. Shown once; the hub cannot return it again.
    SettingsSection:
      type: string
      enum: [recommender, pricing]
    RecommenderProfileSettings:
      type: object
      description: One recommender profile (WO-04). Fractions are 0.15 for +15 %.
      required: [name, window, cpuPercentile, memoryPercentile, cpuHeadroom, memoryBuffer]
      properties:
        name:
          $ref: '#/components/schemas/Profile'
        window:
          $ref: '#/components/schemas/Duration'
        cpuPercentile:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        memoryPercentile:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        memoryPeakWindow:
          description: Window of the memory peak; absent or 0 means the whole window.
          allOf:
            - $ref: '#/components/schemas/Duration'
        cpuHeadroom:
          type: number
          minimum: 0
          maximum: 10
        memoryBuffer:
          type: number
          minimum: 0
          maximum: 10
    RecommenderSettings:
      type: object
      required: [interval, retention, profiles]
      properties:
        interval:
          description: Time between scheduled recommender runs.
          allOf:
            - $ref: '#/components/schemas/Duration'
        retention:
          description: Recommendation history retention (the latest per workload is always kept).
          allOf:
            - $ref: '#/components/schemas/Duration'
        profiles:
          type: array
          description: Exactly one entry per built-in profile (`dev`, `production`, `high-availability`).
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/RecommenderProfileSettings'
    RecommenderSettingsDoc:
      type: object
      required: [version, value]
      properties:
        version:
          type: integer
          minimum: 0
          description: 0 = never saved (values from the hub configuration file).
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/Actor'
        reason:
          type: string
        value:
          $ref: '#/components/schemas/RecommenderSettings'
    RecommenderSettingsUpdate:
      type: object
      required: [value, reason]
      properties:
        value:
          $ref: '#/components/schemas/RecommenderSettings'
        reason:
          $ref: '#/components/schemas/ReasonText'
    ClusterPricingAdjustment:
      type: object
      description: |
        Adjusts the rates of one cluster. A fixed rate replaces the rate from the pricing metrics
        (or the default rate); the discount then applies to whichever rate is used.
      required: [cluster]
      properties:
        cluster:
          $ref: '#/components/schemas/ClusterName'
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Savings Plans / EDP discount, percent off the rate.
        cpuCoreHourUSD:
          type: number
          minimum: 0
        memoryGiBHourUSD:
          type: number
          minimum: 0
    PricingSettings:
      type: object
      required: [clusters]
      properties:
        defaultDiscountPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Discount for clusters without their own entry.
        clusters:
          type: array
          description: At most one entry per cluster.
          items:
            $ref: '#/components/schemas/ClusterPricingAdjustment'
    PricingSettingsDoc:
      type: object
      required: [version, value]
      properties:
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/Actor'
        reason:
          type: string
        value:
          $ref: '#/components/schemas/PricingSettings'
    PricingSettingsUpdate:
      type: object
      required: [value, reason]
      properties:
        value:
          $ref: '#/components/schemas/PricingSettings'
        reason:
          $ref: '#/components/schemas/ReasonText'
    Settings:
      type: object
      required: [recommender, pricing]
      properties:
        recommender:
          $ref: '#/components/schemas/RecommenderSettingsDoc'
        pricing:
          $ref: '#/components/schemas/PricingSettingsDoc'
    SettingsVersion:
      type: object
      required: [section, version, value, createdAt, actor, reason]
      properties:
        section:
          $ref: '#/components/schemas/SettingsSection'
        version:
          type: integer
          minimum: 1
        value:
          type: object
          description: '`RecommenderSettings` or `PricingSettings`, by `section`.'
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        reason:
          type: string
    SettingsVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettingsVersion'
        continue:
          type: string
    HubPolicyType:
      type: string
      description: |
        `global-default` (`ro-global-defaults`, priority 0, every cluster), `cluster-default`
        (`ro-cluster-defaults`, priority 10, one cluster), `policy` (named, priority 1-899999),
        `workload-override` (`ro-override-…`, priority 900000, one workload). The agent layers the
        default types under the winning policy and the override above it (D-022).
      enum: [global-default, cluster-default, policy, workload-override]
    ClusterPolicySource:
      type: string
      description: |
        Where a cluster's policies come from (D-022). `hub`: hub-managed policies only (Git CRs are
        still reported). `git`: no hub-managed policies are sent and the admin pages are read-only
        for that cluster. `both`: both.
      enum: [hub, git, both]
    PolicyOrigin:
      type: string
      description: '`hub`: a CR labelled `managed-by=hub`; `git`: any other CR.'
      enum: [hub, git]
    Environment:
      type: string
      description: Writes to a `prod` cluster ask for confirmation in the UI and some need an admin.
      enum: [prod, non-prod]
    NamespacedWorkloadRef:
      type: object
      required: [kind, namespace, name]
      properties:
        kind:
          $ref: '#/components/schemas/WorkloadKind'
        namespace:
          type: string
          minLength: 1
          maxLength: 63
        name:
          type: string
          minLength: 1
          maxLength: 253
    PolicySelector:
      type: object
      description: Mirrors `RightsizingPolicy.spec.selector` (api/v1alpha1). All set criteria must match.
      properties:
        namespaces:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 253
        excludeNamespaces:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 253
        matchLabels:
          type: object
          additionalProperties:
            type: string
        kinds:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/WorkloadKind'
        workloads:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NamespacedWorkloadRef'
    CPUPolicy:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        limits:
          type: string
          enum: [keep, remove, ratio]
        limitRatio:
          type: string
          pattern: '^([1-9][0-9]*)(\.[0-9]{1,3})?$'
          description: Required iff `limits = ratio`.
    MemoryPolicy:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/Mode'
        limitEqualsRequest:
          type: boolean
    TimeWindow:
      type: object
      description: Either `schedule` + `duration` (recurring) or `start` + `end` (one-off).
      properties:
        schedule:
          type: string
          maxLength: 128
          description: 5-field cron expression.
        duration:
          $ref: '#/components/schemas/Duration'
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        timeZone:
          type: string
          maxLength: 64
          description: IANA name; default UTC.
    ApplyPolicy:
      type: object
      properties:
        strategy:
          $ref: '#/components/schemas/Strategy'
        fallbackAfter:
          $ref: '#/components/schemas/Duration'
        maintenanceWindows:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/TimeWindow'
        freezeWindows:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/TimeWindow'
    RollbackPolicy:
      type: object
      properties:
        watchDuration:
          $ref: '#/components/schemas/Duration'
        oomKills:
          type: integer
          minimum: 1
        restarts:
          type: integer
          minimum: 1
        throttlingRatio:
          type: string
          pattern: '^(0(\.[0-9]{1,3})?|1(\.0{1,3})?)$'
    Guardrails:
      type: object
      properties:
        learningPeriod:
          $ref: '#/components/schemas/Duration'
        minConfidence:
          type: string
          pattern: '^(0(\.[0-9]{1,3})?|1(\.0{1,3})?)$'
        maxChangePercent:
          type: integer
          minimum: 1
          maximum: 100
        minCPU:
          $ref: '#/components/schemas/Quantity'
        minMemory:
          $ref: '#/components/schemas/Quantity'
        cooldown:
          $ref: '#/components/schemas/Duration'
        rollback:
          $ref: '#/components/schemas/RollbackPolicy'
    HPATargetBounds:
      type: object
      properties:
        minUtilization:
          type: integer
          minimum: 1
          maximum: 100
        maxUtilization:
          type: integer
          minimum: 1
          maximum: 100
    HPAPolicy:
      type: object
      properties:
        coordinate:
          type: boolean
        targetBounds:
          $ref: '#/components/schemas/HPATargetBounds'
    JVMPolicy:
      type: object
      properties:
        detect:
          type: boolean
    RightsizingPolicySpec:
      type: object
      description: |
        Mirrors `RightsizingPolicy.spec` (api/v1alpha1, `kubectl explain rsp.spec`). Unset fields
        inherit from the next lower layer. Validated by the shared validator
        (`api/v1alpha1/validate`) exactly like the CRD.
      properties:
        selector:
          $ref: '#/components/schemas/PolicySelector'
        priority:
          type: integer
          minimum: 0
          maximum: 1000000
        profile:
          $ref: '#/components/schemas/Profile'
        cpu:
          $ref: '#/components/schemas/CPUPolicy'
        memory:
          $ref: '#/components/schemas/MemoryPolicy'
        apply:
          $ref: '#/components/schemas/ApplyPolicy'
        guardrails:
          $ref: '#/components/schemas/Guardrails'
        hpa:
          $ref: '#/components/schemas/HPAPolicy'
        jvm:
          $ref: '#/components/schemas/JVMPolicy'
    PolicyInput:
      type: object
      description: |
        Body of create and update. For the default types `name` and `spec.priority` are set by the
        hub (and ignored if sent); for `policy` both are required. `clusters` empty means every
        cluster; `cluster-default` needs exactly one.
      required: [type, spec, reason]
      properties:
        type:
          $ref: '#/components/schemas/HubPolicyType'
        name:
          type: string
          maxLength: 253
          pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
        description:
          type: string
          maxLength: 1024
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterName'
        spec:
          $ref: '#/components/schemas/RightsizingPolicySpec'
        overrideReadiness:
          type: boolean
          description: |
            Admin only: allow `auto-patch` on clusters that are not `AutomationReady` (D-025);
            audited with the change.
        reason:
          $ref: '#/components/schemas/ReasonText'
    PolicyDraft:
      type: object
      description: A policy as in `PolicyInput`, without reason, for `POST /v1/admin/preview`.
      required: [type, spec]
      properties:
        type:
          $ref: '#/components/schemas/HubPolicyType'
        name:
          type: string
          maxLength: 253
        description:
          type: string
          maxLength: 1024
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterName'
        workloadId:
          description: Required for `workload-override`.
          allOf:
            - $ref: '#/components/schemas/WorkloadID'
        spec:
          $ref: '#/components/schemas/RightsizingPolicySpec'
    AdminPolicy:
      type: object
      required: [id, type, name, priority, clusters, spec, version, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/HubPolicyType'
        name:
          type: string
          description: Name of the RightsizingPolicy CR on the clusters.
        description:
          type: string
        priority:
          type: integer
          description: Equal to `spec.priority`.
        clusters:
          type: array
          description: Clusters the policy is sent to; empty means every cluster.
          items:
            $ref: '#/components/schemas/ClusterName'
        workloadId:
          description: Only for `workload-override`.
          allOf:
            - $ref: '#/components/schemas/WorkloadID'
        spec:
          $ref: '#/components/schemas/RightsizingPolicySpec'
        version:
          type: integer
          minimum: 1
          description: Increases with every change; the ETag is `"<version>"`.
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/Actor'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/Actor'
        deletedAt:
          type: string
          format: date-time
    AdminPolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminPolicy'
    PolicyVersion:
      type: object
      required: [version, operation, name, priority, clusters, spec, deleted, createdAt, actor, reason]
      properties:
        version:
          type: integer
          minimum: 1
        operation:
          type: string
          enum: [create, update, delete, revert]
        revertedFrom:
          type: integer
          description: Source version of a `revert`.
        name:
          type: string
        description:
          type: string
        priority:
          type: integer
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/ClusterName'
        spec:
          $ref: '#/components/schemas/RightsizingPolicySpec'
        deleted:
          type: boolean
          description: True if the policy was deleted in this version.
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        reason:
          type: string
    PolicyVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicyVersion'
        continue:
          type: string
    PolicyRevert:
      type: object
      required: [version, reason]
      properties:
        version:
          type: integer
          minimum: 1
        reason:
          $ref: '#/components/schemas/ReasonText'
        overrideReadiness:
          type: boolean
          description: |
            Admin only (D-025): allow a revert that enables `auto-patch` on clusters that are not
            `AutomationReady`. Without it such a revert answers `409 cluster_not_automation_ready`.
    PolicyInventoryItem:
      type: object
      description: |
        One RightsizingPolicy CR on a cluster, as the agent sees it. `valid` is the result of the
        shared validator; an invalid hub-managed policy is not materialised (its old CR, if any,
        stays) and `message` says why; for a Git CR it is informational only.
      required: [name, source, priority, generation, valid]
      properties:
        name:
          type: string
        source:
          $ref: '#/components/schemas/PolicyOrigin'
        priority:
          type: integer
        generation:
          type: integer
          minimum: 0
          description: '`metadata.generation`; 0 for a hub policy the agent could not materialise.'
        valid:
          type: boolean
        message:
          type: string
          maxLength: 1024
        hubPolicyId:
          type: string
          format: uuid
        hubVersion:
          type: integer
        hubPolicyType:
          $ref: '#/components/schemas/HubPolicyType'
        matchedWorkloads:
          type: integer
          minimum: 0
          description: Workloads for which this policy is the winning policy (or applied override).
        spec:
          $ref: '#/components/schemas/RightsizingPolicySpec'
    ClusterPolicyInventory:
      type: object
      required: [cluster, items]
      properties:
        cluster:
          $ref: '#/components/schemas/ClusterName'
        reportedAt:
          type: string
          format: date-time
        configVersion:
          type: string
          description: Config version the agent had applied when it reported.
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicyInventoryItem'
    PolicyInventoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClusterPolicyInventory'
    PolicyChange:
      type: object
      description: |
        A hypothetical change for the preview. `upsert` with `policyId` replaces that policy; without
        it, adds a new one (a `workload-override` for a workload that already has one replaces it).
        `delete` needs `policyId`.
      required: [op]
      properties:
        op:
          type: string
          enum: [upsert, delete]
        policyId:
          type: string
          format: uuid
        policy:
          $ref: '#/components/schemas/PolicyDraft'
    PreviewRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/PolicyChange'
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 200
          description: Maximum number of `items`; the totals always cover every workload.
    ImpactItem:
      type: object
      required: [workloadId, cluster, namespace, kind, name, before, after]
      properties:
        workloadId:
          $ref: '#/components/schemas/WorkloadID'
        cluster:
          $ref: '#/components/schemas/ClusterName'
        namespace:
          type: string
        kind:
          $ref: '#/components/schemas/WorkloadKind'
        name:
          type: string
        before:
          $ref: '#/components/schemas/EffectiveModes'
        after:
          $ref: '#/components/schemas/EffectiveModes'
        policyBefore:
          type: string
          description: Winning policy name before the change.
        policyAfter:
          type: string
        monthlySavingsUSD:
          $ref: '#/components/schemas/Savings'
    ImpactPreview:
      type: object
      required: [workloadsEvaluated, workloadsChanged, savingsIntoAutoPatchUSD, savingsOutOfAutoPatchUSD, items, truncated]
      properties:
        workloadsEvaluated:
          type: integer
          minimum: 0
        workloadsChanged:
          type: integer
          minimum: 0
          description: Workloads whose CPU or memory mode changes.
        savingsIntoAutoPatchUSD:
          description: |
            Estimated monthly savings of the resources whose mode becomes `auto-patch` (CPU savings
            of workloads whose CPU mode becomes auto-patch, likewise memory).
          allOf:
            - $ref: '#/components/schemas/Savings'
        savingsOutOfAutoPatchUSD:
          description: Likewise for resources that leave `auto-patch`.
          allOf:
            - $ref: '#/components/schemas/Savings'
        items:
          type: array
          description: Changed workloads, by savings descending, at most `limit`.
          items:
            $ref: '#/components/schemas/ImpactItem'
        truncated:
          type: boolean
        warnings:
          type: array
          description: E.g. validation problems of a draft, or clusters whose labels are unknown.
          items:
            type: string
    Automation:
      type: object
      description: Pause state of one cluster (or of the fleet).
      required: [paused, version]
      properties:
        paused:
          type: boolean
        reason:
          type: string
        by:
          $ref: '#/components/schemas/Actor'
        since:
          type: string
          format: date-time
          description: When the current state was set.
        resumeAt:
          type: string
          format: date-time
          description: Only while paused; the hub resumes at this time.
        version:
          type: integer
          minimum: 0
          description: 0 = never changed. The ETag is `"<version>"`.
    AutomationUpdate:
      type: object
      required: [paused, reason]
      properties:
        paused:
          type: boolean
        reason:
          $ref: '#/components/schemas/ReasonText'
        resumeAt:
          type: string
          format: date-time
          description: Only with `paused = true`; must be in the future.
    FleetAutomation:
      type: object
      required: [fleet, clusters]
      properties:
        fleet:
          $ref: '#/components/schemas/Automation'
        clusters:
          type: array
          items:
            type: object
            required: [cluster, automation, paused]
            properties:
              cluster:
                $ref: '#/components/schemas/ClusterName'
              automation:
                $ref: '#/components/schemas/Automation'
              paused:
                type: boolean
                description: Effective state (cluster or fleet paused).
    AgentConfigSync:
      type: object
      required: [configVersion, inSync]
      properties:
        agentVersion:
          type: string
        lastHeartbeatAt:
          type: string
          format: date-time
        lastConfigPullAt:
          type: string
          format: date-time
        configVersion:
          type: string
          description: Current config version the hub serves this cluster.
        appliedConfigVersion:
          type: string
          description: Config version the agent last reported as applied.
        inSync:
          type: boolean
          description: '`appliedConfigVersion = configVersion`.'
    ClusterAdmin:
      type: object
      required: [name, description, owner, policySource, version, automation, paused, agent, metrics, readiness]
      properties:
        name:
          $ref: '#/components/schemas/ClusterName'
        description:
          type: string
        environment:
          $ref: '#/components/schemas/Environment'
        owner:
          type: string
          description: Owning team.
        policySource:
          $ref: '#/components/schemas/ClusterPolicySource'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/Actor'
        deletedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Version of the metadata; the ETag is `"<version>"`.
        automation:
          $ref: '#/components/schemas/Automation'
        paused:
          type: boolean
          description: Effective pause (cluster or fleet).
        agent:
          $ref: '#/components/schemas/AgentConfigSync'
        policyInventory:
          $ref: '#/components/schemas/ClusterPolicyInventory'
        provider:
          type: string
          maxLength: 64
          description: Informational, e.g. `aws`.
        region:
          type: string
          maxLength: 64
          description: Informational.
        metrics:
          $ref: '#/components/schemas/MetricsBinding'
        readiness:
          $ref: '#/components/schemas/ReadinessSummary'
    ClusterCreate:
      type: object
      required: [name, environment, reason]
      properties:
        name:
          $ref: '#/components/schemas/ClusterName'
        description:
          type: string
          maxLength: 1024
        environment:
          $ref: '#/components/schemas/Environment'
        owner:
          type: string
          maxLength: 128
        policySource:
          allOf:
            - $ref: '#/components/schemas/ClusterPolicySource'
          default: both
        provider:
          type: string
          maxLength: 64
          description: Informational, e.g. `aws`.
        region:
          type: string
          maxLength: 64
          description: Informational.
        metrics:
          description: 'Default: datasource `local`, label `cluster`, value = the cluster name.'
          allOf:
            - $ref: '#/components/schemas/MetricsBinding'
        createAgentToken:
          type: boolean
          default: true
        reason:
          $ref: '#/components/schemas/ReasonText'
    ClusterCreated:
      type: object
      required: [cluster]
      properties:
        cluster:
          $ref: '#/components/schemas/ClusterAdmin'
        agentToken:
          $ref: '#/components/schemas/TokenCreated'
    ClusterUpdate:
      type: object
      required: [reason]
      properties:
        description:
          type: string
          maxLength: 1024
        environment:
          $ref: '#/components/schemas/Environment'
        owner:
          type: string
          maxLength: 128
        policySource:
          $ref: '#/components/schemas/ClusterPolicySource'
        provider:
          type: string
          maxLength: 64
          description: Informational, e.g. `aws`.
        region:
          type: string
          maxLength: 64
          description: Informational.
        metrics:
          $ref: '#/components/schemas/MetricsBinding'
        reason:
          $ref: '#/components/schemas/ReasonText'
    ClusterConfig:
      type: object
      required: [cluster, configVersion, generatedAt, policySource, policies, flags, approvals]
      properties:
        cluster:
          $ref: '#/components/schemas/ClusterName'
        configVersion:
          type: string
          description: Opaque; changes whenever anything in this document changes.
        generatedAt:
          type: string
          format: date-time
        policySource:
          $ref: '#/components/schemas/ClusterPolicySource'
        policies:
          type: array
          description: |
            The complete set of hub-managed policies for the cluster: the agent deletes
            hub-labelled CRs that are not listed.
          items:
            $ref: '#/components/schemas/ConfigPolicy'
        flags:
          $ref: '#/components/schemas/ConfigFlags'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ConfigApproval'
        hubVersion:
          type: string
          description: For the agent's `agent.version` check.
        minAgentVersion:
          type: string
          description: Oldest agent version this hub supports (`agent.version` check).
    ConfigPolicy:
      type: object
      required: [id, name, type, version, priority, spec]
      properties:
        id:
          type: string
          format: uuid
          description: Annotation `kerf.getkerf.dev/hub-policy-id`.
        name:
          type: string
          description: Name of the CR.
        type:
          $ref: '#/components/schemas/HubPolicyType'
        version:
          type: integer
          minimum: 1
          description: Annotation `kerf.getkerf.dev/hub-version`.
        priority:
          type: integer
          description: Equal to `spec.priority`.
        spec:
          $ref: '#/components/schemas/RightsizingPolicySpec'
    ConfigFlags:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean
          description: Cluster or fleet paused. Behaves like a cluster-wide freeze (reason `Paused`).
        pauseScope:
          type: string
          enum: [cluster, fleet]
          description: Which pause is in effect (`fleet` if both).
        pauseReason:
          type: string
        pausedAt:
          type: string
          format: date-time
        resumeAt:
          type: string
          format: date-time
          description: Informational; the hub ends the pause, the agent does not.
        recheck:
          type: boolean
          description: |
            A readiness re-check is pending (D-025): the agent re-runs its self-checks if
            `recheckRequestedAt` is newer than its last run, and reports them in the next batch.
        recheckRequestedAt:
          type: string
          format: date-time
    ConfigApproval:
      type: object
      description: |
        An approve-once grant (D-024). The agent applies the recommendation `recommendationID` of the
        workload once, treating its `audit` resources as `auto-patch`, with every guardrail, if that
        is still the latest recommendation and `expiresAt` has not passed. It then emits `applied`
        with reason `ApprovedOnce` and `details.approvalId`; the hub marks the approval consumed and
        stops sending it.
      required: [id, workload, recommendationID, expiresAt, approvedBy, approvedAt]
      properties:
        id:
          type: string
          format: uuid
        workload:
          $ref: '#/components/schemas/WorkloadRef'
        recommendationID:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        approvedBy:
          type: string
          description: Actor name, for the event message.
        approvedAt:
          type: string
          format: date-time
    ApprovalRequest:
      type: object
      required: [recommendationID, reason]
      properties:
        recommendationID:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReasonText'
        expiresAt:
          type: string
          format: date-time
          description: Default 24 h from now; at most 7 days.
        overrideReadiness:
          type: boolean
          description: |
            Admin only: allow `auto-patch` on clusters that are not `AutomationReady` (D-025);
            audited with the change.
    Approval:
      type: object
      required: [id, workloadId, recommendationID, approvedBy, approvedAt, expiresAt, reason, state]
      properties:
        id:
          type: string
          format: uuid
        workloadId:
          $ref: '#/components/schemas/WorkloadID'
        recommendationID:
          type: string
          format: uuid
        approvedBy:
          $ref: '#/components/schemas/Actor'
        approvedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        reason:
          type: string
        state:
          type: string
          description: '`superseded`: replaced by a newer approval or a newer recommendation.'
          enum: [pending, consumed, expired, superseded]
        consumedAt:
          type: string
          format: date-time
        consumedEventId:
          type: string
          format: uuid
          description: The agent's `applied` / `ApprovedOnce` event.
    WorkloadOverrideInput:
      type: object
      description: |
        `spec` without `selector` and `priority` (the hub sets both; sending them is a `400`, code
        `invalid_override`).
      required: [spec, reason]
      properties:
        description:
          type: string
          maxLength: 1024
        spec:
          $ref: '#/components/schemas/RightsizingPolicySpec'
        overrideReadiness:
          type: boolean
          description: |
            Admin only: allow `auto-patch` on clusters that are not `AutomationReady` (D-025);
            audited with the change.
        reason:
          $ref: '#/components/schemas/ReasonText'
    LayerSource:
      type: string
      description: |
        A precedence layer, lowest first: `built-in` (documented global defaults), `global-default`
        (hub `ro-global-defaults`), `cluster-default-chart` (agent chart value `clusterDefaults`),
        `cluster-default` (hub `ro-cluster-defaults`), `policy` (the winning RightsizingPolicy, hub
        or Git), `workload-override` (hub), `annotation` (workload annotations, D-005).
      enum: [built-in, global-default, cluster-default-chart, cluster-default, policy, workload-override, annotation]
    PolicyLayer:
      type: object
      required: [source, applied]
      properties:
        source:
          $ref: '#/components/schemas/LayerSource'
        name:
          type: string
          description: Policy name (or annotation key for `annotation`).
        origin:
          $ref: '#/components/schemas/PolicyOrigin'
        policyId:
          type: string
          format: uuid
          description: Hub policy id, for hub-managed layers.
        priority:
          type: integer
        applied:
          type: boolean
          description: |
            False for a matching policy that lost on priority (listed so the UI can explain it) and
            for an invalid policy.
        note:
          type: string
          description: Why a layer was not applied, e.g. "priority 100 < 200 of payments".
        spec:
          description: The fields this layer sets.
          allOf:
            - $ref: '#/components/schemas/RightsizingPolicySpec'
    EffectiveField:
      type: object
      required: [path, value, source]
      properties:
        path:
          type: string
          description: JSON path in the spec, e.g. `cpu.mode`, `guardrails.rollback.oomKills`.
          examples: [cpu.mode]
        value:
          type: string
          description: The effective value as a string; lists and objects as JSON.
        source:
          $ref: '#/components/schemas/LayerSource'
        name:
          type: string
          description: Name of the policy (or annotation key) that set it.
    EffectivePolicy:
      type: object
      required: [workloadId, layers, fields, modes]
      properties:
        workloadId:
          $ref: '#/components/schemas/WorkloadID'
        layers:
          type: array
          description: Lowest precedence first.
          items:
            $ref: '#/components/schemas/PolicyLayer'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveField'
        modes:
          $ref: '#/components/schemas/EffectiveModes'
        agentModes:
          description: Modes the agent last reported; absent if never reported.
          allOf:
            - $ref: '#/components/schemas/EffectiveModes'
        agentPolicy:
          type: string
          description: Winning policy the agent last reported.
        warnings:
          type: array
          description: E.g. "workload labels unknown; matchLabels selectors assumed not to match".
          items:
            type: string
    ConfigTargetType:
      type: string
      enum: [settings, policy, workload-override, approval, cluster, automation, token, user, datasource, readiness]
    ConfigAction:
      type: string
      description: CamelCase action of a configuration change (`docs/contracts/events.md`).
      enum:
        - SettingsUpdated
        - PolicyCreated
        - PolicyUpdated
        - PolicyDeleted
        - PolicyReverted
        - OverrideSet
        - OverrideCleared
        - WorkloadApproved
        - ClusterCreated
        - ClusterUpdated
        - ClusterDeleted
        - AutomationPaused
        - AutomationResumed
        - TokenCreated
        - TokenRevoked
        - UserCreated
        - UserUpdated
        - UserDeleted
        - PasswordReset
        - DatasourceCreated
        - DatasourceUpdated
        - DatasourceDeleted
        - ReadinessChanged
    ConfigTarget:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: '#/components/schemas/ConfigTargetType'
        id:
          type: string
          description: |
            Policy or approval id, settings section, cluster name (`*` for the fleet automation),
            token id or username.
        name:
          type: string
          description: Display name, e.g. the policy name.
        cluster:
          $ref: '#/components/schemas/ClusterName'
        workloadId:
          $ref: '#/components/schemas/WorkloadID'
    ConfigChange:
      type: object
      description: |
        One configuration change (audit type `config_changed`). `before` and `after` are the
        target's API representation before and after the change (`null` on create / delete),
        never including password hashes or token values.
      required: [id, type, time, actor, action, target, reason]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [config_changed]
        time:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Actor'
        action:
          $ref: '#/components/schemas/ConfigAction'
        target:
          $ref: '#/components/schemas/ConfigTarget'
        reason:
          type: string
          description: The reason given with the change.
        version:
          type: integer
          description: Version of the target after the change, if it is versioned.
        before:
          type: [object, 'null']
        after:
          type: [object, 'null']
    ConfigChangeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigChange'
        continue:
          type: string
    DatasourceType:
      type: string
      enum: [prometheus, victoriametrics, thanos, mimir, amp]
    DatasourceAuthType:
      type: string
      enum: [none, bearer, basic, sigv4, mtls]
    DatasourceSigV4:
      type: object
      description: AWS SigV4 (Amazon Managed Prometheus); credentials come from IRSA / Pod Identity.
      required: [region]
      properties:
        region:
          type: string
        service:
          type: string
          default: aps
        roleARN:
          type: string
          description: Role to assume; absent = the hub's own identity.
    DatasourceTLSInput:
      type: object
      properties:
        caCert:
          type: string
          description: PEM; not secret, returned as `caConfigured`.
        clientCert:
          type: string
          description: PEM (mTLS).
        clientKey:
          type: string
          writeOnly: true
          description: PEM (mTLS). Write-only.
        insecureSkipVerify:
          type: boolean
    DatasourceAuthInput:
      type: object
      description: |
        Secret fields (`token`, `password`, `tls.clientKey`) are write-only. On update, omitted
        secret fields keep the stored values.
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/DatasourceAuthType'
        token:
          type: string
          writeOnly: true
          description: For `bearer`.
        username:
          type: string
          description: For `basic`.
        password:
          type: string
          writeOnly: true
          description: For `basic`.
        sigv4:
          $ref: '#/components/schemas/DatasourceSigV4'
        tls:
          $ref: '#/components/schemas/DatasourceTLSInput'
    DatasourceAuthInfo:
      type: object
      description: The stored auth without secrets.
      required: [type, secretConfigured]
      properties:
        type:
          $ref: '#/components/schemas/DatasourceAuthType'
        username:
          type: string
        sigv4:
          $ref: '#/components/schemas/DatasourceSigV4'
        secretConfigured:
          type: boolean
          description: A token, password or client key is stored.
        caConfigured:
          type: boolean
        clientCertConfigured:
          type: boolean
        insecureSkipVerify:
          type: boolean
    DatasourceInput:
      type: object
      required: [name, type, url, reason]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
        type:
          $ref: '#/components/schemas/DatasourceType'
        url:
          type: string
          format: uri
          description: Query base URL (`/api/v1/query` is appended).
        auth:
          $ref: '#/components/schemas/DatasourceAuthInput'
        clearSecrets:
          type: boolean
          description: On update, remove the stored secrets.
        headers:
          type: object
          description: Extra request headers, e.g. `X-Scope-OrgID`. Not secret.
          additionalProperties:
            type: string
        timeout:
          $ref: '#/components/schemas/Duration'
        maxPoints:
          type: integer
          minimum: 100
          description: Most points per series per query; the recommender chunks queries to fit.
        reason:
          $ref: '#/components/schemas/ReasonText'
    Datasource:
      type: object
      required: [id, name, type, url, builtIn, auth, headers, usedBy, version]
      properties:
        id:
          type: string
          description: '`local` for the built-in datasource, otherwise a UUID.'
        name:
          type: string
        type:
          $ref: '#/components/schemas/DatasourceType'
        url:
          type: string
        builtIn:
          type: boolean
        auth:
          $ref: '#/components/schemas/DatasourceAuthInfo'
        headers:
          type: object
          additionalProperties:
            type: string
        timeout:
          $ref: '#/components/schemas/Duration'
        maxPoints:
          type: integer
        usedBy:
          type: array
          description: Clusters bound to it.
          items:
            $ref: '#/components/schemas/ClusterName'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/Actor'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/Actor'
    DatasourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Datasource'
    MetricsJobNames:
      type: object
      description: Scrape job names, only used to make diagnoses precise.
      properties:
        cadvisor:
          type: array
          items:
            type: string
        kubeStateMetrics:
          type: array
          items:
            type: string
    ClusterMetricsBinding:
      type: object
      description: A cluster's metrics binding for the pricing service (D-026).
      required: [cluster, binding, bound]
      properties:
        cluster:
          type: string
        binding:
          $ref: '#/components/schemas/MetricsBinding'
        bound:
          type: boolean
          description: false = no stored binding (datasource local, label cluster = the name).
    MetricsBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClusterMetricsBinding'
    PromQueryForm:
      type: object
      required: [query]
      properties:
        query:
          type: string
        time:
          type: string
        start:
          type: string
        end:
          type: string
        step:
          type: string
        timeout:
          type: string
    PromQueryResponse:
      type: object
      description: Prometheus HTTP API response (`status`, `data`, `errorType`, `error`), passed through.
      required: [status]
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: object
          additionalProperties: true
        errorType:
          type: string
        error:
          type: string
    MetricsBinding:
      type: object
      description: |
        Where a cluster's metrics are (D-025). Every query uses
        `{<clusterLabel>="<clusterLabelValue>", <extraMatchers>}`; results are re-labelled to the
        registered cluster name. `clusterLabel` `""` means no cluster matcher (a per-cluster
        Prometheus). Defaults: `local`, `cluster`, the cluster name.
      required: [datasourceId, clusterLabel]
      properties:
        datasourceId:
          type: string
        clusterLabel:
          type: string
          pattern: '^([a-zA-Z_][a-zA-Z0-9_]*)?$'
        clusterLabelValue:
          type: string
          description: Default the cluster name.
        extraMatchers:
          type: array
          maxItems: 16
          items:
            type: string
            pattern: '^[a-zA-Z_][a-zA-Z0-9_]*(=|!=|=~|!~)"([^"\\]|\\.)*"$'
            examples: ['env="prod"']
        jobNames:
          $ref: '#/components/schemas/MetricsJobNames'
    DatasourceTestRequest:
      type: object
      properties:
        binding:
          $ref: '#/components/schemas/MetricsBinding'
    DatasourceTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok:
          type: boolean
          description: No blocking check failed.
        latencyMs:
          type: integer
          minimum: 0
        found:
          type: object
          description: What the binding's matchers found.
          properties:
            containerSeries:
              type: integer
              minimum: 0
            pods:
              type: integer
              minimum: 0
            nodes:
              type: integer
              minimum: 0
        labelValues:
          type: array
          description: Existing values of the cluster label (suggestions when it does not match).
          items:
            type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    ReadinessState:
      type: string
      description: Each state includes the ones before it (docs/contracts/readiness.md).
      enum: [Registered, AgentConnected, MetricsOK, ReadyAudit, AutomationReady]
    ReadinessSeverity:
      type: string
      enum: [blocking, warning, info]
    ReadinessStatus:
      type: string
      enum: [pass, warn, fail, unknown]
    ReadinessCategory:
      type: string
      enum: [datasource, metrics, pricing, agent, rbac, apply, webhook, nodes, integration, policy]
    ReadinessCheckID:
      type: string
      description: Stable check id from the catalog (docs/contracts/readiness.md, api/v1alpha1/readiness).
      pattern: '^[a-z]+\.[a-z0-9-]+$'
      examples: [metrics.ksm-owners, rbac.resize]
    ReadinessCheck:
      type: object
      required: [id, category, severity, source, status, message, checkedAt]
      properties:
        id:
          $ref: '#/components/schemas/ReadinessCheckID'
        category:
          $ref: '#/components/schemas/ReadinessCategory'
        severity:
          $ref: '#/components/schemas/ReadinessSeverity'
        source:
          type: string
          enum: [hub, agent]
        gates:
          description: For blocking checks, the state that needs this check to pass.
          allOf:
            - $ref: '#/components/schemas/ReadinessState'
        status:
          $ref: '#/components/schemas/ReadinessStatus'
        message:
          type: string
          maxLength: 2048
        remediation:
          type: string
          description: Exact command or values snippet that fixes it.
        remediationType:
          type: string
          enum: [command, yaml, text]
        docsURL:
          type: string
        checkedAt:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties:
            type: string
    AgentCapability:
      type: object
      description: Result of the SelfSubjectAccessReviews of one capability (check `rbac.<name>`).
      required: [name, granted]
      properties:
        name:
          type: string
          enum: [read, resize, rollout, hpa, evict, policies, events]
        granted:
          type: boolean
        missing:
          type: array
          description: ClusterRole rules to add, each as JSON (`{"apiGroups":[…],"resources":[…],"verbs":[…]}`).
          items:
            type: string
        message:
          type: string
    ReadinessSummary:
      type: object
      required: [state, blocking, warnings]
      properties:
        state:
          $ref: '#/components/schemas/ReadinessState'
        blocking:
          type: integer
          minimum: 0
          description: Blocking checks not passing.
        warnings:
          type: integer
          minimum: 0
          description: Warning checks with status warn or fail.
        checkedAt:
          type: string
          format: date-time
    ClusterReadiness:
      type: object
      required: [cluster, state, summary, checks]
      properties:
        cluster:
          $ref: '#/components/schemas/ClusterName'
        state:
          $ref: '#/components/schemas/ReadinessState'
        stateSince:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
          description: Newest result.
        summary:
          type: object
          required: [blocking, warnings, unknown]
          properties:
            blocking:
              type: integer
              minimum: 0
            warnings:
              type: integer
              minimum: 0
            unknown:
              type: integer
              minimum: 0
        nextState:
          description: Absent at AutomationReady.
          allOf:
            - $ref: '#/components/schemas/ReadinessState'
        blockedBy:
          type: array
          description: Ids of the blocking checks that keep the cluster from `nextState`.
          items:
            $ref: '#/components/schemas/ReadinessCheckID'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/AgentCapability'
        recheckRequestedAt:
          type: string
          format: date-time
          description: Present while a re-check is pending.
        checks:
          type: array
          description: One result per catalog check, in catalog order.
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    RecheckAccepted:
      type: object
      required: [requestedAt, hubChecks, agentRecheck]
      properties:
        requestedAt:
          type: string
          format: date-time
        hubChecks:
          type: boolean
          description: Hub metrics checks queued.
        agentRecheck:
          type: boolean
          description: Recheck flag set in the cluster config.
    ReadinessHistoryEntry:
      type: object
      required: [time, kind]
      properties:
        time:
          type: string
          format: date-time
        kind:
          type: string
          enum: [state, check]
        fromState:
          $ref: '#/components/schemas/ReadinessState'
        toState:
          $ref: '#/components/schemas/ReadinessState'
        checkId:
          $ref: '#/components/schemas/ReadinessCheckID'
        fromStatus:
          $ref: '#/components/schemas/ReadinessStatus'
        toStatus:
          $ref: '#/components/schemas/ReadinessStatus'
        message:
          type: string
    ReadinessHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessHistoryEntry'
        continue:
          type: string
    InstallFormat:
      type: string
      enum: [helm, values, argocd]
    InstallSnippet:
      type: object
      required: [format, content, filename, argocdIgnoreDifferences]
      properties:
        format:
          $ref: '#/components/schemas/InstallFormat'
        content:
          type: string
          description: Shell commands (`helm`), a values file (`values`) or an Application manifest (`argocd`).
        filename:
          type: string
          examples: [install.sh, values.yaml, application.yaml]
        argocdIgnoreDifferences:
          type: string
          description: Snippet for `argocd-cm` so Argo CD ignores fields owned by `kerf` (D-006).
        notes:
          type: array
          items:
            type: string
    AgentComponent:
      type: object
      description: |
        A Kerf component the agent found running in its cluster (WO-33). Today: the pods behind the
        webhook Service (`component: webhook`), with the tag of their `webhook` container image as
        `version` (`sha256:<12 hex>` for an image pinned only by digest).
      required: [component, instance, version]
      properties:
        component:
          type: string
          enum: [webhook]
        instance:
          type: string
          description: Pod name.
        version:
          type: string
    ComponentName:
      type: string
      enum: [hub, pricing, agent, webhook]
    VersionCompat:
      type: string
      description: |
        The component's version against the hub's (both semver): `same`, `older`, `newer`; `unknown`
        when either is not a release version (e.g. `dev`) or the component has not reported.
      enum: [same, older, newer, unknown]
    ComponentVersion:
      type: object
      required: [component, version, compat]
      properties:
        component:
          $ref: '#/components/schemas/ComponentName'
        cluster:
          type: string
          description: The workload cluster (agent, webhook); absent for hub-side components.
        instance:
          type: string
          description: Pod name (hub replicas, pricing, webhook pods).
        version:
          type: string
          description: Empty when the component has not reported a version.
        startedAt:
          type: string
          format: date-time
          description: Hub replicas only.
        lastSeenAt:
          type: string
          format: date-time
        leader:
          type: boolean
          description: Hub replicas only; true for the replica holding the leader lock.
        agentStatus:
          type: string
          description: Agents only (`ClusterInfo.agentStatus`).
        compat:
          $ref: '#/components/schemas/VersionCompat'
        message:
          type: string
          description: 'What to do about a mismatch, e.g. "Older than the hub (0.2.0): upgrade the chart in ro-spoke-1."'
    UpdateState:
      type: string
      description: |
        `up_to_date`, `update_available`, `disabled` (`hub.updateCheck.enabled: false`), `failed` (the
        last check failed: `error`; `latestVersion` is the last one found), `pending` (enabled, not
        checked yet) or `dev_build` (the hub is not a release version, so nothing is compared).
      enum: [up_to_date, update_available, disabled, failed, pending, dev_build]
    UpdateStatus:
      type: object
      required: [enabled, state, currentVersion, interval, source]
      properties:
        enabled:
          type: boolean
        state:
          $ref: '#/components/schemas/UpdateState'
        currentVersion:
          type: string
          description: The hub version the result was computed for.
        latestVersion:
          type: string
          description: The latest stable release (or a pre-release of the running pre-release's minor).
        releaseName:
          type: string
        releaseURL:
          type: string
          format: uri
          description: Release notes.
        publishedAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
        lastSuccessAt:
          type: string
          format: date-time
        error:
          type: string
        interval:
          $ref: '#/components/schemas/Duration'
        source:
          type: string
          description: The releases URL that is read.
          examples: ['https://api.github.com/repos/kerf-dev/kerf/releases']
    UpgradeCommands:
      type: object
      description: |
        `helm upgrade` commands to the latest version (docs/install/eks.md §8): the hub cluster first,
        then each workload cluster. `<...>` marks what to fill in.
      required: [version, chart, hubCommand, spokeCommand, docsURL]
      properties:
        version:
          type: string
        chart:
          type: string
        hubCommand:
          type: string
        spokeCommand:
          type: string
        docsURL:
          type: string
          format: uri
    Maintenance:
      type: object
      required: [hubVersion, components, update]
      properties:
        hubVersion:
          type: string
          description: Version of the hub replica that answered.
        chartVersion:
          type: string
          description: Version of the hub chart this replica was installed with.
        components:
          type: array
          description: |
            Hub replicas, pricing instances, then per cluster (by name) its agent (one entry, also
            when it never reported) and webhook pods.
          items:
            $ref: '#/components/schemas/ComponentVersion'
        update:
          $ref: '#/components/schemas/UpdateStatus'
        upgrade:
          $ref: '#/components/schemas/UpgradeCommands'
    Problem:
      type: object
      description: |
        RFC 9457 problem details; the single error schema for every endpoint. `code` is a stable
        machine-readable identifier (e.g. `cluster_forbidden`, `invalid_workload_id`).
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
