openapi: 3.1.0
info:
  title: Kerf hub API
  version: 0.1.0
  summary: Contract between the hub, the per-cluster agents and the web UI (WO-00).
  description: |
    The hub computes recommendations for every workload in every cluster; each cluster's agent
    pulls them, applies them according to its local policy and reports status and events back
    (D-004). The hub never calls the agents. The web UI reads through the `ui` endpoints.

    **Authentication** (D-012): every request carries `Authorization: Bearer <token>`. Each token
    has one role; the roles an operation accepts are listed in its `security` requirement.
    - `agent`: bound to exactly one cluster. It may only use the `/v1/clusters/{cluster}/...`
      endpoints of that cluster (otherwise `403`), and `GET /v1/audit` restricted to that cluster.
    - `ui`: read-only, all clusters. May use the `ui`-tagged endpoints and `GET /v1/audit`.
    - `admin`: may use every endpoint for every cluster (satisfies every role).
    A token without an accepted role gets `403`. The hub stores only a SHA-256 hash of each token.

    **Sessions** (D-023, admin area `docs/contracts/admin.md`): a local user logs in with
    `POST /v1/auth/login` and gets the HttpOnly cookie `kerf_session` (`sessionAuth`). Users have one
    role, `viewer` < `operator` < `admin`; each includes the ones before it. An operation lists the
    lowest user role it accepts as `sessionAuth: [role]`, next to the token roles it accepts. For
    authorization a `ui` token counts as `viewer` and an `admin` token as `admin`. Every write
    (POST, PUT, PATCH, DELETE) made with a session needs the header `X-CSRF-Token` with the token
    from the login or `GET /v1/me` response (`403`, code `csrf_invalid`); bearer requests need none.
    When a request carries both a valid session cookie and a bearer token, the session is used.

    **Admin writes** take a `reason` and record a `config_changed` audit entry
    (`GET /v1/audit/config`). Changes to an existing versioned object need `If-Match` with its
    ETag `"<version>"`: missing gives `428` (code `precondition_required`), stale gives `412` (code
    `version_conflict`). Until the hub implements an endpoint it answers `501` (code
    `not_implemented`).

    **Conventions**
    - `cluster` is the cluster name, identical to the `cluster` label on all metrics
      (`docs/contracts/metrics.md`).
    - Quantities use Kubernetes quantity syntax (`250m`, `512Mi`).
    - Durations use Go duration syntax (`336h0m0s`, `10m`).
    - Timestamps are RFC 3339 in UTC.
    - Workload ids are `<cluster>/<namespace>/<kind>/<name>`, e.g.
      `ro-spoke-1/payments/Deployment/checkout`. In a path they are one segment, URL-encoded
      (`encodeURIComponent`, so `/` becomes `%2F`). Reverse proxies in front of the hub must pass
      `%2F` through undecoded.
    - Numbers in time series and totals use base units: cores, bytes, USD.
    - Errors use `application/problem+json` (RFC 9457).
    - Unknown fields must be ignored by readers, so fields can be added without a new version.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: '{baseURL}'
    description: Hub base URL. Local development (WO-01) uses http://localhost:8080.
    variables:
      baseURL:
        default: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: agent
    description: Endpoints used by the per-cluster agent.
  - name: audit
    description: Audit log queries.
  - name: ui
    description: Read-only endpoints for the web UI.
  - name: admin
    description: Administration (admin area, D-022). Roles per operation.
  - name: auth
    description: Login, logout and the caller's identity (D-023).
  - name: internal
    description: Service endpoints for the pricing service (token role `pricing`, D-026).
paths:
  /v1/clusters/{cluster}/recommendations:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    get:
      tags: [agent]
      operationId: listRecommendations
      security:
        - bearerAuth: [agent]
      summary: Latest recommendation for every workload of a cluster
      description: |
        Returns the latest recommendation per workload. Workloads without a recommendation
        (e.g. unknown to the hub) are omitted. Supports conditional requests: the response carries
        an `ETag`; sending it back in `If-None-Match` returns `304` when nothing changed.
        Without `limit` all items are returned in one page.
      parameters:
        - name: namespace
          in: query
          description: Only workloads in this namespace.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Continue'
        - name: If-None-Match
          in: header
          description: ETag of a previous response.
          schema:
            type: string
      responses:
        '200':
          description: Recommendations.
          headers:
            ETag:
              description: Opaque version of the result set.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationList'
        '304':
          description: Not modified since the given ETag.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/clusters/{cluster}/workload-status:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    post:
      tags: [agent]
      operationId: reportWorkloadStatus
      security:
        - bearerAuth: [agent]
      summary: Report the status of a batch of workloads
      description: |
        Upserts the status of each listed workload (keyed by namespace, kind and name). Workloads
        not listed keep their previous status. The agent sends a full batch at least once per
        recommendation pull, and a partial batch on every phase change. The hub uses
        `settings` as input for the next recommendation run of that workload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadStatusBatch'
      responses:
        '200':
          description: Batch accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
  /v1/clusters/{cluster}/events:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    post:
      tags: [agent]
      operationId: reportEvents
      security:
        - bearerAuth: [agent]
      summary: Append audit events
      description: |
        Appends events to the audit log (`docs/contracts/events.md`). Idempotent by event `id`:
        re-sending an event that was already stored is counted as a duplicate, not an error, so
        the agent can retry a whole batch after a timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: Batch accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
  /v1/audit:
    get:
      tags: [audit]
      operationId: queryAudit
      security:
        - bearerAuth: [agent]
        - bearerAuth: [ui]
        - sessionAuth: [viewer]
      summary: Query the audit log
      description: |
        Returns audit events matching all given filters, ordered by event `time` (ascending by
        default). An agent token implicitly filters on its own cluster.
      parameters:
        - name: cluster
          in: query
          schema:
            $ref: '#/components/schemas/ClusterName'
        - name: namespace
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/WorkloadKind'
        - name: workload
          in: query
          description: Workload name.
          schema:
            type: string
        - name: type
          in: query
          description: Event types; repeat the parameter for several.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventType'
        - name: from
          in: query
          description: Inclusive lower bound on event time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive upper bound on event time.
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/summary:
    get:
      tags: [ui]
      operationId: getSummary
      security:
        - bearerAuth: [ui]
        - sessionAuth: [viewer]
      summary: Fleet and per-cluster totals
      description: |
        Totals over the latest recommendation of every live workload. Workloads the agent never
        reported count as `audit` / `Pending` (global default, D-005).
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/clusters:
    get:
      tags: [ui]
      operationId: listClusters
      security:
        - bearerAuth: [ui]
        - sessionAuth: [viewer]
      summary: Clusters with agent heartbeat and counts
      responses:
        '200':
          description: Clusters, ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/workloads:
    get:
      tags: [ui]
      operationId: listWorkloads
      security:
        - bearerAuth: [ui]
        - sessionAuth: [viewer]
      summary: Workloads with their latest recommendation
      description: |
        One row per live workload, including workloads that have no recommendation yet (their
        recommendation fields are absent). All filters are combined with AND; repeatable filters
        match any of their values.
      parameters:
        - name: cluster
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ClusterName'
        - name: namespace
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkloadKind'
        - name: mode
          in: query
          description: Matches if the CPU or the memory mode is one of the values.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Mode'
        - name: riskFlag
          in: query
          description: Matches if the workload has any of the flags.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RiskFlag'
        - name: minSavings
          in: query
          description: Minimum total estimated monthly savings in USD.
          schema:
            type: number
        - name: q
          in: query
          description: Case-insensitive substring match on namespace and workload name.
          schema:
            type: string
            maxLength: 253
        - name: sort
          in: query
          schema:
            type: string
            enum: [savings, confidence, name]
            default: savings
        - name: order
          in: query
          description: Default `desc` for savings and confidence, `asc` for name.
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: Workloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/workloads/facets:
    get:
      tags: [ui]
      operationId: getWorkloadFacets
      security:
        - bearerAuth: [ui]
        - sessionAuth: [viewer]
      summary: Filter values with workload counts (D-016)
      description: |
        Counts of live workloads per filter value, for building the filters of the workload list.
        Takes the same filters as `GET /v1/workloads`. Each facet is counted with every filter
        applied except its own (so a multi-select keeps showing the other values of that facet);
        `total` applies all filters and equals `WorkloadList.total`. A workload counts once per
        distinct value: in `modes` under both its CPU and its memory mode, in `riskFlags` under each
        of its flags. Values with zero workloads are omitted. Items are sorted by value.
      parameters:
        - name: cluster
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ClusterName'
        - name: namespace
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WorkloadKind'
        - name: mode
          in: query
          description: Matches if the CPU or the memory mode is one of the values.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Mode'
        - name: riskFlag
          in: query
          description: Matches if the workload has any of the flags.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RiskFlag'
        - name: minSavings
          in: query
          description: Minimum total estimated monthly savings in USD.
          schema:
            type: number
        - name: q
          in: query
          description: Case-insensitive substring match on namespace and workload name.
          schema:
            type: string
            maxLength: 253
      responses:
        '200':
          description: Facets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadFacets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/workloads/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkloadID'
    get:
      tags: [ui]
      operationId: getWorkload
      security:
        - bearerAuth: [ui]
        - sessionAuth: [viewer]
      summary: Workload detail with per-container explanation
      responses:
        '200':
          description: Workload detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkloadNotFound'
  /v1/workloads/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/WorkloadID'
    get:
      tags: [ui]
      operationId: getWorkloadUsage
      security:
        - bearerAuth: [ui]
        - sessionAuth: [viewer]
      summary: Usage, request, limit and recommendation time series
      description: |
        Per container. `usage` is the maximum across the workload's pods at each step (what a
        per-pod request has to cover); `usageAvg` is the mean across pods. `request`, `limit` and
        `recommendation` (recommended request) are step functions. Values are cores for `cpu` and
        bytes for `memory`.
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ResourceName'
        - name: container
          in: query
          description: Only this container.
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Step'
      responses:
        '200':
          description: Time series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkloadNotFound'
  /v1/workloads/{id}/history:
    parameters:
      - $ref: '#/components/parameters/WorkloadID'
    get:
      tags: [ui]
      operationId: getWorkloadHistory
      security:
        - bearerAuth: [ui]
        - sessionAuth: [viewer]
      summary: Past recommendations and audit events of a workload
      description: Both lists are newest first and capped at `limit` entries each.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: History.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkloadNotFound'
  /v1/savings/trend:
    get:
      tags: [ui]
      operationId: getSavingsTrend
      security:
        - bearerAuth: [ui]
        - sessionAuth: [viewer]
      summary: Estimated monthly savings over time
      description: |
        At each step: the sum of the estimated monthly savings of the recommendation that was
        latest at that time, over the workloads live at that time. Estimated, not realized
        (realized savings are WO-17). Points are aligned to multiples of `step` (UTC); a point at
        time `t` holds the value at the end of its bucket, `min(t + step, to)`, so with the default
        `to` (now) the last point equals the current `GET /v1/summary` totals.
      parameters:
        - name: cluster
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ClusterName'
        - name: groupBy
          in: query
          description: '`none` returns one fleet series; `cluster` one series per cluster.'
          schema:
            type: string
            enum: [none, cluster]
            default: none
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Step'
      responses:
        '200':
          description: Savings trend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsTrend'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/recompute:
    post:
      tags: [admin]
      operationId: recompute
      security:
        - bearerAuth: [admin]
        - sessionAuth: [admin]
      summary: Run the recommender now
      description: |
        Queues a recommender run (D-019) for one cluster (`cluster`) or for all registered
        clusters, and returns at once with the run id. The run starts as soon as no other run is
        in progress; it uses usage data up to the last full recommender step (5 minutes by
        default) before it starts, like a scheduled run. A request for the same scope that
        arrives while an earlier one is still queued gets that run's id (`coalesced: true`)
        instead of queuing another.

        Completion is visible through the existing endpoints: `lastRecommenderRunAt` of the
        cluster in `GET /v1/clusters` moves past `requestedAt`, and the agent endpoint returns
        the new recommendations.
      parameters:
        - name: cluster
          in: query
          description: Only this cluster. Default all clusters.
          schema:
            $ref: '#/components/schemas/ClusterName'
      responses:
        '202':
          description: Run queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecomputeAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/clusters/{cluster}/config:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    get:
      tags: [agent]
      operationId: getClusterConfig
      security:
        - bearerAuth: [agent]
      summary: Hub-managed configuration of a cluster (D-022)
      description: |
        What the agent materialises on its cluster (`docs/contracts/admin.md`):
        - `policies`: every hub-managed policy for this cluster, as `RightsizingPolicy` specs. The
          agent creates, updates and deletes `RightsizingPolicy` CRs labelled
          `kerf.getkerf.dev/managed-by=hub` so that exactly these exist (name = `name`,
          annotations `hub-policy-id`, `hub-version`, `hub-policy-type`). CRs without the label are
          never touched. With `policySource: git` the list is empty.
        - `flags`: pause. While `paused`, the agent applies nothing new (event `blocked`, reason
          `Paused`); rollbacks still run.
        - `approvals`: approve-once grants (D-024).

        The agent pulls it on every pull interval. Conditional requests: the response carries an
        `ETag` (equal to `configVersion` in quotes); `If-None-Match` returns `304` when nothing
        changed. If the hub is unreachable the agent keeps the CRs and the last flags it received.
      parameters:
        - name: If-None-Match
          in: header
          description: ETag of a previous response.
          schema:
            type: string
      responses:
        '200':
          description: Cluster configuration.
          headers:
            ETag:
              description: '`"<configVersion>"`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterConfig'
        '304':
          description: Not modified since the given ETag.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Log in with a local user (D-023)
      description: |
        Checks the username and password and starts a session. The response sets the session
        cookie `kerf_session` (`HttpOnly; SameSite=Strict; Path=/`, plus `Secure` behind TLS) and
        returns the CSRF token the client sends as `X-CSRF-Token` on every write made with the
        session. Failed logins are rate limited per client address and per user; after repeated
        failures the user is locked for a while (`429` with `Retry-After`, code `account_locked`).
        A wrong username and a wrong password give the same `401` (code `invalid_credentials`).
        A disabled user gets `401` too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              description: '`kerf_session=<opaque>; HttpOnly; SameSite=Strict; Path=/`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security:
        - sessionAuth: [viewer]
      summary: End the current session
      description: Revokes the session and clears the cookie. Idempotent.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: The caller's identity, role and CSRF token
      description: |
        For a session: the user, the role and the CSRF token. For a bearer token (`ui` or `admin`):
        the token's role mapped to a user role (`ui` → `viewer`, `admin` → `admin`) and no CSRF
        token (bearer requests need none). The UI uses it to decide what to show.
      responses:
        '200':
          description: Identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/me/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      security:
        - sessionAuth: [viewer]
      summary: Change the caller's own password
      description: |
        Requires the current password. Clears `mustChangePassword`. Other sessions of the user are
        revoked; the current one stays.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/admin/settings:
    get:
      tags: [admin]
      operationId: getSettings
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Hub-only settings (recommender, pricing)
      description: |
        Settings that stay in the hub and never reach clusters. A section never saved holds the
        values from the hub's configuration file with `version` 0.
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/settings/recommender:
    get:
      tags: [admin]
      operationId: getRecommenderSettings
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Recommender settings
      responses:
        '200':
          description: Recommender settings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommenderSettingsDoc'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [admin]
      operationId: putRecommenderSettings
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Replace the recommender settings
      description: |
        Stores a new version. Takes effect on the next recommender run (`POST /v1/admin/recompute`
        starts one). Records a `config_changed` audit event (`SettingsUpdated`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommenderSettingsUpdate'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommenderSettingsDoc'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/admin/settings/pricing:
    get:
      tags: [admin]
      operationId: getPricingSettings
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Pricing adjustments
      responses:
        '200':
          description: Pricing settings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingSettingsDoc'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [admin]
      operationId: putPricingSettings
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Replace the pricing adjustments
      description: |
        Stores a new version. Savings of recommendations computed afterwards use the adjusted rates.
        Records a `config_changed` audit event (`SettingsUpdated`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingSettingsUpdate'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingSettingsDoc'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/admin/settings/{section}/versions:
    parameters:
      - name: section
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SettingsSection'
    get:
      tags: [admin]
      operationId: listSettingsVersions
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Version history of a settings section
      description: Newest first.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVersionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/policies:
    get:
      tags: [admin]
      operationId: listPolicies
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Hub-managed policies
      description: |
        Hub-managed policies (all types, including workload overrides), ordered by type and then
        priority descending. Policies from Git are in `GET /v1/admin/policy-inventory`.
      parameters:
        - name: cluster
          in: query
          description: Only policies sent to this cluster (fleet-wide policies included).
          schema:
            $ref: '#/components/schemas/ClusterName'
        - name: type
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/HubPolicyType'
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicyList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: createPolicy
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Create a hub-managed policy
      description: |
        Types `global-default`, `cluster-default` and `policy`; workload overrides use
        `PUT /v1/workloads/{id}/override`. The hub sets the name and priority of the default types
        (`ro-global-defaults` / 0, `ro-cluster-defaults` / 10); at most one global default and one
        cluster default per cluster exist (`409`, code `already_exists`). A `policy` needs a name
        that does not start with `ro-` and a priority from 1 to 899999. The spec is validated like
        the CRD (code `invalid_policy`, `detail` lists the fields). Records a `config_changed`
        audit event (`PolicyCreated`).
        Setting a mode to `auto-patch` for a cluster that is not `AutomationReady` gives `409`, code
        `cluster_not_automation_ready`, unless an admin sends `overrideReadiness: true` (D-025).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyInput'
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/PolicyID'
    get:
      tags: [admin]
      operationId: getPolicy
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: One hub-managed policy
      description: Soft-deleted policies are returned too (with `deletedAt`).
      responses:
        '200':
          description: Policy.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PolicyNotFound'
    put:
      tags: [admin]
      operationId: updatePolicy
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Replace a hub-managed policy
      description: |
        Stores a new version; `type` cannot change (`400`, code `type_immutable`). Agents pick the
        change up on their next config pull. Records `PolicyUpdated`.
        Setting a mode to `auto-patch` for a cluster that is not `AutomationReady` gives `409`, code
        `cluster_not_automation_ready`, unless an admin sends `overrideReadiness: true` (D-025).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyInput'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PolicyNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [admin]
      operationId: deletePolicy
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Soft-delete a hub-managed policy
      description: |
        Sets `deletedAt` and stores a version with operation `delete`; the versions are kept and
        `revert` restores it. Agents delete the CR on their next pull. Records `PolicyDeleted`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReason'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PolicyNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/admin/policies/{policyId}/versions:
    parameters:
      - $ref: '#/components/parameters/PolicyID'
    get:
      tags: [admin]
      operationId: listPolicyVersions
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Version history of a policy
      description: Newest first. Every create, update, delete and revert is one version.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PolicyNotFound'
  /v1/admin/policies/{policyId}/revert:
    parameters:
      - $ref: '#/components/parameters/PolicyID'
    post:
      tags: [admin]
      operationId: revertPolicy
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Restore an earlier version
      description: |
        Stores a new version whose content equals version `version` (operation `revert`); reverting
        to a version of a deleted policy undeletes it. Records `PolicyReverted`.
        A revert that newly enables `auto-patch` on a cluster that is not `AutomationReady` answers
        `409` `cluster_not_automation_ready`, unless an admin sends `overrideReadiness: true` (D-025).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRevert'
      responses:
        '200':
          description: Reverted.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PolicyNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/admin/policy-inventory:
    get:
      tags: [admin]
      operationId: getPolicyInventory
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: RightsizingPolicy CRs reported by the agents
      description: |
        Every policy CR on each cluster as last reported by its agent (`policyInventory` of the
        status batch), hub-managed and from Git. The UI shows Git policies read-only from here.
      parameters:
        - name: cluster
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ClusterName'
      responses:
        '200':
          description: Inventory per cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyInventoryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/preview:
    post:
      tags: [admin]
      operationId: previewPolicyChange
      security:
        - sessionAuth: [operator]
        - bearerAuth: [admin]
      summary: Impact dry-run of policy changes
      description: |
        Applies the given hypothetical policy changes (global and cluster defaults are policies
        too) to the current state without saving them, and returns the workloads whose effective
        CPU or memory mode changes and the estimated monthly savings that move into (or out of)
        `auto-patch`. Read-only: needs no `If-Match` or reason and records nothing.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: Impact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/clusters:
    post:
      tags: [admin]
      operationId: createCluster
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Register a cluster
      description: |
        Creates the cluster and, with `createAgentToken`, an `agent` token for it whose value is
        returned once in `agentToken`. Records `ClusterCreated` (and `TokenCreated`).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreate'
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/clusters/{cluster}:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    get:
      tags: [admin]
      operationId: getClusterAdmin
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Cluster metadata, automation state and agent config sync
      responses:
        '200':
          description: Cluster.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin]
      operationId: updateCluster
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Change cluster metadata
      description: Only the given fields change (JSON merge semantics). Records `ClusterUpdated`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdate'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [admin]
      operationId: deleteCluster
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Retire a cluster
      description: |
        Soft delete: sets `deletedAt`, revokes the cluster's tokens and hides it from the lists;
        its history is kept. Records `ClusterDeleted`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReason'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/clusters/{cluster}/automation:
    parameters:
      - $ref: '#/components/parameters/Cluster'
    put:
      tags: [admin]
      operationId: setClusterAutomation
      security:
        - sessionAuth: [operator]
        - bearerAuth: [admin]
      summary: Pause or resume automation of a cluster
      description: |
        Pausing is always allowed for an operator. Resuming a cluster with environment `prod`
        needs an admin (`403`, code `admin_required`). `If-Match` is optional here, so a pause is
        never held up by a stale page; when given it is checked. With `resumeAt` the hub stops
        reporting the pause at that time (the agent does not evaluate it). Records
        `AutomationPaused` or `AutomationResumed`.
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationUpdate'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /v1/admin/automation:
    get:
      tags: [admin]
      operationId: getFleetAutomation
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Fleet-wide and per-cluster pause state
      responses:
        '200':
          description: Automation state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetAutomation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [admin]
      operationId: setFleetAutomation
      security:
        - sessionAuth: [operator]
        - bearerAuth: [admin]
      summary: Pause or resume automation of the whole fleet
      description: |
        A fleet pause applies to every cluster in addition to its own pause (a cluster is paused
        if either is). Resuming the fleet needs an admin. `If-Match` (the `fleet.version`) is
        optional, as for a cluster. Records `AutomationPaused` or `AutomationResumed`.
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationUpdate'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Automation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /v1/workloads/{id}/effective-policy:
    parameters:
      - $ref: '#/components/parameters/WorkloadID'
    get:
      tags: [ui]
      operationId: getEffectivePolicy
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Precedence chain and winning value per field
      description: |
        Computed by the hub from the hub-managed policies, the cluster's reported policy inventory
        (Git policies), the agent's reported cluster defaults and the workload's annotations and
        labels as last reported. Layers from lowest to highest precedence: built-in defaults →
        global default → cluster default (chart value) → cluster default (hub) → the winning
        policy (highest priority, ties by name) → workload override (hub) → annotations (D-005).
        `fields` lists every field with its value and the layer that set it. `agentModes` is what
        the agent last reported, so the UI can show a difference (e.g. before the next pull).
      responses:
        '200':
          description: Effective policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkloadNotFound'
  /v1/workloads/{id}/override:
    parameters:
      - $ref: '#/components/parameters/WorkloadID'
    get:
      tags: [ui]
      operationId: getWorkloadOverride
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: The workload's hub override policy
      responses:
        '200':
          description: Override.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkloadNotFound'
    put:
      tags: [ui]
      operationId: putWorkloadOverride
      security:
        - sessionAuth: [operator]
        - bearerAuth: [admin]
      summary: Create or replace the workload's override
      description: |
        Stores a hub policy of type `workload-override` named
        `ro-override-<16 hex of sha256("<namespace>/<kind>/<name>")>`, priority 900000, sent only to
        the workload's cluster, with selector `{namespaces: [ns], kinds: [kind], workloads: [ref]}`.
        Creating one needs no `If-Match`; replacing an existing one does (`428` without it).
        Setting a mode to `auto-patch` on a cluster with environment `prod` needs an admin (`403`,
        code `admin_required`). "Exclude" is an override with both modes `off`. Records
        `OverrideSet`.
        Setting a mode to `auto-patch` for a cluster that is not `AutomationReady` gives `409`, code
        `cluster_not_automation_ready`, unless an admin sends `overrideReadiness: true` (D-025).
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadOverrideInput'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkloadNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [ui]
      operationId: deleteWorkloadOverride
      security:
        - sessionAuth: [operator]
        - bearerAuth: [admin]
      summary: Clear the workload's override
      description: Soft-deletes the override policy; the workload inherits again. Records `OverrideCleared`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReason'
      responses:
        '204':
          description: Cleared.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkloadNotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/workloads/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/WorkloadID'
    post:
      tags: [ui]
      operationId: approveRecommendation
      security:
        - sessionAuth: [operator]
        - bearerAuth: [admin]
      summary: Approve the current recommendation once (D-024)
      description: |
        Records an approval for `recommendationID`, which must be the workload's latest
        recommendation (`409`, code `recommendation_stale`). Only for a workload whose effective
        mode for at least one resource is `audit` (`409`, code `not_in_audit`). The agent applies
        that recommendation once, with all guardrails, as if the `audit` resources were
        `auto-patch`, and emits `applied` with reason `ApprovedOnce`; the workload stays in
        `audit`. A new approval replaces an earlier unconsumed one. Records `WorkloadApproved`.
        On a cluster that is not `AutomationReady`: `409`, code `cluster_not_automation_ready`,
        unless an admin sends `overrideReadiness: true` (D-025).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '201':
          description: Approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/WorkloadNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/tokens:
    get:
      tags: [admin]
      operationId: listTokens
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: API tokens (never their values)
      parameters:
        - name: cluster
          in: query
          schema:
            $ref: '#/components/schemas/ClusterName'
        - name: includeRevoked
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Tokens, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: createToken
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Create an API token
      description: |
        The value is returned once, in `value`; the hub stores only its SHA-256. Role `agent` needs
        `cluster`; `ui` and `admin` must not have one. Records `TokenCreated` (without the value).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9]+$'
    delete:
      tags: [admin]
      operationId: revokeToken
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Revoke an API token
      description: |
        Sets `revokedAt`; the token stops working at once (the hub's token cache is invalidated).
        Revoking the token used for this request is allowed. Records `TokenRevoked`.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReason'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Local users
      parameters:
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Users, ordered by username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: createUser
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Create a local user
      description: |
        The password is stored as a bcrypt hash. The user must change it at first login
        (`mustChangePassword`) unless `mustChangePassword: false` is sent. Records `UserCreated`.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/users/{username}:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [admin]
      operationId: getUser
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: One local user
      responses:
        '200':
          description: User.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
    patch:
      tags: [admin]
      operationId: updateUser
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Change a user's display name, role or disabled flag
      description: |
        Only the given fields change. Disabling a user or changing the role revokes the user's
        sessions. The last enabled admin cannot be demoted or disabled (`409`, code
        `last_admin`). Records `UserUpdated`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags: [admin]
      operationId: deleteUser
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Delete a local user
      description: |
        Soft delete (`deletedAt`, sessions revoked); the username stays reserved so the audit
        trail stays unambiguous. Not for the last enabled admin (`409`, code `last_admin`).
        Records `UserDeleted`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReason'
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /v1/admin/users/{username}/reset-password:
    parameters:
      - $ref: '#/components/parameters/Username'
    post:
      tags: [admin]
      operationId: resetUserPassword
      security:
        - sessionAuth: [admin]
        - bearerAuth: [admin]
      summary: Set a new password for a user
      description: |
        Sets `password`, or a generated one returned once in `temporaryPassword` when `password`
        is omitted. Sets `mustChangePassword`, clears the lockout and revokes the user's sessions.
        Records `PasswordReset` (without the password).
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          description: Reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /v1/audit/config:
    get:
      tags: [audit]
      operationId: queryConfigAudit
      security:
        - sessionAuth: [viewer]
        - bearerAuth: [ui]
      summary: Configuration changes (audit type `config_changed`)
      description: |
        Every configuration change made through the hub API, with actor, target, before/after and
        reason, ordered by time. Stored in the audit log with type `config_changed`; served here
        and not by `GET /v1/audit`, whose items are workload events. All filters are combined with
        AND.
      parameters:
        - name: cluster
          in: query
          description: Changes whose target belongs to this cluster.
          schema:
            $ref: '#/components/schemas/ClusterName'
        - name: targetType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConfigTargetType'
        - name: targetId
          in: query
          schema:
            type: string
        - name: workloadId
          in: query
          schema:
            $ref: '#/components/schemas/WorkloadID'
        - name: actor
          in: query
          description: Actor name (username or `token:<id>`).
          schema:
            type: string
        - name: action
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConfigAction'
        - name: from
          in: query
          description: Inclusive lower bound on time.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive upper bound on time.
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/Continue'
      responses:
        '200':
          description: Changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigChangeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/datasources:
